<div class="viz-carousel" aria-label="Designer and guest review views">
 <section data-variant="Designer sharing" aria-label="Designer sharing and feedback"><div id="aipid-review-owner" class="gr-app"></div></section>
 <section data-variant="Guest comments" aria-label="Guest draft review"><div id="aipid-review-guest" class="gr-app"></div></section>
</div>
<style>
 .gr-app{color-scheme:light dark;--gr-bg:light-dark(#f5f5f4,#171717);--gr-paper:light-dark(#fff,#222);--gr-ink:light-dark(#242424,#f2f2f0);--gr-soft:light-dark(#565656,#bdbdb9);--gr-line:light-dark(#d4d4d0,#50504c);--gr-inset:light-dark(#eeeee9,#30302d);--gr-button:light-dark(#30302d,#eeeeea);--gr-on:light-dark(#fff,#242424);background:var(--gr-bg);color:var(--gr-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:1250px}
 .gr-app *{box-sizing:border-box}.gr-app [hidden]{display:none!important}.gr-app p{margin:0;overflow-wrap:anywhere}.gr-app b{font-weight:500}.gr-app h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}.gr-app h2{font-size:18px;font-weight:500;margin:0 0 14px}.gr-app h3{font-size:15px;font-weight:500;margin:0 0 8px}.gr-app .gr-small{font-size:12px;color:var(--gr-soft)}
 .gr-app .gr-chrome{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 112px 22px 28px;background:var(--gr-paper);border-bottom:1px solid var(--gr-line)}.gr-app .gr-brand{display:flex;align-items:center;gap:10px;font-weight:500}.gr-app .gr-brand svg{width:20px;height:20px}.gr-app .gr-demo{margin-left:auto}.gr-app .gr-project{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:17px 28px;background:var(--gr-paper);border-bottom:1px solid var(--gr-line)}.gr-app .gr-project p{font-weight:500}
 .gr-app .gr-shell{display:grid;grid-template-columns:210px minmax(0,1fr)}.gr-app .gr-shell.gr-guest-shell{grid-template-columns:210px minmax(0,1fr) 270px}.gr-app .gr-nav{padding:25px 14px;border-right:1px solid var(--gr-line);min-width:0}.gr-app .gr-nav h2{font-size:15px;margin:0 10px 16px}.gr-app .gr-nav ol{list-style:none;display:grid;gap:6px;margin:0;padding:0}.gr-app .gr-nav button{width:100%;min-height:44px;text-align:left;padding:11px 10px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--gr-ink);font:inherit;font-size:13px}.gr-app .gr-nav button[aria-current="location"]{background:var(--gr-inset);border-color:var(--gr-line)}.gr-app .gr-nav small{display:block;font-size:12px;color:var(--gr-soft);margin-top:5px}.gr-app .gr-nav-note{font-size:12px;color:var(--gr-soft);margin:22px 10px 0}
 .gr-app .gr-main{padding:28px;min-width:0;background:var(--gr-paper)}.gr-app .gr-description{color:var(--gr-soft);margin-bottom:20px}.gr-app .gr-notice{background:var(--gr-inset);padding:16px;border-radius:6px;margin:20px 0}.gr-app .gr-notice p+p{margin-top:12px}.gr-app .gr-field{margin:20px 0}.gr-app .gr-label{display:block;font-weight:500;margin-bottom:7px}.gr-app input[type="text"],.gr-app textarea,.gr-app select{width:100%;min-height:44px;padding:10px;border:1px solid var(--gr-line);border-radius:5px;background:var(--gr-paper);color:var(--gr-ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gr-app textarea{resize:vertical;min-height:120px}.gr-app .gr-check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:12px 0}.gr-app input[type="checkbox"]{width:20px;height:20px;flex-shrink:0;margin-top:2px}.gr-app .gr-button{max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--gr-line);border-radius:6px;background:var(--gr-paper);color:var(--gr-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gr-app .gr-primary{background:var(--gr-button);border-color:var(--gr-button);color:var(--gr-on)}.gr-app .gr-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.gr-app .gr-section{margin-top:28px;padding-top:22px;border-top:1px solid var(--gr-line)}.gr-app .gr-body{white-space:pre-wrap;overflow-wrap:anywhere}.gr-app .gr-comments{min-width:0;padding:24px 18px;border-left:1px solid var(--gr-line);background:var(--gr-bg);font-size:13px}.gr-app .gr-comments h2{font-size:16px}.gr-app .gr-comment-list{list-style:none;margin:16px 0;padding:0}.gr-app .gr-comment-list li{padding:15px 0;border-bottom:1px solid var(--gr-line)}.gr-app .gr-comment-list p+p{margin-top:8px}.gr-app .gr-comment-list .gr-body{font-size:14px}.gr-app .gr-comments .gr-field{margin:16px 0}.gr-app details{margin:20px 0;border-top:1px solid var(--gr-line);padding-top:10px}.gr-app summary{min-height:44px;padding:10px 0;font-weight:500}.gr-app details p{margin:12px 0}.gr-app .gr-footer{padding:17px 28px;border-top:1px solid var(--gr-line);font-size:12px;color:var(--gr-soft)}.gr-app .gr-error{margin:12px 0}.gr-app .gr-feedback{margin-top:10px}
 @media(max-width:960px){.gr-app .gr-shell.gr-guest-shell{grid-template-columns:210px minmax(0,1fr)}.gr-app .gr-comments{grid-column:2;border-left:0;border-top:1px solid var(--gr-line)}}
 @media(max-width:650px){.gr-app{min-height:1550px}.gr-app .gr-shell,.gr-app .gr-shell.gr-guest-shell{grid-template-columns:minmax(0,1fr)}.gr-app .gr-nav{border-right:0;border-bottom:1px solid var(--gr-line)}.gr-app .gr-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}.gr-app .gr-comments{grid-column:1}.gr-app .gr-main{padding:24px 18px}.gr-app .gr-chrome{padding-left:18px}.gr-app .gr-project{padding:17px 18px}}
</style>
<script>
(()=>{
 const owner=document.getElementById('aipid-review-owner'),guest=document.getElementById('aipid-review-guest');
 const documents={
  analysis:{label:'Analysis brief',version:1,items:[{id:'gap',kind:'Section',title:'Performance gap',body:'Current complaint-routing decisions do not consistently match the intended procedure. Evidence, desired performance, and underlying causes still need review. This statement is an illustrative hypothesis.',note:'Supporting evidence and cause verification remain open.'},{id:'evaluation',kind:'Section',title:'Evaluation planning',body:'Plan L4 results, L3 workplace behaviors, and applicable L2 learning evidence. The learning route must be confirmed before defining instructional measures.',note:'Evaluation execution is outside this MVP.'}]},
  design:{label:'Detailed Design plan',version:1,items:[{id:'LO-1',kind:'Objective',title:'Make and explain routing decisions',body:'Select the appropriate complaint response and routing path, and explain the decision using the applicable criteria.',note:'LO-1 · Apply. Conditions: representative cases and the approved guide. Criteria and evidence links remain subject to review.'},{id:'EO-1.1',kind:'Enabling objective',title:'Find the relevant information',body:'Identify the complaint details needed to apply the routing criteria.',note:'EO-1.1 · Understand. Exact details require an approved source.'},{id:'A-1',kind:'Assessment',title:'Assessment 1 — Route a damaged-item complaint',body:'Fictional exercise: A customer reports that an item arrived damaged. Using the exercise guide, identify the relevant detail, classify the complaint, choose the response/routing path, and explain the rule that supports your decision.',note:'Fictional answer: damaged item → damaged-item complaint → resolution team, citing exercise rule 2. Four sample rubric criteria: relevant detail, category, route, explanation. All four required in this example; organizational validation is pending.'},{id:'source-map',kind:'Section',title:'Content and source map',body:'Source questions are set once for the project. Map approved sources to each enabling objective and flag missing, partial, or conflicting support.',note:'Approved complaint-handling procedure missing.'}]},
  storyline:{label:'Storyline storyboard',version:2,items:[{id:'SL-02',kind:'Screen',title:'Check required information',body:'Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]\n[What to do when details are missing — approved source needed]',note:'Accepted sample treatment: text checklist on one screen. All essential content remains on screen. EO-1.1 · Understand.'},{id:'SL-05',kind:'Screen',title:'Choose a route',body:'Use the guide to choose the response and routing path. Explain how the complaint meets the relevant criteria.\n\n[Current approved routing criteria and worked example needed]',note:'Needs update. The current guide and worked example require review. EO-1.3 · Apply.'},{id:'SL-06',kind:'Screen / assessment',title:'Integrated assessment',body:'Assessment 1 — Route a damaged-item complaint. Carry forward the linked Design task, expected response, feedback, rubric, and retry rules.',note:'Written response with facilitator review is proposed. Organizational answer verification, collection arrangements, and tool feasibility remain open.'}]},
  rise:{label:'Rise storyboard',version:2,items:[{id:'RI-02',kind:'Block group',title:'Check required information',body:'Heading: Check required information\nText: Before choosing a route, check the information available in the complaint.\nText/list: [Required details — approved source needed]',note:'EO-1.1 · Understand. Proposed text-first block sequence; final block and navigation feasibility need review.'},{id:'RI-05',kind:'Block group',title:'Choose a route',body:'[Approved routing explanation and worked example needed]',note:'EO-1.3 · Apply. Preserve the reviewed task and source relationships.'}]},
  aid:{label:'Written job aid / performance-support draft',version:2,items:[{id:'AID-02',kind:'Support section',title:'Check required information',body:'Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]\n[What to do when details are missing — approved source needed]',note:'Use a short, text-first checklist. Keep a logical reading order. This structural draft is not ready for real use.'},{id:'AID-04',kind:'Support section',title:'Choose the escalation route',body:'[Approved routing rules and decision steps needed]',note:'The learning-aid example links to LO-1 and EO-1.3. A solely nonlearning aid would use task/performance requirements instead.'}]}
 };
 const state={ownerView:'share',draft:'storyline',includeSource:false,share:{id:'review-1',type:'storyline',includeSource:false},nextShare:2,active:'SL-02',name:'',drafts:{},comments:[{id:'comment-1',share:'review-1',type:'storyline',anchor:'SL-02',name:'Morgan · sample reviewer',text:'The distinction between the checklist and the missing procedure details is clear. Please confirm what happens when a required detail is unavailable.'}],nextComment:2};
 let timer,error='';
 const doc=()=>documents[state.share.type],item=()=>doc().items.find(x=>x.id===state.active)||doc().items[0],draftKey=()=>state.share.id+':'+state.active;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(label,action,primary=false)=>`<button type="button" class="gr-button cursor-interaction${primary?' gr-primary':''}" data-action="${action}">${label}</button>`;
 function persist(){const snapshot={modelContent:{screen:'Guest review wireframe',sharedDraft:state.share.type,sharedVersion:doc().version,selectedAnchor:state.active,sourceExcerptIncluded:state.share.includeSource,commentCount:state.comments.length,commentAnchors:state.comments.map(x=>({share:x.share,type:x.type,anchor:x.anchor})),linkPolicyProposal:'fixed-version snapshot',displayNamePolicyProposal:'required unverified display name'},privateContent:{kind:'guest-review-v1',...state}};if(new Blob([JSON.stringify(snapshot)]).size>15000)return;try{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(snapshot)).catch(()=>{});}catch{}}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='guest-review-v1')return;state.ownerView=p.ownerView==='comments'?'comments':'share';if(documents[p.draft])state.draft=p.draft;state.includeSource=p.includeSource===true;if(p.share&&documents[p.share.type])state.share={id:String(p.share.id||'review-1').slice(0,30),type:p.share.type,includeSource:p.share.includeSource===true};state.active=doc().items.some(x=>x.id===p.active)?p.active:doc().items[0].id;state.name=String(p.name||'').slice(0,50);state.nextShare=Number.isInteger(p.nextShare)?Math.max(2,p.nextShare):2;state.nextComment=Number.isInteger(p.nextComment)?Math.max(2,p.nextComment):2;state.drafts={};if(p.drafts&&typeof p.drafts==='object')for(const [key,value]of Object.entries(p.drafts).slice(-12))state.drafts[key.slice(0,70)]=String(value).slice(0,300);if(Array.isArray(p.comments))state.comments=p.comments.filter(x=>documents[x.type]?.items.some(i=>i.id===x.anchor)).slice(0,8).map(x=>({id:String(x.id).slice(0,30),share:String(x.share).slice(0,30),type:x.type,anchor:x.anchor,name:String(x.name).slice(0,50),text:String(x.text).slice(0,300)}));}
 function chrome(role){return `<header class="gr-chrome"><span class="gr-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="gr-small gr-demo">Wireframe · Sample data</span></header><div class="gr-project"><div><span class="gr-small">Customer complaint escalation</span><p>${role}</p></div><span class="gr-small">Optional peer review</span></div>`;}
 function footer(){return '<footer class="gr-footer">Illustrative preview · No live saving, sharing, or AI connection<p class="gr-feedback" role="status" aria-live="polite"></p></footer>';}
 function renderOwner(){owner.innerHTML=`${chrome('Designer · Share a draft')}<div class="gr-shell"><nav class="gr-nav" aria-label="Review management"><h2>Peer review</h2><ol><li><button type="button" class="cursor-interaction" data-owner="share"${state.ownerView==='share'?' aria-current="location"':''}>Share draft</button></li><li><button type="button" class="cursor-interaction" data-owner="comments"${state.ownerView==='comments'?' aria-current="location"':''}>Guest comments<small>${state.comments.length} illustrative comment(s)</small></button></li></ol><p class="gr-nav-note">Guests comment on your draft. You control edits and progression.</p></nav><main class="gr-main">${state.ownerView==='share'?shareForm():ownerComments()}</main></div>${footer()}`;}
 function shareForm(){return `<h1>Share a draft for comments</h1><p class="gr-description">Choose the draft snapshot and any supporting material reviewers should see.</p><div class="gr-field"><label class="gr-label" for="gr-document">Draft to review</label><select id="gr-document" data-draft>${Object.entries(documents).map(([key,d])=>`<option value="${key}"${state.draft===key?' selected':''}>${esc(d.label)} · version ${d.version} (example)</option>`).join('')}</select></div><div class="gr-notice"><h2>Who can access this draft?</h2><p>Anyone with the active review link can view the selected draft and add comments without an account. Comments use a display name; the name does not verify identity.</p><p>Reviewers cannot directly edit the draft or approve your stage progression.</p></div><h2 class="gr-section">What will be shared?</h2><ul><li>The selected draft snapshot and its review targets.</li><li>Included objective/assessment details, source references, and visible open issues.</li><li>Comments on this shared version.</li></ul><label class="gr-check cursor-interaction"><input type="checkbox" data-source${state.includeSource?' checked':''}><span>Include the fictional exercise-guide excerpt<small class="gr-small" style="display:block">Optional supporting material. Raw uploads and private working notes are not automatically shared.</small></span></label><div class="gr-notice"><h3>Fixed version · proposed link behavior</h3><p>The link stays tied to the version you share. Later edits do not replace it. Sharing an updated draft creates a new link; earlier comments keep their original version references.</p></div>${btn('Create example review link','create',true)}<div class="gr-field"><label class="gr-label" for="gr-link">Current example link · ${esc(doc().label)} · version ${doc().version}</label><input id="gr-link" type="text" readonly value="aipoweredid.example/review/${esc(state.share.id)}"><p class="gr-small">Inactive example address. No real link or invitation is created. Switch to Guest comments below to try the reviewer view.</p></div><p class="gr-small">This preview includes representative review targets rather than the entire example document.</p>`;}
 function commentList(comments){return `<ol class="gr-comment-list">${comments.map(c=>{const d=documents[c.type],a=d.items.find(x=>x.id===c.anchor);return `<li><p><b>${esc(c.name)}</b></p><p class="gr-small">${esc(d.label)} · version ${d.version}<br>${esc(a.kind)}: ${esc(a.title)}</p><p class="gr-body">${esc(c.text)}</p></li>`;}).join('')||'<li>No comments on this item yet.</li>'}</ol>`;}
 function ownerComments(){return `<h1>Guest comments</h1><p class="gr-description">Feedback stays attached to the reviewed item and draft version. Comments do not change your content or become AI instructions automatically.</p>${commentList(state.comments)}<div class="gr-notice"><h2>Use feedback when you are ready</h2><p>Return to the relevant draft to make your own edits or request a targeted AI revision. Peer comments remain optional; you control whether and how to act on them.</p></div>`;}
 function renderGuest(){const d=doc(),a=item(),comments=state.comments.filter(c=>c.share===state.share.id&&c.anchor===a.id);guest.innerHTML=`${chrome('Guest · Review a shared draft')}<div class="gr-shell gr-guest-shell"><nav class="gr-nav" aria-label="Shared draft review targets"><h2>${esc(d.label)}</h2><p class="gr-small" style="margin:0 10px 14px">Version ${d.version} · fixed snapshot</p><ol>${d.items.map(i=>`<li><button type="button" class="cursor-interaction" data-anchor="${i.id}"${a.id===i.id?' aria-current="location"':''}>${esc(i.title)}<small>${esc(i.kind)} · ${state.comments.filter(c=>c.share===state.share.id&&c.anchor===i.id).length} comment(s)</small></button></li>`).join('')}</ol><p class="gr-nav-note">Read and comment. No account is required. Your name is shown with your comments.</p></nav><main class="gr-main"><p class="gr-small">${esc(a.kind)} · version ${d.version} · draft</p><h1>${esc(a.title)}</h1><p class="gr-description">This draft is read-only. Your comment will be attached to this item in this shared version.</p><h2 class="gr-section">Draft content</h2><p class="gr-body">${esc(a.body)}</p><div class="gr-notice"><h2>Review notes and open issues</h2><p>${esc(a.note)}</p><p class="gr-small">All content is fictional sample data. Factual/source verification is still pending.</p></div><details><summary class="cursor-interaction">Supporting material shared with this draft</summary>${state.share.includeSource?'<p>Fictional exercise-guide excerpt: representatives handle routine order-status questions; damaged-item complaints go to the resolution team.</p><p class="gr-small">Invented example rules, not approved organizational procedure.</p>':'<p>No supporting source excerpt was shared. Source references and visible gaps remain in the draft, but raw uploads and private notes are unavailable through this review.</p>'}</details></main><aside class="gr-comments" aria-label="Comments on selected review target"><h2>Comments on this item</h2>${commentList(comments)}<form data-comment-form><div class="gr-field"><label class="gr-label" for="gr-name">Your name</label><input id="gr-name" name="display-name" type="text" maxlength="50" autocomplete="nickname" value="${esc(state.name)}" required><p class="gr-small">Shown with comments. No account or verified identity.</p></div><div class="gr-field"><label class="gr-label" for="gr-comment">Comment on “${esc(a.title)}”</label><textarea id="gr-comment" name="comment" maxlength="300" rows="4" required>${esc(state.drafts[draftKey()]||'')}</textarea><p class="gr-small">Attached to this ${esc(a.kind.toLowerCase())} · version ${d.version}.</p></div><p class="gr-error" role="alert"${error?'':' hidden'}>${esc(error)}</p><button type="submit" class="gr-button gr-primary cursor-interaction">Post comment in preview</button><p class="gr-small" style="margin-top:12px">Posting here updates only these example views. No comment is sent to another person.</p></form></aside></div>${footer()}`;}
 function render(){renderOwner();renderGuest();try{globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}catch{}}
 function say(root,text){root.querySelector('.gr-feedback').textContent=text;}
 owner.addEventListener('change',e=>{if(e.target.hasAttribute('data-draft'))state.draft=e.target.value;if(e.target.hasAttribute('data-source'))state.includeSource=e.target.checked;persist();});
 owner.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.owner){state.ownerView=b.dataset.owner;renderOwner();owner.querySelector(`[data-owner="${state.ownerView}"]`)?.focus();persist();}if(b.dataset.action==='create'){state.share={id:'review-'+state.nextShare++,type:state.draft,includeSource:state.includeSource};state.active=doc().items[0].id;error='';render();persist();owner.querySelector('#gr-link')?.focus();say(owner,'Example snapshot created. No live link or invitation was sent. Earlier comments retain their original references.');}});
 guest.addEventListener('click',e=>{const b=e.target.closest('button[data-anchor]');if(!b)return;state.active=b.dataset.anchor;error='';renderGuest();guest.querySelector(`[data-anchor="${state.active}"]`)?.focus();persist();say(guest,'Selected '+item().kind.toLowerCase()+': '+item().title);});
 guest.addEventListener('input',e=>{if(e.target.id==='gr-name')state.name=e.target.value.slice(0,50);if(e.target.id==='gr-comment')state.drafts[draftKey()]=e.target.value.slice(0,300);clearTimeout(timer);timer=setTimeout(persist,600);});
 guest.addEventListener('submit',e=>{if(!e.target.hasAttribute('data-comment-form'))return;e.preventDefault();const text=String(state.drafts[draftKey()]||'').trim();if(!state.name.trim()||!text){error='Enter a display name and a comment.';}else if(state.comments.length>=8){error='This illustrative preview holds eight comments. The product comment limit is not decided.';}else{state.comments.push({id:'comment-'+state.nextComment++,share:state.share.id,type:state.share.type,anchor:item().id,name:state.name.trim(),text});state.drafts[draftKey()]='';error='';}render();persist();guest.querySelector(error&&!state.name.trim()?'#gr-name':'#gr-comment')?.focus();if(!error)say(guest,'Comment added in this preview and visible in Designer sharing. No external message was sent.');});
 restore(window.openai?.widgetState);render();
 let sharedHeight=0;
 function alignStages(){const floor=window.matchMedia('(max-width:650px)').matches?1550:1250;for(const r of [owner,guest]){const natural=[...r.children].reduce((sum,child)=>sum+child.getBoundingClientRect().height,0);sharedHeight=Math.max(sharedHeight,floor,Math.ceil(natural));}for(const r of [owner,guest])if(r.style.minHeight!==sharedHeight+'px')r.style.minHeight=sharedHeight+'px';}
 if(globalThis.ResizeObserver){const resize=new ResizeObserver(alignStages);resize.observe(owner);resize.observe(guest);}window.addEventListener('resize',()=>{sharedHeight=0;alignStages();});alignStages();
 window.addEventListener('openai:set_globals',e=>{if((owner.contains(document.activeElement)||guest.contains(document.activeElement))&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;const s=e.detail?.globals?.widgetState;if(s?.privateContent?.kind==='guest-review-v1'){restore(s);render();}});
})();
</script>
