<div id="aipid-brief-wireframe" class="br-app" aria-label="Analysis brief review wireframe">
  <header class="br-chrome"><div class="br-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i><span>AIPoweredID</span></div><span class="br-demo">Wireframe · Sample data</span></header>
  <div class="br-projectbar"><div><span class="br-small">Project</span><p>Customer complaint escalation</p></div><ol class="br-stages" aria-label="Project stages"><li data-stage="Analysis" aria-current="step">Analysis</li><li data-stage="Design">Design</li><li>Development</li></ol></div>
  <div class="br-shell"><nav class="br-nav" aria-label="Brief sections"></nav><main class="br-main" aria-label="Analysis brief"></main><aside class="br-panel" id="br-context-panel" aria-label="Contextual information" hidden></aside></div>
  <footer class="br-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="br-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
  #aipid-brief-wireframe {color-scheme:light dark;--br-bg:light-dark(#f5f5f4,#171717);--br-paper:light-dark(#ffffff,#222222);--br-ink:light-dark(#242424,#f2f2f0);--br-soft:light-dark(#565656,#bdbdb9);--br-line:light-dark(#d4d4d0,#50504c);--br-inset:light-dark(#eeeee9,#30302d);--br-button:light-dark(#30302d,#eeeeea);--br-button-text:light-dark(#ffffff,#242424);--br-spacing:18px;background:var(--br-bg);color:var(--br-ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;font-weight:400;}
  #aipid-brief-wireframe * {box-sizing:border-box;}
  #aipid-brief-wireframe [hidden] {display:none !important;}
  #aipid-brief-wireframe p {margin:0;}
  #aipid-brief-wireframe .br-chrome {display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 112px 22px 28px;background:var(--br-paper);border-bottom:1px solid var(--br-line);}
  #aipid-brief-wireframe .br-brand {display:flex;align-items:center;gap:10px;font-weight:500;}
  #aipid-brief-wireframe .br-brand svg {width:20px;height:20px;}
  #aipid-brief-wireframe .br-demo {margin-left:auto;color:var(--br-soft);font-size:12px;}
  #aipid-brief-wireframe .br-projectbar {display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--br-paper);border-bottom:1px solid var(--br-line);}
  #aipid-brief-wireframe .br-projectbar p {font-weight:500;}
  #aipid-brief-wireframe .br-small {font-size:12px;color:var(--br-soft);}
  #aipid-brief-wireframe .br-stages {list-style:none;display:flex;flex-wrap:wrap;gap:18px;padding:0;margin:0;color:var(--br-soft);font-size:13px;}
  #aipid-brief-wireframe .br-stages [aria-current="step"] {font-weight:500;color:var(--br-ink);text-decoration:underline;text-underline-offset:6px;}
  #aipid-brief-wireframe .br-shell {display:grid;grid-template-columns:200px minmax(0,1fr);min-height:680px;}
  #aipid-brief-wireframe .br-shell.br-with-panel {grid-template-columns:200px minmax(0,1fr) 240px;}
  #aipid-brief-wireframe .br-nav {padding:25px 14px;border-right:1px solid var(--br-line);min-width:0;}
  #aipid-brief-wireframe .br-nav-title {font-weight:500;margin:0 10px 17px;}
  #aipid-brief-wireframe .br-nav-list {list-style:none;padding:0;margin:0;display:grid;gap:5px;}
  #aipid-brief-wireframe .br-nav-button {font:inherit;font-size:13px;border:1px solid transparent;border-radius:5px;color:var(--br-ink);background:transparent;width:100%;padding:11px 10px;text-align:left;display:flex;gap:8px;align-items:flex-start;}
  #aipid-brief-wireframe .br-nav-button[aria-current="location"] {background:var(--br-inset);border-color:var(--br-line);}
  #aipid-brief-wireframe .br-nav-status {display:block;font-size:12px;color:var(--br-soft);margin-top:4px;}
  #aipid-brief-wireframe .br-nav-note {font-size:12px;color:var(--br-soft);margin:24px 10px 0;}
  #aipid-brief-wireframe .br-main {padding:28px;background:var(--br-paper);min-width:0;}
  #aipid-brief-wireframe .br-button {font:inherit;font-weight:500;color:var(--br-ink);background:var(--br-paper);border:1px solid var(--br-line);border-radius:6px;padding:9px 12px;min-height:42px;max-width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center;}
  #aipid-brief-wireframe .br-button:hover {filter:brightness(.94);}
  #aipid-brief-wireframe .br-button svg {width:16px;height:16px;flex-shrink:0;}
  #aipid-brief-wireframe .br-primary {background:var(--br-button);color:var(--br-button-text);border-color:var(--br-button);}
  #aipid-brief-wireframe .br-compact {font-size:13px;padding:6px 10px;min-height:36px;}
  #aipid-brief-wireframe .br-topline {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  #aipid-brief-wireframe .br-tools {display:flex;gap:8px;flex-wrap:wrap;}
  #aipid-brief-wireframe h1 {font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px;}
  #aipid-brief-wireframe h2 {font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px;}
  #aipid-brief-wireframe .br-description {color:var(--br-soft);margin-bottom:20px;}
  #aipid-brief-wireframe .br-draft-line {display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:23px;font-size:12px;color:var(--br-soft);}
  #aipid-brief-wireframe .br-tag {display:inline-flex;align-items:center;background:var(--br-inset);border-radius:4px;padding:4px 8px;font-size:12px;color:var(--br-ink);}
  #aipid-brief-wireframe .br-sections {display:grid;gap:12px;}
  #aipid-brief-wireframe .br-section {border:1px solid var(--br-line);border-radius:7px;min-width:0;background:var(--br-paper);}
  #aipid-brief-wireframe .br-section summary {padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;font-weight:500;}
  #aipid-brief-wireframe .br-section summary::-webkit-details-marker {display:none;}
  #aipid-brief-wireframe .br-summary-left {display:flex;align-items:center;gap:9px;min-width:0;}
  #aipid-brief-wireframe .br-summary-left svg {width:16px;height:16px;flex-shrink:0;}
  #aipid-brief-wireframe .br-section[open] .br-summary-left svg {transform:rotate(90deg);}
  #aipid-brief-wireframe .br-status {font-size:12px;font-weight:400;color:var(--br-soft);white-space:nowrap;}
  #aipid-brief-wireframe .br-section-content {padding:0 18px 18px;}
  #aipid-brief-wireframe .br-origin {font-size:12px;color:var(--br-soft);padding:0 0 18px;}
  #aipid-brief-wireframe .br-fields {display:grid;gap:var(--br-spacing);}
  #aipid-brief-wireframe .br-field-label {display:block;font-size:13px;font-weight:500;margin-bottom:5px;}
  #aipid-brief-wireframe .br-field-value {white-space:pre-line;overflow-wrap:anywhere;}
  #aipid-brief-wireframe textarea,#aipid-brief-wireframe input[type="text"] {font:inherit;font-size:16px;line-height:1.5;color:var(--br-ink);background:var(--br-paper);border:1px solid var(--br-line);border-radius:5px;padding:10px 12px;width:100%;min-height:44px;}
  #aipid-brief-wireframe textarea {display:block;resize:vertical;}
  #aipid-brief-wireframe .br-source-list {display:flex;gap:8px;flex-wrap:wrap;margin-top:19px;}
  #aipid-brief-wireframe .br-section-actions {display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--br-line);}
  #aipid-brief-wireframe .br-edit-hint {font-size:12px;color:var(--br-soft);margin:12px 0 0;}
  #aipid-brief-wireframe .br-actions {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--br-line);}
  #aipid-brief-wireframe .br-actions-group {display:flex;gap:9px;flex-wrap:wrap;}
  #aipid-brief-wireframe .br-footnote {font-size:12px;color:var(--br-soft);margin-top:13px;}
  #aipid-brief-wireframe .br-panel {padding:25px 19px;border-left:1px solid var(--br-line);background:var(--br-bg);min-width:0;}
  #aipid-brief-wireframe .br-panel-header {display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px;}
  #aipid-brief-wireframe .br-panel-header h2 {margin:0;}
  #aipid-brief-wireframe .br-panel p {font-size:13px;margin-bottom:15px;}
  #aipid-brief-wireframe .br-panel h3 {font-size:14px;font-weight:500;margin:19px 0 8px;}
  #aipid-brief-wireframe .br-source {border-top:1px solid var(--br-line);padding-top:15px;margin-top:17px;}
  #aipid-brief-wireframe .br-source:first-of-type {border-top:0;}
  #aipid-brief-wireframe .br-source blockquote {padding:0 0 0 11px;margin:10px 0;border-left:2px solid var(--br-line);font-size:13px;}
  #aipid-brief-wireframe .br-footer {padding:15px 28px;border-top:1px solid var(--br-line);font-size:12px;color:var(--br-soft);}
  #aipid-brief-wireframe .br-live {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
  #aipid-brief-wireframe .br-notice {background:var(--br-inset);border-radius:6px;padding:17px 18px;margin:22px 0;}
  #aipid-brief-wireframe .br-notice p+p {margin-top:10px;}
  #aipid-brief-wireframe .br-readout {display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px 18px;margin:24px 0;}
  #aipid-brief-wireframe .br-readout dt {font-size:13px;color:var(--br-soft);}
  #aipid-brief-wireframe .br-readout dd {margin:0;overflow-wrap:anywhere;}
  #aipid-brief-wireframe .br-preview-boxes {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px;}
  #aipid-brief-wireframe .br-preview-box {border:1px solid var(--br-line);border-radius:6px;padding:17px;background:var(--br-paper);}
  #aipid-brief-wireframe .br-preview-box h2 {font-size:15px;margin-bottom:10px;}
  #aipid-brief-wireframe .br-preview-box p {font-size:13px;}
  #aipid-brief-wireframe .br-preview-box p+p {margin-top:12px;}
  @media(max-width:960px) {
    #aipid-brief-wireframe .br-shell.br-with-panel {grid-template-columns:180px minmax(0,1fr);}
    #aipid-brief-wireframe .br-shell.br-with-panel .br-panel {grid-column:2;grid-row:2;border-left:0;border-top:1px solid var(--br-line);}
    #aipid-brief-wireframe .br-shell.br-with-panel .br-nav {grid-row:1/3;}
  }
  @media(max-width:650px) {
    #aipid-brief-wireframe .br-shell,#aipid-brief-wireframe .br-shell.br-with-panel {grid-template-columns:minmax(0,1fr);}
    #aipid-brief-wireframe .br-shell.br-with-panel .br-nav {grid-row:auto;}
    #aipid-brief-wireframe .br-shell.br-with-panel .br-panel {grid-column:1;grid-row:auto;}
    #aipid-brief-wireframe .br-nav {padding:20px 18px;border-right:0;border-bottom:1px solid var(--br-line);}
    #aipid-brief-wireframe .br-nav-list {grid-template-columns:repeat(2,minmax(0,1fr));}
    #aipid-brief-wireframe .br-main {padding:24px 18px;}
    #aipid-brief-wireframe .br-chrome {padding:20px 100px 20px 18px;}
    #aipid-brief-wireframe .br-demo {margin-left:0;}
    #aipid-brief-wireframe .br-projectbar,#aipid-brief-wireframe .br-footer {padding-left:18px;padding-right:18px;}
    #aipid-brief-wireframe .br-section summary {align-items:flex-start;flex-wrap:wrap;}
    #aipid-brief-wireframe .br-readout {grid-template-columns:minmax(0,1fr);gap:6px;}
    #aipid-brief-wireframe .br-readout dd {margin-bottom:12px;}
    #aipid-brief-wireframe .br-preview-boxes {grid-template-columns:minmax(0,1fr);}
  }
</style>
<script>
(() => {
  const root=document.getElementById('aipid-brief-wireframe');
  const main=root.querySelector('.br-main'),nav=root.querySelector('.br-nav'),panel=root.querySelector('.br-panel'),shell=root.querySelector('.br-shell');
  const sections=[
    {title:'Project and performance gap',short:'Performance gap',origin:'Synthesized from your responses',sources:[1],fields:[['Workplace task','Responding to customer complaints.'],['Desired performance','Resolve routine complaints independently and escalate cases meeting the approved criteria.'],['Current performance','Some routine complaints are escalated unnecessarily, while some cases requiring escalation are missed.'],['Reason for the project','Improve consistency in complaint handling and reduce avoidable escalations.']]},
    {title:'Evidence and possible causes',short:'Evidence and causes',origin:'Source summary and AI interpretation — verify the distinction',sources:[0,1],fields:[['Supporting evidence','The sample supervisor notes describe inconsistent routing decisions. The sample procedure describes the criteria to apply.'],['Possible causes — AI interpretation','A knowledge/skill gap or inconsistent expectations and feedback may contribute. The available evidence does not establish either as the cause.'],['Evidence gaps','Direct observation of how representatives use the guide is still needed.']]},
    {title:'Audience and work environment',short:'Audience',origin:'Synthesized from your responses; unknowns remain visible',sources:[],fields:[['Audience and existing knowledge','Customer service representatives familiar with complaint logging. Familiarity with escalation criteria varies.'],['Use context and technology','Work occurs on desktop browsers. Reference material needs to be usable during complaint handling.'],['Language, access, and audience differences','Additional language and access needs are not yet confirmed. New hires may need more foundational support; validate this with the subject-matter expert.']]},
    {title:'Stakeholders and constraints',short:'Stakeholders',origin:'From stakeholder and project-constraint responses',sources:[],fields:[['Review roles and availability','Subject-matter expert: 30 minutes each week; expected turnaround of two business days. Project sponsor: final project decisions.'],['Timeline and resources','Project deadline and production resources need confirmation.'],['Requirements and boundaries','Use the applicable escalation procedure. Operational policy changes require the relevant business owner; this project does not implement them.']]},
    {title:'Evaluation plan',short:'Evaluation plan',origin:'L4 → L3 → L2 planning; evaluation execution is outside this MVP',sources:[1],fields:[['L4 — Results','Indicator: avoidable escalation rate. Baseline and target: not known yet. Data source: proposed complaint records. Confirm data access, ownership, and follow-up timing.'],['L3 — Behavior','Observe whether representatives use the guide and apply the appropriate routing criteria in real cases. Define the work-sample review schedule and responsible reviewer.'],['L2 — Learning','If learning is needed, use scenario-based routing tasks with the approved guide. Evidence: the selected path and explanation match the applicable criteria. Detailed questions, answers, and scoring are defined in Design. Confirm L2 applicability in the Six Boxes review.']]},
    {title:'Open questions and assumptions',short:'Open items',origin:'Unresolved items to carry into Design; no invented answers',sources:[],fields:[['Questions to resolve','Confirm the project deadline and available production resources.\nConfirm additional language and access needs.'],['Assumption requiring confirmation','The selected procedure is the applicable current version. Confirm this with the subject-matter expert before final build specifications are approved.']]}
  ];
  const sources=[{title:'Sample supervisor notes',location:'Section 2 · Routing observations',text:'Routine complaints have sometimes been escalated unnecessarily. Some complaints needing escalation were routed incorrectly.'},{title:'Sample escalation procedure',location:'Section 1 · Routing criteria',text:'Use the applicable complaint category and escalation criteria to determine the response and routing path.'}];
  const state={view:'brief',open:[0],active:0,editing:[],reviewed:[],values:sections.map(s=>s.fields.map(f=>f[1])),panel:null,source:0,spacing:18,shareCreated:false,baseline:null};
  const userToggles=new WeakSet();
  let saveTimer;
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});};
  const announce=text=>{root.querySelector('.br-live').textContent=text;};
  function persist(){
    if(!window.openai||typeof window.openai.setWidgetState!=='function')return false;
    const payload={modelContent:{screen:'Analysis brief review wireframe',view:state.view,reviewedSections:state.reviewed.map(i=>sections[i].short),panel:state.panel,handoffConfirmed:!!state.baseline},privateContent:state};
    if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;
    window.openai.setWidgetState(payload).catch(()=>{});return true;
  }
  function restore(saved){
    const p=saved&&saved.privateContent;if(!p||typeof p!=='object')return;
    if(['brief','share','handoff','paused','design'].includes(p.view))state.view=p.view;
    for(const key of ['open','editing','reviewed'])if(Array.isArray(p[key]))state[key]=Array.from(new Set(p[key].filter(i=>Number.isInteger(i)&&i>=0&&i<6)));
    if(Number.isInteger(p.active)&&p.active>=0&&p.active<6)state.active=p.active;
    if(Array.isArray(p.values))sections.forEach((s,i)=>s.fields.forEach((f,j)=>{if(p.values[i]&&typeof p.values[i][j]==='string')state.values[i][j]=p.values[i][j].slice(0,1200);}));
    if([null,'sources','guidance'].includes(p.panel))state.panel=p.panel;
    if(p.source===0||p.source===1)state.source=p.source;
    if(Number.isFinite(p.spacing))state.spacing=Math.max(12,Math.min(26,p.spacing));
    if(typeof p.shareCreated==='boolean')state.shareCreated=p.shareCreated;
    if(p.baseline&&typeof p.baseline==='object'&&typeof p.baseline.label==='string')state.baseline={label:p.baseline.label,task:typeof p.baseline.task==='string'?p.baseline.task:'',desired:typeof p.baseline.desired==='string'?p.baseline.desired:'',current:typeof p.baseline.current==='string'?p.baseline.current:''};
  }
  function setSave(text){const el=main.querySelector('[data-save]');if(el)el.textContent=text;}
  function flush(){clearTimeout(saveTimer);setSave(persist()?'Preview · Saved':'Preview · Kept in this open view');}
  function scheduleSave(){setSave('Preview · Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,1000);}
  function sectionMarkup(s,i){
    const editing=state.editing.includes(i),reviewed=state.reviewed.includes(i);
    return `<details class="br-section" data-detail="${i}" ${state.open.includes(i)?'open':''}><summary class="cursor-interaction"><span class="br-summary-left"><i data-lucide="chevron-right" aria-hidden="true"></i>${esc(s.title)}</span><span class="br-status" data-status="${i}">${reviewed?'Reviewed':'Needs review'}</span></summary><div class="br-section-content"><p class="br-origin">${esc(s.origin)}</p><div class="br-fields">${s.fields.map((f,j)=>`<div>${editing?`<label class="br-field-label" for="br-field-${i}-${j}">${esc(f[0])}</label><textarea id="br-field-${i}-${j}" rows="3" maxlength="1200" data-section="${i}" data-field="${j}">${esc(state.values[i][j])}</textarea>`:`<span class="br-field-label">${esc(f[0])}</span><p class="br-field-value">${esc(state.values[i][j])}</p>`}</div>`).join('')}</div>${s.sources.length?`<div class="br-source-list">${s.sources.map(index=>`<button class="br-button br-compact cursor-interaction" type="button" data-source="${index}"><i data-lucide="file-text" aria-hidden="true"></i>${esc(sources[index].title)}</button>`).join('')}</div>`:''}<div class="br-section-actions"><button class="br-button br-compact cursor-interaction" type="button" data-action="edit" data-index="${i}">${editing?'Done editing':'Edit section'}</button><button class="br-button br-compact cursor-interaction" type="button" data-action="review" data-index="${i}">${reviewed?'Mark needs review':'Mark reviewed'}</button></div>${editing?'<p class="br-edit-hint">Edits save automatically in the preview. Mark reviewed when ready.</p>':''}</div></details>`;
  }
  function topTools(){return `<div class="br-topline"><span class="br-small" role="status" aria-live="polite" data-save>Preview · Saved</span><div class="br-tools"><button class="br-button br-compact cursor-interaction" type="button" data-action="sources" aria-controls="br-context-panel" aria-expanded="${state.panel==='sources'}"><i data-lucide="files" aria-hidden="true"></i>Sources</button><button class="br-button br-compact cursor-interaction" type="button" data-action="guidance" aria-controls="br-context-panel" aria-expanded="${state.panel==='guidance'}"><i data-lucide="circle-help" aria-hidden="true"></i>Guidance</button></div></div>`;}
  function briefMarkup(){return `${topTools()}<h1>Review Analysis brief</h1><p class="br-description">Refine the summary and confirm what should guide the next stage.</p><div class="br-draft-line"><span class="br-tag">AI draft for review</span><span>Version 1 · Example content</span><span>Open items carry forward visibly</span></div><div class="br-sections">${sections.map(sectionMarkup).join('')}</div><div class="br-actions"><button class="br-button cursor-interaction" type="button" data-action="pause"><i data-lucide="pause" aria-hidden="true"></i>Save and return later</button><div class="br-actions-group"><button class="br-button cursor-interaction" type="button" data-action="share"><i data-lucide="message-square" aria-hidden="true"></i>Share for comments</button><button class="br-button br-primary cursor-interaction" type="button" data-action="handoff">Generate Design skeleton<i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div><p class="br-footnote">Design starts with the Six Boxes performance-solution review. Confirm L2 measures before instructional Design proceeds.</p>`;}
  function shareMarkup(){return `<button class="br-button br-compact cursor-interaction" type="button" data-action="brief"><i data-lucide="arrow-left" aria-hidden="true"></i>Back to brief</button><h1 style="margin-top:23px">Share for comments</h1><p class="br-description">Let a guest review this Analysis version.</p><dl class="br-readout"><dt>Shared content</dt><dd>Analysis brief · Version 1</dd><dt>Reviewer access</dt><dd>Guest review without an account</dd><dt>Comments</dt><dd>Attached to specific brief sections</dd><dt>Access scope</dt><dd>Anyone with the active link can review the shared version.</dd></dl><div class="br-notice"><p class="br-small">Sharing preview only. No project is published and no invitations are sent.</p></div>${state.shareCreated?'<label class="br-field-label" for="br-example-link">Example link — inactive</label><input id="br-example-link" type="text" readonly value="https://review.example/analysis-v1"><p class="br-footnote" role="status">Example link shown. Live sharing will be implemented later.</p>':'<button class="br-button br-primary cursor-interaction" type="button" data-action="share-link">Create share link</button>'}`;}
  function handoffMarkup(){return `<button class="br-button br-compact cursor-interaction" type="button" data-action="brief"><i data-lucide="arrow-left" aria-hidden="true"></i>Back to brief</button><h1 style="margin-top:23px">Use this Analysis for Design</h1><p class="br-description">This version becomes the starting point for your editable Design skeleton.</p><dl class="br-readout"><dt>Carried forward</dt><dd>Performance gap, evidence, audience, constraints, evaluation planning, and open items.</dd><dt>Next decision</dt><dd>Use Six Boxes to determine whether learning, other performance responses, or a combination is needed.</dd><dt>L2 measures</dt><dd>Confirm identified measures before instructional Design proceeds. A no-learning route uses a documented not-applicable rationale.</dd></dl><div class="br-notice">${state.reviewed.length<6?'<p>Some sections are still marked Needs review. Return to inspect them, or explicitly use this draft as a starting point.</p>':''}<p>Unresolved questions remain visible. Using this version does not turn assumptions into verified facts.</p><p class="br-small">This preview shows the next skeleton locally; no AI call is made.</p></div><button class="br-button br-primary cursor-interaction" type="button" data-action="confirm-handoff">Use this version and preview Design<i data-lucide="arrow-right" aria-hidden="true"></i></button>`;}
  function pausedMarkup(){return `<h1>Your review is paused</h1><p class="br-description">Return to the same brief and review state.</p><div class="br-notice"><p>You were reviewing the Analysis brief for Customer complaint escalation.</p><p class="br-small">Next: inspect the remaining sections or confirm the handoff to Design.</p></div><button class="br-button br-primary cursor-interaction" type="button" data-action="brief">Resume review<i data-lucide="arrow-right" aria-hidden="true"></i></button>`;}
  const boxData=[['Expectations and Feedback','Routing expectations and feedback need review.','Do people understand successful performance and receive useful feedback?'],['Tools and Resources','A sample guide is referenced; access and workflow fit need confirmation.','Do people have the information, tools, processes, and time needed?'],['Consequences and Incentives','No supporting evidence identified.','Do incentives and consequences support the desired performance?'],['Skills and Knowledge','Routing errors may have several causes; a skill gap is not established.','What evidence shows whether knowledge or skills need development?'],['Selection and Assignment','No supporting evidence identified.','Do assignments match capabilities and role demands?'],['Motives and Preferences','No supporting evidence identified.','What evidence explains willingness to perform and the factors influencing it?']];
  function designMarkup(){return `<button class="br-button br-compact cursor-interaction" type="button" data-action="brief"><i data-lucide="arrow-left" aria-hidden="true"></i>Back to Analysis brief</button><h1 style="margin-top:23px">Performance-solution review</h1><p class="br-description">A starting structure from Analysis. Review all six influences before choosing an intervention.</p><div class="br-draft-line"><span class="br-tag">Design skeleton preview</span><span>Analysis Version 1 carried forward</span></div><div class="br-notice"><span class="br-field-label">Carried-forward performance context</span><p>${esc(state.baseline&&state.baseline.task||state.values[0][0])}</p><p><span class="br-field-label">Desired performance</span>${esc(state.baseline&&state.baseline.desired||state.values[0][1])}</p><p><span class="br-field-label">Current performance</span>${esc(state.baseline&&state.baseline.current||state.values[0][2])}</p></div><div class="br-preview-boxes">${boxData.map((b,i)=>`<section class="br-preview-box"><h2>${i+1}. ${esc(b[0])}</h2><p><span class="br-field-label">Illustrative evidence / gap</span>${esc(b[1])}</p><p><span class="br-field-label">Question for review</span>${esc(b[2])}</p></section>`).join('')}</div><p class="br-footnote">This is a transition preview using sample box content. The detailed Design interaction is the next screen to review.</p>`;}
  function renderNav(){
    nav.innerHTML=state.view==='design'?'<p class="br-nav-title">Design</p><p class="br-nav-note">Performance-solution review comes before intervention, e-learning format, and tool selection.</p>':`<p class="br-nav-title">Analysis brief</p><ol class="br-nav-list">${sections.map((s,i)=>`<li><button class="br-nav-button cursor-interaction" type="button" data-open="${i}" ${state.active===i?'aria-current="location"':''}><span>${i+1}.</span><span>${esc(s.short)}<span class="br-nav-status" data-nav-status="${i}">${state.reviewed.includes(i)?'Reviewed':'Needs review'}</span></span></button></li>`).join('')}</ol><p class="br-nav-note">Open a section to inspect or edit it. Saving and marking reviewed are separate actions.</p>`;
  }
  function renderPanel(){
    const visible=state.view==='brief'&&state.panel!==null;panel.hidden=!visible;shell.classList.toggle('br-with-panel',visible);
    main.querySelectorAll('[aria-controls="br-context-panel"]').forEach(b=>b.setAttribute('aria-expanded',String(visible&&b.dataset.action===state.panel)));
    if(!visible)return;
    panel.innerHTML=`<div class="br-panel-header"><h2>${state.panel==='sources'?'Sources':'Review guidance'}</h2><button class="br-button br-compact cursor-interaction" type="button" data-action="close-panel" aria-label="Close contextual panel"><i data-lucide="x" aria-hidden="true"></i></button></div>${state.panel==='sources'?`<p>Illustrative source excerpts for this wireframe.</p>${[state.source,1-state.source].map(i=>`<section class="br-source"><h3>${esc(sources[i].title)}</h3><p class="br-small">${esc(sources[i].location)}</p><blockquote>${esc(sources[i].text)}</blockquote><p class="br-small">Sample source · Not a real uploaded document</p></section>`).join('')}`:'<p>Review whether this brief faithfully represents the problem and your evidence.</p><h3>Check interpretations</h3><p>Keep possible causes separate from confirmed findings.</p><h3>Keep gaps visible</h3><p>Unknown baselines, resources, and access needs can remain visible where permitted.</p><h3>Confirm the handoff</h3><p>Design starts by deciding which performance responses are justified. Learning is not assumed.</p>'}`;
  }
  function render(){
    root.style.setProperty('--br-spacing',`${state.spacing}px`);renderNav();
    main.innerHTML=state.view==='brief'?briefMarkup():state.view==='share'?shareMarkup():state.view==='handoff'?handoffMarkup():state.view==='paused'?pausedMarkup():designMarkup();
    root.querySelectorAll('[data-stage]').forEach(el=>{if(el.dataset.stage===(state.view==='design'?'Design':'Analysis'))el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
    renderPanel();icons();
  }
  function focusMain(){const button=main.querySelector('button');if(button)button.focus();}
  restore(window.openai&&window.openai.widgetState);render();
  root.addEventListener('toggle',event=>{
    const details=event.target;if(!details.matches||!details.matches('details[data-detail]')||!details.isConnected)return;
    if(!userToggles.has(details))return;userToggles.delete(details);
    const i=Number(details.dataset.detail);
    state.open=state.open.filter(x=>x!==i);if(details.open){state.open.push(i);state.active=i;nav.querySelectorAll('[data-open]').forEach(b=>{if(Number(b.dataset.open)===i)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current');});}persist();
  },true);
  root.addEventListener('input',event=>{
    const t=event.target;if(!t.matches('textarea[data-section][data-field]'))return;
    const i=Number(t.dataset.section),j=Number(t.dataset.field);state.values[i][j]=t.value;state.reviewed=state.reviewed.filter(x=>x!==i);
    const status=main.querySelector(`[data-status="${i}"]`);if(status)status.textContent='Needs review';
    const navStatus=nav.querySelector(`[data-nav-status="${i}"]`);if(navStatus)navStatus.textContent='Needs review';
    const reviewButton=main.querySelector(`[data-action="review"][data-index="${i}"]`);if(reviewButton)reviewButton.textContent='Mark reviewed';scheduleSave();
  });
  root.addEventListener('click',event=>{
    const summary=event.target.closest('summary');if(summary){const details=summary.closest('details[data-detail]');if(details)userToggles.add(details);return;}
    const button=event.target.closest('button');if(!button||!root.contains(button))return;
    if(button.hasAttribute('data-open')){
      flush();const i=Number(button.dataset.open);state.active=i;state.view='brief';if(!state.open.includes(i))state.open.push(i);render();persist();
      const summary=main.querySelector(`[data-detail="${i}"] summary`);if(summary)summary.focus();announce(`${sections[i].title} opened.`);return;
    }
    if(button.hasAttribute('data-source')){
      state.source=Number(button.dataset.source);state.panel='sources';renderPanel();icons();persist();announce('Sample source excerpts opened.');return;
    }
    const action=button.dataset.action;if(!action)return;
    if(action==='edit'||action==='review'){
      flush();const i=Number(button.dataset.index);if(!state.open.includes(i))state.open.push(i);
      if(action==='edit'){if(state.editing.includes(i))state.editing=state.editing.filter(x=>x!==i);else state.editing.push(i);}
      else{if(state.reviewed.includes(i))state.reviewed=state.reviewed.filter(x=>x!==i);else state.reviewed.push(i);state.editing=state.editing.filter(x=>x!==i);}
      render();persist();
      const target=state.editing.includes(i)?main.querySelector(`textarea[data-section="${i}"]`):main.querySelector(`[data-action="${action}"][data-index="${i}"]`);if(target)target.focus();
      announce(action==='edit'?(state.editing.includes(i)?'Section ready to edit.':'Editing finished.'):state.reviewed.includes(i)?'Section marked reviewed.':'Section marked needs review.');return;
    }
    if(action==='sources'||action==='guidance'||action==='close-panel'){
      const wasInPanel=panel.contains(button);state.panel=action==='close-panel'?null:state.panel===action?null:action;
      main.querySelectorAll('[aria-controls="br-context-panel"]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.action===state.panel)));
      renderPanel();icons();persist();if(wasInPanel){const trigger=main.querySelector('[data-action="sources"]');if(trigger)trigger.focus();}announce(state.panel?'Contextual panel opened.':'Contextual panel closed.');return;
    }
    flush();
    if(action==='brief')state.view='brief';
    if(action==='pause')state.view='paused';
    if(action==='share'){state.view='share';state.shareCreated=false;}
    if(action==='share-link')state.shareCreated=true;
    if(action==='handoff')state.view='handoff';
    if(action==='confirm-handoff'){state.baseline={label:'Analysis Version 1',task:state.values[0][0],desired:state.values[0][1],current:state.values[0][2]};state.view='design';}
    render();persist();focusMain();announce(state.view==='design'?'Design starting structure preview opened.':state.view==='share'&&state.shareCreated?'Inactive example review link shown.':state.view==='handoff'?'Confirm which Analysis version guides Design.':state.view==='paused'?'Analysis review paused.':'Brief view updated.');
  });
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(!saved)return;
    const active=document.activeElement;if(root.contains(active)&&active.matches('textarea,input'))return;restore(saved);render();
  });
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--br-spacing',`${state.spacing}px`);persist();}});tweak.addSlider(state,'spacing',{label:'Space between brief fields',min:12,max:26,step:2,unit:'px'});}
})();
</script>
