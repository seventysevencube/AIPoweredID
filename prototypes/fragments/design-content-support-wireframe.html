<div id="aipid-content-wireframe" aria-label="Content and instructional support wireframe">
 <header class="cs-chrome"><span class="cs-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="cs-small cs-demo">Wireframe · Sample data</span></header>
 <div class="cs-project"><div><span class="cs-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="cs-shell"><nav class="cs-nav" aria-label="Content planning sections"></nav><main class="cs-main" aria-label="Content and support workspace"></main><aside class="cs-panel" id="cs-context" aria-label="Contextual information" hidden></aside></div>
 <footer class="cs-footer">Illustrative preview · No live saving, research, sharing, or AI connection<span class="cs-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-content-wireframe{color-scheme:light dark;--cs-bg:light-dark(#f5f5f4,#171717);--cs-paper:light-dark(#fff,#222);--cs-ink:light-dark(#242424,#f2f2f0);--cs-soft:light-dark(#565656,#bdbdb9);--cs-line:light-dark(#d4d4d0,#50504c);--cs-inset:light-dark(#eeeee9,#30302d);--cs-button:light-dark(#30302d,#eeeeea);--cs-button-text:light-dark(#fff,#242424);background:var(--cs-bg);color:var(--cs-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-content-wireframe *{box-sizing:border-box}
 #aipid-content-wireframe [hidden]{display:none!important}
 #aipid-content-wireframe p{margin:0}
 #aipid-content-wireframe .cs-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--cs-paper);border-bottom:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-content-wireframe .cs-brand svg{width:20px;height:20px}
 #aipid-content-wireframe .cs-demo{margin-left:auto}
 #aipid-content-wireframe .cs-small{font-size:12px;color:var(--cs-soft)}
 #aipid-content-wireframe .cs-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--cs-paper);border-bottom:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-project p{font-weight:500}
 #aipid-content-wireframe .cs-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--cs-soft)}
 #aipid-content-wireframe [aria-current="step"]{font-weight:500;color:var(--cs-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-content-wireframe .cs-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-content-wireframe .cs-shell.cs-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-content-wireframe .cs-nav{padding:25px 14px;border-right:1px solid var(--cs-line);min-width:0}
 #aipid-content-wireframe .cs-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-content-wireframe .cs-nav ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
 #aipid-content-wireframe .cs-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--cs-ink);padding:11px 10px;font:inherit;font-size:13px;overflow-wrap:anywhere}
 #aipid-content-wireframe .cs-nav button[aria-current="location"]{background:var(--cs-inset);border-color:var(--cs-line)}
 #aipid-content-wireframe .cs-nav small{display:block;font-size:12px;color:var(--cs-soft);margin-top:4px}
 #aipid-content-wireframe .cs-nav-note{font-size:12px;color:var(--cs-soft);margin:24px 10px 0}
 #aipid-content-wireframe .cs-main{padding:28px;min-width:0;background:var(--cs-paper)}
 #aipid-content-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-content-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-content-wireframe h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-content-wireframe .cs-description{color:var(--cs-soft);margin-bottom:22px}
 #aipid-content-wireframe .cs-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-content-wireframe .cs-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-content-wireframe .cs-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--cs-line);border-radius:6px;background:var(--cs-paper);color:var(--cs-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-content-wireframe .cs-primary{background:var(--cs-button);color:var(--cs-button-text);border-color:var(--cs-button)}
 #aipid-content-wireframe .cs-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--cs-inset);border-radius:4px}
 #aipid-content-wireframe .cs-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-content-wireframe .cs-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--cs-line);border-radius:5px;background:var(--cs-paper);color:var(--cs-ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-content-wireframe textarea{display:block;resize:vertical}
 #aipid-content-wireframe .cs-readout{background:var(--cs-inset);border-radius:6px;padding:17px;margin:20px 0}
 #aipid-content-wireframe .cs-readout p+p{margin-top:12px}
 #aipid-content-wireframe .cs-readout .cs-label{margin-top:0}
 #aipid-content-wireframe .cs-check{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:10px 0}
 #aipid-content-wireframe input[type="checkbox"]{width:18px;height:18px;margin:3px 0 0;flex-shrink:0;accent-color:var(--cs-button)}
 #aipid-content-wireframe fieldset{min-width:0;border:0;padding:0;margin:24px 0 0}
 #aipid-content-wireframe legend{font-weight:500;margin-bottom:8px;padding:0}
 #aipid-content-wireframe .cs-footnote{font-size:12px;color:var(--cs-soft);margin-top:13px}
 #aipid-content-wireframe .cs-section{margin-top:24px;padding-top:22px;border-top:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-matrix{width:100%;table-layout:fixed;border-collapse:collapse;margin:22px 0;font-size:13px}
 #aipid-content-wireframe .cs-matrix th,#aipid-content-wireframe .cs-matrix td{padding:12px 8px;border-bottom:1px solid var(--cs-line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
 #aipid-content-wireframe .cs-matrix th{font-weight:500}
 #aipid-content-wireframe .cs-matrix td p+p{margin-top:9px}
 #aipid-content-wireframe .cs-panel{padding:25px 19px;min-width:0;border-left:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
 #aipid-content-wireframe .cs-panel-head h2{margin:0}
 #aipid-content-wireframe .cs-panel p{font-size:13px;margin:12px 0}
 #aipid-content-wireframe .cs-panel h3{margin-top:20px}
 #aipid-content-wireframe .cs-error{font-weight:500;margin-top:16px}
 #aipid-content-wireframe .cs-footer{font-size:12px;color:var(--cs-soft);padding:15px 28px;border-top:1px solid var(--cs-line)}
 #aipid-content-wireframe .cs-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-content-wireframe .cs-shell.cs-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-content-wireframe .cs-expanded .cs-panel{grid-column:2;border-left:0;border-top:1px solid var(--cs-line)}#aipid-content-wireframe .cs-expanded .cs-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-content-wireframe .cs-shell,#aipid-content-wireframe .cs-shell.cs-expanded{grid-template-columns:minmax(0,1fr)}#aipid-content-wireframe .cs-expanded .cs-nav{grid-row:auto}#aipid-content-wireframe .cs-expanded .cs-panel{grid-column:1}#aipid-content-wireframe .cs-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--cs-line)}#aipid-content-wireframe .cs-main{padding:24px 18px}#aipid-content-wireframe .cs-project,#aipid-content-wireframe .cs-footer{padding-left:18px;padding-right:18px}#aipid-content-wireframe .cs-chrome{padding-left:18px;padding-right:100px}#aipid-content-wireframe .cs-demo{margin-left:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-content-wireframe'),main=root.querySelector('.cs-main'),nav=root.querySelector('.cs-nav'),panel=root.querySelector('.cs-panel'),shell=root.querySelector('.cs-shell');
 const modes={provided:'Provided material only',web:'Web research',both:'Provided material and web research'};
 const statuses={supported:'Supported',partial:'Partially supported',missing:'Missing',conflicting:'Conflicting'};
 const sources={guide:{title:'Fictional exercise guide',location:'Rules 1–2',text:'Rule 1: representatives handle routine order-status questions. Rule 2: damaged-item complaints go to the resolution team.'},notes:{title:'Sample supervisor notes',location:'Routing observations',text:'Routine complaints have sometimes been escalated unnecessarily. Some required escalations were missed. These observations do not define the correct routing criteria.'}};
 const assessments={'A-1':'Assessment 1 — Route a damaged-item complaint','P-1':'Practice 1 — Recognize a routine order-status question'};
 const state={view:'plan',active:0,panel:null,mode:'provided',selected:['guide','notes'],sourceText:'',priority:'',excluded:'',authority:'Use the applicable approved procedure for factual rules. Confirm the current version and resolve any conflicting sources with the subject-matter expert.',boundaries:'Complaint details, categories, and routing decisions within the approved escalation procedure. Exclude unrelated service-policy topics.',gapAction:'ask',confirmed:false,items:[
 {id:'EO-1.1',title:'Identify relevant complaint details',level:'Understand',objective:'Identify the complaint details needed to apply the routing criteria.',content:'Minimum details needed to classify and route a complaint, with examples of relevant versus missing information.',support:'Propose an annotated complaint example and a short information-gathering checklist. Confirm the required details before drafting factual guidance.',source:'guide',reference:'Fictional exercise guide · Rules 1–2',coverage:'missing',issue:'The exercise guide names two complaint types but does not define the complete information required. Obtain the relevant approved procedure section.',location:'Learning aid · Information to collect',links:['A-1','P-1'],reviewed:false},
 {id:'EO-1.2',title:'Classify the complaint',level:'Understand',objective:'Classify a complaint using categories and examples in the approved guide, explaining the match.',content:'Approved complaint categories, defining characteristics, representative examples, and important distinctions.',support:'Propose a worked comparison of the two exercise categories, then reuse the existing practice item. Confirm the full project taxonomy first.',source:'guide',reference:'Fictional exercise guide · Rules 1–2',coverage:'partial',issue:'Only the fictional order-status and damaged-item categories are available. The full approved category set and boundaries are unverified.',location:'Learning aid · Complaint categories',links:['A-1','P-1'],reviewed:false},
 {id:'EO-1.3',title:'Apply the routing criteria',level:'Apply',objective:'Use the applicable criteria to choose a response and routing path, explaining the decision.',content:'Applicable routing criteria, required response paths, and examples showing why each route applies.',support:'Propose a concise decision guide and worked decision explanation. Reuse the existing assessment, while retaining its coverage and verification gaps.',source:'guide',reference:'Fictional exercise guide · Rules 1–2',coverage:'partial',issue:'The two exercise rules support the sample cases only. Validate the actual procedure, boundary cases, answers, and full routing coverage.',location:'Learning aid · Routing decision guide',links:['A-1'],reviewed:false}
 ]};
 let timer,error='';
 const row=()=>state.items[state.active];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(t,a,primary=false)=>`<button type="button" class="cs-button ${primary?'cs-primary ':''}cursor-interaction" data-action="${a}">${t}</button>`;
 const sourceTitle=id=>id==='text'?'Additional source text':sources[id]?.title||'No source assigned';
 const allowed=()=>state.mode==='web'?[]:[...state.selected,...(state.sourceText.trim()?['text']:[])];
 const inScope=x=>!!x.source&&allowed().includes(x.source);
 const coverage=x=>!x.source?'Missing source':!inScope(x)?'Source outside selected scope':x.coverage==='supported'?'Proposed support — verify source':statuses[x.coverage];
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Content and instructional support wireframe',view:state.view,activeObjective:row().id,projectSourceMode:state.mode,coverage:state.items.map(x=>({objective:x.id,status:coverage(x),reviewed:x.reviewed})),draftSelectedForSequence:state.confirmed},privateContent:{kind:'content-support-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='content-support-v1')return;if(['plan','sources','coverage','next','paused'].includes(p.view))state.view=p.view;if(Number.isInteger(p.active)&&p.active>=0&&p.active<3)state.active=p.active;if([null,'source','context','guidance'].includes(p.panel))state.panel=p.panel;if(Object.hasOwn(modes,p.mode))state.mode=p.mode;if(Array.isArray(p.selected))state.selected=[...new Set(p.selected.filter(x=>Object.hasOwn(sources,x)))];for(const k of ['sourceText','priority','excluded','authority','boundaries'])if(typeof p[k]==='string')state[k]=p[k].slice(0,k==='sourceText'?700:400);if(['ask','leave','research'].includes(p.gapAction))state.gapAction=p.gapAction;state.confirmed=p.confirmed===true;if(Array.isArray(p.items))state.items.forEach(target=>{const x=p.items.find(x=>x.id===target.id);if(!x)return;for(const k of ['content','support','issue','location','reference'])if(typeof x[k]==='string')target[k]=x[k].slice(0,k==='reference'||k==='location'?180:350);if(['','guide','notes','text'].includes(x.source))target.source=x.source;if(Object.hasOwn(statuses,x.coverage))target.coverage=x.coverage;if(Array.isArray(x.links))target.links=[...new Set(x.links.filter(id=>Object.hasOwn(assessments,id)))];target.reviewed=x.reviewed===true;});if(state.view==='next'&&!state.confirmed)state.view='coverage';}
 function announce(t){root.querySelector('.cs-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function top(){return `<div class="cs-top"><span class="cs-small" data-save role="status">Preview · Draft</span><div class="cs-row">${['context','guidance'].map(p=>`<button type="button" class="cs-button cursor-interaction" data-panel="${p}" aria-controls="cs-context" aria-expanded="${state.panel===p}">${p==='context'?'Linked objectives & assessments':'Guidance'}</button>`).join('')}</div></div>`;}
 function errors(){return `<p class="cs-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p>`;}
 function field(key,label,rows=3){return `<label class="cs-label" for="cs-${key}">${label}</label><textarea class="cs-field" id="cs-${key}" data-item-field="${key}" maxlength="350" rows="${rows}">${esc(row()[key])}</textarea>`;}
 function projectField(key,label,rows=3){return `<label class="cs-label" for="cs-${key}">${label}</label><textarea class="cs-field" id="cs-${key}" data-project-field="${key}" maxlength="${key==='sourceText'?700:400}" rows="${rows}">${esc(state[key])}</textarea>`;}
 function planView(){const x=row(),choices=allowed();return `${top()}<h1>Plan content and instructional support</h1><p class="cs-description">Use the objective and assessment requirements to decide what learners need and how to support them.</p><div class="cs-row"><span class="cs-tag">${x.id} → LO-1 · ${x.level}</span><span class="cs-small" data-review-status>${x.reviewed?'Reviewed':'AI proposal · Needs review'}</span></div><div class="cs-readout"><span class="cs-label">Objective carried forward</span><p>${esc(x.objective)}</p><p class="cs-small">Project sources: ${modes[state.mode]}. Source settings apply to the entire content map.</p><div class="cs-row" style="margin-top:12px">${btn('Review project source settings','sources')}</div></div>${field('content','What essential content does this objective need?')}${field('support','What instructional support would help learners achieve it?')}<p class="cs-footnote">Support proposals may include explanations, examples, demonstrations, and references. These are proposed treatments, not verified factual content.</p><fieldset><legend>Reuse existing practice and assessment</legend>${Object.entries(assessments).map(([id,title])=>`<label class="cs-check cursor-interaction"><input type="checkbox" data-link="${id}" ${x.links.includes(id)?'checked':''}><span>${title}</span></label>`).join('')}</fieldset><p class="cs-footnote">Links reuse the existing records. They do not change the task, expected response, scoring, or objective definition.</p><section class="cs-section"><h2>Source mapping and open issues</h2><label class="cs-label" for="cs-source">Source for this content</label><select class="cs-field" id="cs-source" data-item-field="source"><option value="">No source assigned</option>${x.source&&!choices.includes(x.source)?`<option value="${x.source}" selected disabled>${esc(sourceTitle(x.source))} — outside selected scope</option>`:''}${choices.map(id=>`<option value="${id}" ${x.source===id?'selected':''}>${esc(sourceTitle(id))}</option>`).join('')}</select><label class="cs-label" for="cs-reference">Source page, section, or passage</label><input class="cs-field" type="text" id="cs-reference" data-item-field="reference" maxlength="180" value="${esc(x.reference)}"><div class="cs-row" style="margin-top:12px"><button type="button" class="cs-button cursor-interaction" data-panel="source" aria-controls="cs-context" aria-expanded="${state.panel==='source'}">View source excerpt</button></div><label class="cs-label" for="cs-coverage">Proposed coverage status</label><select class="cs-field" id="cs-coverage" data-item-field="coverage">${Object.entries(statuses).map(([v,t])=>`<option value="${v}" ${x.coverage===v?'selected':''}>${t}</option>`).join('')}</select><p class="cs-footnote">${coverage(x)}. The exercise sources are illustrative; project-source verification remains pending. Marking reviewed does not clear source issues.</p>${field('issue','What gap, conflict, or next action needs attention?')}<label class="cs-label" for="cs-location">Intended location in the deliverable</label><input class="cs-field" type="text" id="cs-location" data-item-field="location" maxlength="180" value="${esc(x.location)}"></section>${errors()}<div class="cs-row" style="margin-top:20px">${btn(x.reviewed?'Mark needs review':'Mark reviewed','review')}</div><div class="cs-actions">${btn('Save and return later','pause')}${btn(state.active<2?'Next enabling objective →':'Review content coverage →','next',true)}</div>`;}
 function sourcesView(){return `${top()}<h1>Review project source settings</h1><p class="cs-description">Set these once for the entire content map. Existing sources carry forward; individual objectives only need their source match reviewed.</p><label class="cs-label" for="cs-mode">Should content use provided material, web research, or both?</label><select class="cs-field" id="cs-mode" data-project-field="mode">${Object.entries(modes).map(([v,t])=>`<option value="${v}" ${state.mode===v?'selected':''}>${t}</option>`).join('')}</select>${state.mode!=='web'?`<fieldset><legend>Which existing sources should be included?</legend>${Object.entries(sources).map(([id,s])=>`<label class="cs-check cursor-interaction"><input type="checkbox" data-project-source="${id}" ${state.selected.includes(id)?'checked':''}><span>${s.title}<small class="cs-small" style="display:block">Illustrative source carried from the earlier steps</small></span></label>`).join('')}</fieldset>${projectField('sourceText','Additional source text, if available',4)}`:''}${state.mode!=='provided'?`${projectField('priority','Sources or websites to prioritize',2)}${projectField('excluded','Sources or websites to exclude',2)}<p class="cs-footnote">Web preferences do not retrieve sources in this preview. No web source is mapped until it has been obtained and reviewed.</p>`:''}${projectField('authority','Which sources should take precedence if information conflicts?')}${projectField('boundaries','What content must be included or excluded?')}<label class="cs-label" for="cs-gapAction">If content is missing, what should happen next?</label><select class="cs-field" id="cs-gapAction" data-project-field="gapAction"><option value="ask" ${state.gapAction==='ask'?'selected':''}>Request designer input</option><option value="leave" ${state.gapAction==='leave'?'selected':''}>Leave a visible gap for later resolution</option>${state.mode!=='provided'?`<option value="research" ${state.gapAction==='research'?'selected':''}>Research additional sources within these settings</option>`:state.gapAction==='research'?'<option value="research" selected disabled>Research previously selected — unavailable in this source mode</option>':''}</select><p class="cs-footnote">Changing source settings retains existing drafts and flags their source matches for review. It does not start research or silently enable external sources.</p>${errors()}<div class="cs-actions">${btn('Return to content plan','plan')}${btn('Apply settings and return →','apply-sources',true)}</div>`;}
 function coverageView(){return `${top()}<h1>Review content coverage</h1><p class="cs-description">Check the objective → content/source → instructional support → practice/assessment relationships.</p><table class="cs-matrix"><caption class="cs-small" style="text-align:left;padding-bottom:10px">Sample plan · Source support and factual accuracy still require verification</caption><thead><tr><th scope="col">Enabling objective</th><th scope="col">Content and source</th><th scope="col">Status / review</th></tr></thead><tbody>${state.items.map((x,i)=>`<tr><th scope="row">${x.id}<p>${x.title}</p></th><td><p>${esc(x.content)}</p><p class="cs-small">${esc(sourceTitle(x.source))}<br>${esc(x.reference)}</p></td><td><p>${coverage(x)}</p><p class="cs-small">${x.reviewed?'Reviewed':'Needs review'}</p><button type="button" class="cs-button cursor-interaction" data-open="${i}" style="margin-top:10px">Review</button></td></tr>`).join('')}</tbody></table><div class="cs-readout"><h2>Keep gaps visible</h2><p>Confirm that source passages support the factual claims. A document title or working link alone is insufficient.</p><p>Content planning must not silently change the objectives, assessment answers, criteria, or rules. New evidence that calls them into question flags those records for review.</p><p class="cs-small">The sample exercise guide is not an approved organizational source. Remaining gaps, proposed support, and review flags carry forward in a draft.</p></div>${errors()}<div class="cs-actions">${btn('Review project source settings','sources')}${btn('Use draft for sequencing →','confirm',true)}</div>`;}
 function nextView(){return `${top()}<span class="cs-tag">Draft content/support plan selected</span><h1 style="margin-top:18px">Next: review the learning sequence</h1><p class="cs-description">Arrange the content, support, practice, and assessment into a coherent sequence before assembling the detailed Design plan.</p><div class="cs-readout"><h2>Preserve the linked records</h2><p>Carry the main and enabling objectives, existing assessment/practice records, source settings, source references, and planned deliverable locations forward.</p><p>Keep the factual/source gaps visible. This draft is not a declaration of final source support or Development readiness.</p></div>${btn('Return to content coverage','coverage')}`;}
 function renderNav(){nav.innerHTML=`<h2>Content and support</h2><ol><li><button type="button" class="cursor-interaction" data-action="sources" ${state.view==='sources'?'aria-current="location"':''}>Project source settings<small>Applies to the entire map</small></button></li>${state.items.map((x,i)=>`<li><button type="button" class="cursor-interaction" data-open="${i}" ${state.view==='plan'&&state.active===i?'aria-current="location"':''}>${x.id} · ${x.title}<small>${x.reviewed?'Reviewed':'Needs review'}</small></button></li>`).join('')}<li><button type="button" class="cursor-interaction" data-action="coverage" ${state.view==='coverage'?'aria-current="location"':''}>Review coverage<small>Source gaps and relationships</small></button></li></ol><p class="cs-nav-note">Objectives → assessments → content and instructional support → sequence → Design plan.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('cs-expanded',state.panel!==null);if(!state.panel)return;let content='',title='';if(state.panel==='source'){title='Source excerpt';const id=row().source;content=id==='text'?`<h3>Additional source text</h3><p>${esc(state.sourceText)||'No source text supplied.'}</p>`:sources[id]?`<h3>${sources[id].title}</h3><p class="cs-small">${sources[id].location} · Illustrative only</p><p>${sources[id].text}</p>`:'<p>No source is assigned.</p>';content+='<p class="cs-small">Review claim support and applicability. These examples do not validate an organizational procedure.</p>';}else if(state.panel==='context'){title='Linked context';content=`<h3>LO-1 · Apply</h3><p>Select the appropriate complaint response and routing path, and explain the decision using the applicable criteria.</p><h3>${row().id} · ${row().level}</h3><p>${esc(row().objective)}</p><h3>Assessment 1</h3><p>Identify the relevant detail, classify the complaint, choose the route, and explain the applicable rule. Sample rubric checks those four elements.</p><h3>Practice 1</h3><p>Recognize and classify a routine order-status question with explanatory feedback.</p><h3>Learning context</h3><p>Written aid used for learning. The independent previews use illustrative baseline records; the sample rule and assessment answers still need organizational verification.</p>`;}else{title='Content guidance';content='<h3>Plan what is needed</h3><p>Choose content that prepares learners for the reviewed performance and assessment requirements. Avoid summarizing every available document.</p><h3>Separate fact and treatment</h3><p>A source may support a rule. An annotated example or decision guide is an instructional proposal that still needs review.</p><h3>Reuse practice and evidence</h3><p>Link the existing items rather than recreating their tasks, answers, or feedback.</p><h3>Keep sources in scope</h3><p>Project source settings govern all objectives. An individual source match cannot enable excluded web research.</p><h3>Record uncertainty</h3><p>Show missing, partial, and conflicting support. Do not manufacture a source-backed answer to fill a gap.</p>';}
 panel.innerHTML=`<div class="cs-panel-head"><h2>${title}</h2>${btn('Close','close-panel')}</div>${content}`;}
 function render(){renderNav();main.innerHTML=state.view==='plan'?planView():state.view==='sources'?sourcesView():state.view==='coverage'?coverageView():state.view==='next'?nextView():`<h1>Your content review is paused</h1><p class="cs-description">Resume the same enabling objective and draft plan.</p>${btn('Resume content review','plan',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidate(project=false){state.confirmed=false;if(project)state.items.forEach(x=>x.reviewed=false);else row().reviewed=false;const s=main.querySelector('[data-review-status]');if(s)s.textContent='Needs review after edits';const r=main.querySelector('[data-action="review"]');if(r)r.textContent='Mark reviewed';renderNav();}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const t=e.target,k=t.dataset.itemField,p=t.dataset.projectField;if(['content','support','issue','location','reference'].includes(k)){row()[k]=t.value;invalidate();schedule();}else if(['sourceText','priority','excluded','authority','boundaries'].includes(p)){state[p]=t.value;invalidate(true);schedule();}});
 root.addEventListener('change',e=>{const t=e.target;if(t.dataset.projectField==='mode'||t.dataset.projectField==='gapAction'){state[t.dataset.projectField]=t.value;invalidate(true);error='';render();save();main.querySelector(`[data-project-field="${t.dataset.projectField}"]`)?.focus();return;}if(t.dataset.projectSource){state.selected=state.selected.filter(id=>id!==t.dataset.projectSource);if(t.checked)state.selected.push(t.dataset.projectSource);invalidate(true);save();return;}if(['source','coverage'].includes(t.dataset.itemField)){row()[t.dataset.itemField]=t.value;invalidate();render();save();main.querySelector(`[data-item-field="${t.dataset.itemField}"]`)?.focus();return;}if(t.dataset.link){row().links=row().links.filter(id=>id!==t.dataset.link);if(t.checked)row().links.push(t.dataset.link);invalidate();save();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.open!==undefined){state.active=Number(b.dataset.open);state.view='plan';error='';render();save();focusFirst();return;}const a=b.dataset.action;if(!a)return;error='';if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='review'){if(!row().content.trim()||!row().support.trim())error='Define the content need and instructional support before marking this section reviewed.';else row().reviewed=!row().reviewed;state.confirmed=false;}else if(a==='next'){if(state.active<2)state.active++;else state.view='coverage';}else if(a==='apply-sources'){if(state.mode==='provided'&&state.gapAction==='research')error='Choose a permitted missing-content action. Web research is not enabled in provided-material-only mode.';else state.view='plan';}else if(a==='confirm'){if(state.items.some(x=>!x.content.trim()||!x.support.trim()))error='Define each objective’s content need and support proposal, or record a visible placeholder.';else if(state.mode==='provided'&&state.gapAction==='research')error='Resolve the source-settings conflict before carrying this draft forward.';else{state.confirmed=true;state.view='next';}}else if(a==='pause'){state.view='paused';state.panel=null;}else if(['plan','sources','coverage'].includes(a))state.view=a;render();save();focusFirst();announce(error||'Content planning updated.');});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
