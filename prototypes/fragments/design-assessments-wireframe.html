<div id="aipid-assessments-wireframe" aria-label="Assessment definition and alignment wireframe">
 <header class="as-chrome"><span class="as-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="as-small as-demo">Wireframe · Sample data</span></header>
 <div class="as-project"><div><span class="as-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="as-shell"><nav class="as-nav" aria-label="Assessment design sections"></nav><main class="as-main" aria-label="Assessment design workspace"></main><aside class="as-panel" id="as-context" aria-label="Assessment context" hidden></aside></div>
 <footer class="as-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="as-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-assessments-wireframe{color-scheme:light dark;--as-bg:light-dark(#f5f5f4,#171717);--as-paper:light-dark(#fff,#222);--as-ink:light-dark(#242424,#f2f2f0);--as-soft:light-dark(#565656,#bdbdb9);--as-line:light-dark(#d4d4d0,#50504c);--as-inset:light-dark(#eeeee9,#30302d);--as-button:light-dark(#30302d,#eeeeea);--as-button-text:light-dark(#fff,#242424);background:var(--as-bg);color:var(--as-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-assessments-wireframe *{box-sizing:border-box}
 #aipid-assessments-wireframe [hidden]{display:none!important}
 #aipid-assessments-wireframe p{margin:0}
 #aipid-assessments-wireframe .as-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--as-paper);border-bottom:1px solid var(--as-line)}
 #aipid-assessments-wireframe .as-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-assessments-wireframe .as-brand svg{width:20px;height:20px}
 #aipid-assessments-wireframe .as-demo{margin-left:auto}
 #aipid-assessments-wireframe .as-small{font-size:12px;color:var(--as-soft)}
 #aipid-assessments-wireframe .as-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--as-paper);border-bottom:1px solid var(--as-line)}
 #aipid-assessments-wireframe .as-project p{font-weight:500}
 #aipid-assessments-wireframe .as-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--as-soft)}
 #aipid-assessments-wireframe [aria-current="step"]{font-weight:500;color:var(--as-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-assessments-wireframe .as-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-assessments-wireframe .as-shell.as-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-assessments-wireframe .as-nav{padding:25px 14px;border-right:1px solid var(--as-line);min-width:0}
 #aipid-assessments-wireframe .as-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-assessments-wireframe .as-nav ol{list-style:none;display:grid;gap:6px;padding:0;margin:0}
 #aipid-assessments-wireframe .as-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--as-ink);padding:11px 10px;font:inherit;font-size:13px}
 #aipid-assessments-wireframe .as-nav button[aria-current="location"]{background:var(--as-inset);border-color:var(--as-line)}
 #aipid-assessments-wireframe .as-nav small{display:block;font-size:12px;color:var(--as-soft);margin-top:4px}
 #aipid-assessments-wireframe .as-nav-note{font-size:12px;color:var(--as-soft);margin:24px 10px 0}
 #aipid-assessments-wireframe .as-main{padding:28px;background:var(--as-paper);min-width:0}
 #aipid-assessments-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-assessments-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-assessments-wireframe h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-assessments-wireframe .as-description{color:var(--as-soft);margin-bottom:22px}
 #aipid-assessments-wireframe .as-row{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
 #aipid-assessments-wireframe .as-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-assessments-wireframe .as-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--as-line);border-radius:6px;background:var(--as-paper);color:var(--as-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-assessments-wireframe .as-primary{background:var(--as-button);color:var(--as-button-text);border-color:var(--as-button)}
 #aipid-assessments-wireframe .as-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--as-inset);border-radius:4px}
 #aipid-assessments-wireframe .as-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-assessments-wireframe .as-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--as-line);border-radius:5px;background:var(--as-paper);color:var(--as-ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-assessments-wireframe textarea{display:block;resize:vertical}
 #aipid-assessments-wireframe .as-readout{background:var(--as-inset);border-radius:6px;padding:17px;margin:20px 0}
 #aipid-assessments-wireframe .as-readout p+p{margin-top:12px}
 #aipid-assessments-wireframe .as-check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0}
 #aipid-assessments-wireframe input[type="checkbox"]{width:18px;height:18px;margin:3px 0 0;flex-shrink:0;accent-color:var(--as-button)}
 #aipid-assessments-wireframe fieldset{min-width:0;border:0;margin:22px 0 0;padding:0}
 #aipid-assessments-wireframe legend{font-weight:500;margin-bottom:8px;padding:0}
 #aipid-assessments-wireframe .as-footnote{font-size:12px;color:var(--as-soft);margin-top:13px}
 #aipid-assessments-wireframe .as-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--as-line)}
 #aipid-assessments-wireframe .as-matrix{width:100%;border-collapse:collapse;margin:22px 0;table-layout:fixed;font-size:13px}
 #aipid-assessments-wireframe .as-matrix th,#aipid-assessments-wireframe .as-matrix td{vertical-align:top;text-align:left;border-bottom:1px solid var(--as-line);padding:12px 8px;overflow-wrap:anywhere}
 #aipid-assessments-wireframe .as-matrix th{font-weight:500}
 #aipid-assessments-wireframe .as-matrix th:first-child{width:36%}
 #aipid-assessments-wireframe .as-matrix td .as-button{font-size:12px;padding:7px 9px;margin:0 4px 5px 0}
 #aipid-assessments-wireframe .as-list{padding-left:22px;margin:12px 0}
 #aipid-assessments-wireframe .as-list li+li{margin-top:10px}
 #aipid-assessments-wireframe .as-error{font-weight:500;margin-top:16px}
 #aipid-assessments-wireframe .as-panel{padding:25px 19px;min-width:0;border-left:1px solid var(--as-line)}
 #aipid-assessments-wireframe .as-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
 #aipid-assessments-wireframe .as-panel-head h2{margin:0}
 #aipid-assessments-wireframe .as-panel p{font-size:13px;margin:12px 0}
 #aipid-assessments-wireframe .as-panel h3{margin-top:20px}
 #aipid-assessments-wireframe .as-footer{font-size:12px;color:var(--as-soft);padding:15px 28px;border-top:1px solid var(--as-line)}
 #aipid-assessments-wireframe .as-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-assessments-wireframe .as-shell.as-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-assessments-wireframe .as-expanded .as-panel{grid-column:2;border-left:0;border-top:1px solid var(--as-line)}#aipid-assessments-wireframe .as-expanded .as-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-assessments-wireframe .as-shell,#aipid-assessments-wireframe .as-shell.as-expanded{grid-template-columns:minmax(0,1fr)}#aipid-assessments-wireframe .as-expanded .as-nav{grid-row:auto}#aipid-assessments-wireframe .as-expanded .as-panel{grid-column:1}#aipid-assessments-wireframe .as-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--as-line)}#aipid-assessments-wireframe .as-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}#aipid-assessments-wireframe .as-main{padding:24px 18px}#aipid-assessments-wireframe .as-project,#aipid-assessments-wireframe .as-footer{padding-left:18px;padding-right:18px}#aipid-assessments-wireframe .as-chrome{padding-left:18px;padding-right:100px}#aipid-assessments-wireframe .as-demo{margin-left:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-assessments-wireframe'),main=root.querySelector('.as-main'),nav=root.querySelector('.as-nav'),panel=root.querySelector('.as-panel'),shell=root.querySelector('.as-shell');
 const objectives=[{id:'LO-1',title:'Make and explain routing decisions',level:'Apply'},{id:'EO-1.1',title:'Identify relevant complaint details',level:'Understand'},{id:'EO-1.2',title:'Classify the complaint',level:'Understand'},{id:'EO-1.3',title:'Apply the routing criteria',level:'Apply'}];
 const purposes={scored:'Scored assessment',practice:'Formative practice',evidence:'Other learning evidence'};
 const methods={case:'Scenario with written response',choice:'Selected response',demonstration:'Observed demonstration',product:'Work product'};
 const state={view:'alignment',active:'A-1',panel:null,confirmed:false,items:[
 {id:'A-1',title:'Route a damaged-item complaint',purpose:'scored',method:'case',links:objectives.map(x=>x.id),task:'Fictional exercise: A customer reports that an item arrived damaged. Using the exercise guide, identify the relevant detail, classify the complaint, choose the response/routing path, and explain the rule that supports your decision.',options:'',expected:'Relevant detail: damaged item. Category: damaged-item complaint. Route: send to the resolution team. Explanation: exercise rule 2 applies to a reported damaged item.',feedback:'Correct: the damaged-item detail makes rule 2 applicable; route to the resolution team. If routed as a routine order-status question, revisit the complaint type. If the explanation is missing, cite the applicable rule and case detail.',scoring:'Four criteria: relevant detail, category, route, and explanation. One point each; all four required for success on this sample case.',success:'Correct critical routing decision and explanation linked to the applicable criterion.',retries:'Proposed: after feedback and guide review, use an equivalent case. Confirm permitted attempts and remediation with the learning owner.',collection:'Learner submits a written response; a facilitator reviews it against the rubric. Confirm the reviewer and collection process.',reviewed:false},
 {id:'P-1',title:'Recognize a routine order-status question',purpose:'practice',method:'case',links:['EO-1.1','EO-1.2'],task:'Fictional exercise: A customer asks when an undamaged order will arrive. Identify the relevant details and classify the complaint using the exercise guide.',options:'',expected:'Routine order-status question; no damaged item is reported. Exercise rule 1 applies.',feedback:'Use the order-status category because the customer asks about delivery timing. Compare this with a damaged-item complaint before moving to routing practice.',scoring:'',success:'Identify the order-status category and the case detail that supports it.',retries:'Allow another attempt after viewing the explanation. Use a new example if the same misunderstanding continues.',collection:'Facilitator-led discussion or written response with feedback; confirm the approach for the written learning aid.',reviewed:false}
 ]};
 let timer,error='';
 const item=()=>state.items.find(x=>x.id===state.active)||state.items[0];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(text,action,primary=false)=>`<button type="button" class="as-button ${primary?'as-primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Assessment definition and alignment wireframe',view:state.view,activeItem:state.active,items:state.items.map(x=>({id:x.id,purpose:x.purpose,method:x.method,objectiveLinks:x.links,reviewed:x.reviewed})),draftSelectedForContent:state.confirmed,sourceStatus:'Fictional exercise only; organizational source verification pending'},privateContent:{kind:'assessments-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='assessments-v1')return;if(['alignment','task','feedback','matrix','next','paused'].includes(p.view))state.view=p.view;if(state.items.some(x=>x.id===p.active))state.active=p.active;if([null,'sources','guidance'].includes(p.panel))state.panel=p.panel;state.confirmed=p.confirmed===true;if(Array.isArray(p.items))state.items.forEach(target=>{const x=p.items.find(x=>x.id===target.id);if(!x)return;for(const k of ['title','task','options','expected','feedback','scoring','success','retries','collection'])if(typeof x[k]==='string')target[k]=x[k].slice(0,k==='title'?100:400);if(Object.hasOwn(purposes,x.purpose))target.purpose=x.purpose;if(Object.hasOwn(methods,x.method))target.method=x.method;if(Array.isArray(x.links))target.links=[...new Set(x.links.filter(id=>objectives.some(o=>o.id===id)))];target.reviewed=x.reviewed===true;});if(state.view==='next'&&!state.confirmed)state.view='matrix';}
 function announce(t){root.querySelector('.as-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function top(){return `<div class="as-top"><span class="as-small" data-save role="status">Preview · Draft</span><div class="as-row">${['sources','guidance'].map(p=>`<button type="button" class="as-button cursor-interaction" data-panel="${p}" aria-controls="as-context" aria-expanded="${state.panel===p}">${p==='sources'?'Exercise source':'Guidance'}</button>`).join('')}</div></div>`;}
 function picker(){return `<label class="as-label" for="as-item">Assessment or practice item</label><select class="as-field" id="as-item" data-select-item>${state.items.map(x=>`<option value="${x.id}" ${state.active===x.id?'selected':''}>${x.id} · ${esc(x.title)}</option>`).join('')}</select><div class="as-row" style="margin-top:14px"><span class="as-tag">${item().id} · ${purposes[item().purpose]}</span><span class="as-small" data-review-status>${item().reviewed?'Reviewed':'AI draft · Needs review'}</span></div>`;}
 function field(k,label,rows=3){return `<label class="as-label" for="as-${k}">${label}</label><textarea class="as-field" id="as-${k}" data-field="${k}" maxlength="400" rows="${rows}">${esc(item()[k])}</textarea>`;}
 function errors(){return `<p class="as-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p>`;}
 function alignmentView(){const x=item();return `${top()}<h1>Align the assessment with the objectives</h1><p class="as-description">Define learning evidence before planning the content and instructional support.</p>${picker()}<label class="as-label" for="as-title">Item title</label><input class="as-field" id="as-title" data-field="title" type="text" maxlength="100" value="${esc(x.title)}"><label class="as-label" for="as-purpose">Purpose</label><select class="as-field" id="as-purpose" data-field="purpose">${Object.entries(purposes).map(([v,t])=>`<option value="${v}" ${x.purpose===v?'selected':''}>${t}</option>`).join('')}</select><label class="as-label" for="as-method">How will the learner demonstrate performance?</label><select class="as-field" id="as-method" data-field="method">${Object.entries(methods).map(([v,t])=>`<option value="${v}" ${x.method===v?'selected':''}>${t}</option>`).join('')}</select><fieldset><legend>Which objectives does this item address?</legend>${objectives.map(o=>`<label class="as-check cursor-interaction"><input type="checkbox" data-objective="${o.id}" ${x.links.includes(o.id)?'checked':''}><span>${o.id} · ${o.title}<small class="as-small" style="display:block">${o.level}</small></span></label>`).join('')}</fieldset><p class="as-footnote">Links are proposals for review. Selecting an objective does not establish coverage or the right cognitive demand.</p><div class="as-readout"><h2>Linked measure · L2-1</h2><p>Correct critical routing decisions with explanations linked to applicable criteria, using the guide.</p><p class="as-small">${x.purpose==='practice'?'This item prepares part of the performance; practice alone does not establish achievement of LO-1.':'Retain evidence of the complete LO-1 decision and explanation. Lower-level checks alone cannot establish application.'}</p></div>${errors()}<div class="as-actions">${btn('Save and return later','pause')}${btn('Review task and expected response →','task',true)}</div>`;}
 function taskView(){return `${top()}<h1>Define the task and expected response</h1><p class="as-description">Review the exact learner instructions and the evidence that would count as success.</p>${picker()}<div class="as-readout"><h2>Fictional exercise only</h2><p>Rule 1: representatives handle routine order-status questions. Rule 2: damaged-item complaints go to the resolution team.</p><p class="as-small">These rules are invented sample data. Replace and verify them against the project’s approved procedure before real use.</p></div>${field('task','What exactly will the learner be asked to do?',4)}${item().method==='choice'?field('options','Response options',3):''}${item().method==='choice'?'<p class="as-footnote">A selected answer alone may not capture the required explanation. Review the task and evidence without reducing the objective’s cognitive demand.</p>':''}${field('expected','Expected response or performance rubric',4)}${field('success','Success criteria',2)}${field('collection','Response collection and review',3)}<p class="as-footnote">Source status: sample rule only; organizational verification pending. A reviewed item is not automatically a verified answer or a ready-to-build specification.</p>${errors()}<div class="as-actions">${btn('Back to alignment','alignment')}${btn('Review feedback and rules →','feedback',true)}</div>`;}
 function feedbackView(){return `${top()}<h1>Define feedback and assessment rules</h1><p class="as-description">Keep item-level rules separate from any later course-completion settings.</p>${picker()}${field('feedback','Feedback for correct, incorrect, or incomplete performance',4)}${item().purpose==='scored'?field('scoring','Scoring and success rule',3):'<div class="as-readout"><p>No numeric score is required for this purpose. Keep the expected performance and success criteria defined.</p></div>'}${field('retries','Attempts, remediation, and completion for this item',3)}<div class="as-readout"><p>Answer/source status: fictional exercise only. Project-source validation and reviewer/collection arrangements remain open.</p><p class="as-small">These proposed rules do not establish an organizational passing standard or automate grading.</p></div>${errors()}<div class="as-row" style="margin-top:20px">${btn(item().reviewed?'Mark needs review':'Mark item reviewed','review')}</div><div class="as-actions">${btn('Back to task','task')}${btn('Review objective–assessment alignment →','matrix',true)}</div>`;}
 function matrixView(){return `${top()}<h1>Review objective–assessment alignment</h1><p class="as-description">Check what each item actually demonstrates, including the integrated main performance.</p>
 <table class="as-matrix"><caption class="as-small" style="text-align:left;padding-bottom:10px">Proposed links · Sample evidence, not validated coverage</caption><thead><tr><th scope="col">Objective / Bloom’s level</th><th scope="col">Linked items</th><th scope="col">Review status</th></tr></thead><tbody>${objectives.map(o=>{const linked=state.items.filter(x=>x.links.includes(o.id));return `<tr><th scope="row">${o.id}<p>${o.title}</p><p class="as-small">${o.level} · L2-1</p></th><td>${linked.length?linked.map(x=>`<button type="button" class="as-button cursor-interaction" data-open-item="${x.id}">${x.id} · ${x.purpose==='practice'?'Practice':'Evidence'}</button>`).join(''):'No linked evidence'}</td><td>${linked.length?linked.every(x=>x.reviewed)?'Items reviewed; coverage/source checks remain':'Proposed links · Needs review':'Coverage gap'}</td></tr>`;}).join('')}</tbody></table>
 <div class="as-readout"><h2>Open checks</h2><ul class="as-list"><li>${state.items.some(x=>x.links.includes('LO-1')&&x.purpose!=='practice')?'A nonpractice evidence item is linked to LO-1; check that it demonstrates the integrated performance.':'LO-1 has no nonpractice evidence item linked. Resolve this assessment-planning gap.'}</li><li>Check evidence coverage of routine resolution, required escalation, and important boundary cases; no fixed case count is implied.</li><li>Verify the actual task and cognitive demand, not just the objective checkboxes. Practice can support an enabling objective without being its scored assessment.</li><li>The guide rules and answers are fictional. Organizational source verification is pending.</li><li>Confirm collection/review arrangements and tool feasibility before final specifications.</li></ul><p class="as-small">${state.items.filter(x=>!x.reviewed).length} item(s) still need review. These flags and source gaps carry into content planning.</p></div>${errors()}<div class="as-actions">${btn('Return to assessment items','alignment')}${btn('Use draft for content planning →','confirm',true)}</div>`;}
 function nextView(){return `${top()}<span class="as-tag">Draft assessment records selected</span><h1 style="margin-top:18px">Next: content and instructional support</h1><p class="as-description">Use the objectives and assessment requirements to identify what learners need to learn and practice.</p><div class="as-readout"><h2>Carry the linked records forward</h2><p>Keep objective/L2 links, tasks, rubrics, feedback, and assessment rules. Plan content and support that prepare learners to demonstrate the performance.</p><p>Preserve ${state.items.map(x=>x.id).join(' and ')} as distinct records. Reuse them in content mapping and later Development; do not generate duplicates or silently change accepted assessments.</p><p class="as-small">Source verification, scenario coverage, and any remaining review flags stay visible. No final readiness is claimed.</p></div>${btn('Return to alignment review','matrix')}`;}
 function renderNav(){const steps=[['alignment','Alignment and method'],['task','Task and expected response'],['feedback','Feedback and rules'],['matrix','Alignment review']];nav.innerHTML=`<h2>Assessments</h2><ol>${steps.map(([key,title])=>`<li><button type="button" class="cursor-interaction" data-action="${key}" ${state.view===key?'aria-current="location"':''}>${title}<small>${key==='matrix'?'All current items':item().id}</small></button></li>`).join('')}</ol><p class="as-nav-note">Objectives → assessments → content and instructional support.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('as-expanded',state.panel!==null);if(!state.panel)return;panel.innerHTML=`<div class="as-panel-head"><h2>${state.panel==='sources'?'Exercise source':'Assessment guidance'}</h2>${btn('Close','close-panel')}</div>${state.panel==='sources'?'<p class="as-small">Invented exercise guide · Not a real uploaded document or organizational policy.</p><h3>Rule 1</h3><p>Representatives handle routine order-status questions.</p><h3>Rule 2</h3><p>Damaged-item complaints go to the resolution team.</p><h3>Verification</h3><p>The example answer follows these invented rules only. Replace the exercise guide and validate answers against approved project sources before actual use.</p><h3>Learning context</h3><p>Written aid used for learning; written responses may need a facilitator or another reviewed collection method. No course or grading system is assumed.</p>':'<h3>Assess the intended demand</h3><p>An Apply objective needs evidence of applying the criteria. Recall-only questions are insufficient.</p><h3>Check integrated performance</h3><p>Cover the main decision and explanation as well as meaningful component skills.</p><h3>Separate practice and scoring</h3><p>Formative practice can prepare learners without a score. Not every enabling objective needs a separate scored item.</p><h3>Ground answers</h3><p>Keep source uncertainty visible. Reviewing an item does not verify its factual correctness automatically.</p><h3>Keep content for the next step</h3><p>Use assessment requirements to plan preparation, practice, and support after this review.</p>'}`;}
 function render(){renderNav();main.innerHTML=state.view==='alignment'?alignmentView():state.view==='task'?taskView():state.view==='feedback'?feedbackView():state.view==='matrix'?matrixView():state.view==='next'?nextView():`<h1>Your assessment review is paused</h1><p class="as-description">Resume the same sample item and saved draft fields.</p>${btn('Resume assessment review','alignment',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidate(){item().reviewed=false;state.confirmed=false;const el=main.querySelector('[data-review-status]');if(el)el.textContent='Needs review after edits';const review=main.querySelector('[data-action="review"]');if(review)review.textContent='Mark item reviewed';}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const k=e.target.dataset.field;if(!['title','task','options','expected','feedback','scoring','success','retries','collection'].includes(k))return;item()[k]=e.target.value;invalidate();schedule();});
 root.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-select-item')){state.active=t.value;error='';render();save();main.querySelector('[data-select-item]')?.focus();return;}if(t.dataset.objective){const x=item();x.links=x.links.filter(id=>id!==t.dataset.objective);if(t.checked)x.links.push(t.dataset.objective);invalidate();save();return;}if(['purpose','method'].includes(t.dataset.field)){item()[t.dataset.field]=t.value;invalidate();render();save();main.querySelector(`[data-field="${t.dataset.field}"]`)?.focus();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.openItem){state.active=b.dataset.openItem;state.view='task';error='';render();save();focusFirst();return;}const a=b.dataset.action;if(!a)return;error='';if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='review'){const x=item();if(!x.links.length||!x.task.trim()||!x.expected.trim()||!x.success.trim()||!x.feedback.trim()||(x.method==='choice'&&!x.options.trim())||(x.purpose==='scored'&&!x.scoring.trim()))error='Define objective links, task, expected performance, success criteria, feedback, and any applicable response options/scoring before marking reviewed.';else x.reviewed=!x.reviewed;state.confirmed=false;}else if(a==='confirm'){if(state.items.some(x=>!x.links.length||!x.task.trim()||!x.expected.trim()))error='Each current item needs at least one objective link, a task, and an expected response or rubric.';else{state.confirmed=true;state.view='next';}}else if(a==='pause'){state.view='paused';state.panel=null;}else if(['alignment','task','feedback','matrix'].includes(a))state.view=a;render();save();focusFirst();announce(error||'Assessment review updated.');});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
