<div id="aipid-structure-wireframe" aria-label="Design intervention and solution structure wireframe">
 <header class="st-chrome"><span class="st-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="st-small st-demo">Wireframe · Sample data</span></header>
 <div class="st-project"><div><span class="st-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="st-shell"><nav class="st-nav" aria-label="Solution structure steps"></nav><main class="st-main" aria-label="Design solution structure"></main><aside class="st-panel" id="st-context" aria-label="Contextual information" hidden></aside></div>
 <footer class="st-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="st-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-structure-wireframe{color-scheme:light dark;--st-bg:light-dark(#f5f5f4,#171717);--st-paper:light-dark(#fff,#222);--st-ink:light-dark(#242424,#f2f2f0);--st-soft:light-dark(#565656,#bdbdb9);--st-line:light-dark(#d4d4d0,#50504c);--st-inset:light-dark(#eeeee9,#30302d);--st-button:light-dark(#30302d,#eeeeea);--st-button-text:light-dark(#fff,#242424);background:var(--st-bg);color:var(--st-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-structure-wireframe *{box-sizing:border-box}
 #aipid-structure-wireframe [hidden]{display:none!important}
 #aipid-structure-wireframe p{margin:0}
 #aipid-structure-wireframe .st-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--st-paper);border-bottom:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-structure-wireframe .st-brand svg{width:20px;height:20px}
 #aipid-structure-wireframe .st-demo{margin-left:auto}
 #aipid-structure-wireframe .st-small{font-size:12px;color:var(--st-soft)}
 #aipid-structure-wireframe .st-project{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;padding:17px 28px;background:var(--st-paper);border-bottom:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-project p{font-weight:500}
 #aipid-structure-wireframe .st-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--st-soft)}
 #aipid-structure-wireframe [aria-current="step"]{font-weight:500;color:var(--st-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-structure-wireframe .st-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-structure-wireframe .st-shell.st-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-structure-wireframe .st-nav{padding:25px 14px;border-right:1px solid var(--st-line);min-width:0}
 #aipid-structure-wireframe .st-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-structure-wireframe .st-nav ol{list-style:none;padding:0;margin:0;display:grid;gap:7px}
 #aipid-structure-wireframe .st-nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:11px 10px;color:var(--st-ink);font:inherit;font-size:13px}
 #aipid-structure-wireframe .st-nav button[aria-current="location"]{background:var(--st-inset);border-color:var(--st-line)}
 #aipid-structure-wireframe .st-nav small{display:block;font-size:12px;color:var(--st-soft);margin-top:4px}
 #aipid-structure-wireframe .st-nav-locked{font-size:13px;color:var(--st-soft);padding:11px 10px}
 #aipid-structure-wireframe .st-nav-note{font-size:12px;color:var(--st-soft);margin:24px 10px 0}
 #aipid-structure-wireframe .st-main{min-width:0;padding:28px;background:var(--st-paper)}
 #aipid-structure-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-structure-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-structure-wireframe h3{font-size:15px;font-weight:500;margin:0}
 #aipid-structure-wireframe .st-description{color:var(--st-soft);margin-bottom:22px}
 #aipid-structure-wireframe .st-row{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
 #aipid-structure-wireframe .st-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
 #aipid-structure-wireframe .st-top{margin-bottom:20px}
 #aipid-structure-wireframe .st-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;max-width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--st-line);border-radius:6px;color:var(--st-ink);background:var(--st-paper);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-structure-wireframe .st-primary{color:var(--st-button-text);background:var(--st-button);border-color:var(--st-button)}
 #aipid-structure-wireframe .st-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--st-inset);border-radius:4px}
 #aipid-structure-wireframe .st-readout{background:var(--st-inset);border-radius:6px;padding:16px;margin:20px 0}
 #aipid-structure-wireframe .st-readout p+p{margin-top:12px}
 #aipid-structure-wireframe .st-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-structure-wireframe .st-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--st-line);border-radius:5px;color:var(--st-ink);background:var(--st-paper);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-structure-wireframe textarea{resize:vertical;display:block}
 #aipid-structure-wireframe fieldset{min-width:0;padding:0;border:0;margin:24px 0 0}
 #aipid-structure-wireframe legend{font-weight:500;padding:0;margin-bottom:12px}
 #aipid-structure-wireframe .st-choice{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--st-line);border-radius:6px;margin-bottom:9px}
 #aipid-structure-wireframe .st-choice:has(input:checked){background:var(--st-inset);border-color:var(--st-ink)}
 #aipid-structure-wireframe .st-choice small{display:block;font-size:13px;color:var(--st-soft);margin-top:5px}
 #aipid-structure-wireframe input[type="checkbox"],#aipid-structure-wireframe input[type="radio"]{width:18px;height:18px;flex-shrink:0;margin:3px 0 0;accent-color:var(--st-button)}
 #aipid-structure-wireframe .st-check{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
 #aipid-structure-wireframe .st-section{margin-top:24px;padding-top:22px;border-top:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-unit{border:1px solid var(--st-line);border-radius:6px;padding:18px;margin-bottom:14px;min-width:0}
 #aipid-structure-wireframe .st-units{margin-top:20px}
 #aipid-structure-wireframe .st-summary{margin:20px 0;display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px 18px}
 #aipid-structure-wireframe .st-summary dt{font-size:13px;color:var(--st-soft)}
 #aipid-structure-wireframe .st-summary dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
 #aipid-structure-wireframe .st-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-footnote{font-size:12px;color:var(--st-soft);margin-top:13px}
 #aipid-structure-wireframe .st-error{padding:12px 0;font-weight:500}
 #aipid-structure-wireframe .st-panel{min-width:0;padding:25px 19px;border-left:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-panel p{font-size:13px;margin:12px 0}
 #aipid-structure-wireframe .st-panel h3{margin-top:20px}
 #aipid-structure-wireframe .st-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
 #aipid-structure-wireframe .st-panel-head h2{margin:0}
 #aipid-structure-wireframe .st-footer{font-size:12px;color:var(--st-soft);padding:15px 28px;border-top:1px solid var(--st-line)}
 #aipid-structure-wireframe .st-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(pointer:coarse){#aipid-structure-wireframe button{min-height:44px}}
 @media(max-width:960px){#aipid-structure-wireframe .st-shell.st-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-structure-wireframe .st-expanded .st-panel{grid-column:2;border-left:0;border-top:1px solid var(--st-line)}#aipid-structure-wireframe .st-expanded .st-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-structure-wireframe .st-shell,#aipid-structure-wireframe .st-shell.st-expanded{grid-template-columns:minmax(0,1fr)}#aipid-structure-wireframe .st-expanded .st-nav{grid-row:auto}#aipid-structure-wireframe .st-expanded .st-panel{grid-column:1}#aipid-structure-wireframe .st-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--st-line)}#aipid-structure-wireframe .st-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}#aipid-structure-wireframe .st-main{padding:24px 18px}#aipid-structure-wireframe .st-project,#aipid-structure-wireframe .st-footer{padding-left:18px;padding-right:18px}#aipid-structure-wireframe .st-chrome{padding-left:18px;padding-right:100px}#aipid-structure-wireframe .st-demo{margin-left:0}#aipid-structure-wireframe .st-summary{grid-template-columns:minmax(0,1fr);gap:6px}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-structure-wireframe'),main=root.querySelector('.st-main'),nav=root.querySelector('.st-nav'),panel=root.querySelector('.st-panel'),shell=root.querySelector('.st-shell');
 const formats={micro:'Microlearning',course:'A course',mix:'A mix'};
 const tools={storyline:'Storyline 360',rise:'Rise 360',both:'Both'};
 const state={view:'intervention',panel:null,approach:'Targeted e-learning using the current escalation procedure, with realistic complaint-routing decisions and feedback.',contribution:'Help representatives apply the criteria consistently and explain why a complaint should be resolved or escalated.',limits:'Verify the skill-gap hypothesis through diagnostic cases. Confirm guide access and consistent expectations with the business owner. Learning alone will not resolve tool or process barriers.',elearning:true,support:false,supportTitle:'Complaint-routing learning and reference aid',interventionAccepted:false,format:'micro',formatReason:'Start with focused, task-based units so the guide and routing practice can be reviewed separately. Confirm the final structure after objectives and assessments are defined.',units:[{id:1,title:'Use the escalation criteria',focus:'A worked example of using the current guide to make a routing decision.',kind:'',tool:''},{id:2,title:'Practice complaint-routing decisions',focus:'Realistic cases, decision explanations, feedback, and learning checks.',kind:'',tool:''}],nextId:3,formatAccepted:false,tool:'',connection:'',toolsAccepted:false,hadConfirmedStructure:false};
 let timer,error='';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(text,action,primary=false)=>`<button type="button" class="st-button ${primary?'st-primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Design intervention and structure wireframe',view:state.view,interventionConfirmed:state.interventionAccepted,deliverables:[...(state.elearning?['e-learning']:[]),...(state.support?['written learning support']:[])],format:state.elearning?formats[state.format]:null,formatConfirmed:state.formatAccepted,authoringTools:state.elearning?(tools[state.tool]||null):null,structureConfirmed:state.toolsAccepted,unitCount:state.elearning?state.units.length:0},privateContent:{kind:'design-structure-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='design-structure-v1')return;for(const k of ['approach','contribution','limits','formatReason','connection'])if(typeof p[k]==='string')state[k]=p[k].slice(0,700);if(typeof p.supportTitle==='string')state.supportTitle=p.supportTitle.slice(0,180);for(const k of ['elearning','support','interventionAccepted','formatAccepted','toolsAccepted','hadConfirmedStructure'])if(typeof p[k]==='boolean')state[k]=p[k];if(Object.hasOwn(formats,p.format))state.format=p.format;if(['','storyline','rise','both'].includes(p.tool))state.tool=p.tool;if([null,'context','guidance'].includes(p.panel))state.panel=p.panel;if(Array.isArray(p.units)&&p.units.length&&p.units.length<=6){const valid=p.units.every(u=>Number.isInteger(u.id)&&u.id>0&&u.id<10000&&typeof u.title==='string'&&typeof u.focus==='string');if(valid&&new Set(p.units.map(u=>u.id)).size===p.units.length)state.units=p.units.map(u=>({id:u.id,title:u.title.slice(0,180),focus:u.focus.slice(0,400),kind:['micro','module'].includes(u.kind)?u.kind:'',tool:['storyline','rise'].includes(u.tool)?u.tool:''}));}state.nextId=Math.max(...state.units.map(u=>u.id))+1;if(['intervention','format','tools','summary','paused'].includes(p.view))state.view=p.view;if((state.view==='format'||state.view==='tools'||state.view==='summary')&&!state.interventionAccepted)state.view='intervention';if(state.view==='tools'&&(!state.elearning||!state.formatAccepted))state.view=state.elearning?'format':'summary';if(state.view==='summary'&&state.elearning&&!state.toolsAccepted)state.view=state.formatAccepted?'tools':'format';}
 function announce(t){root.querySelector('.st-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function controls(){return `<div class="st-between st-top"><span class="st-small" role="status" data-save>Preview · Draft</span><div class="st-row">${['context','guidance'].map(p=>`<button class="st-button cursor-interaction" type="button" data-panel="${p}" aria-controls="st-context" aria-expanded="${state.panel===p}">${p==='context'?'Decision context':'Guidance'}</button>`).join('')}</div></div>`;}
 function errors(){return `<p class="st-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p>`;}
 function textField(key,label,rows=3){return `<label class="st-label" for="st-${key}">${label}</label><textarea class="st-field" id="st-${key}" data-field="${key}" maxlength="700" rows="${rows}">${esc(state[key])}</textarea>`;}
 function intervention(){return `${controls()}<h1>Review recommended intervention</h1><p class="st-description">Refine the proposal before deciding how the solution should be structured.</p><div class="st-row"><span class="st-tag">AI draft for review</span><span class="st-small">Learning response · L2 confirmed · Sample continuation</span></div><div class="st-readout"><h2>Why this approach is proposed</h2><p>Routing practice could support the confirmed learning measure: applying the approved criteria and explaining the decision.</p><p class="st-small">Based on Analysis brief V1 and the reviewed response decision. The available routing-error evidence does not establish a skill gap; that uncertainty carries forward.</p></div>${textField('approach','Which intervention would you like to proceed with?')}${textField('contribution','What should this intervention help people do?',2)}${textField('limits','Limitations, dependencies, and unresolved evidence',3)}<fieldset><legend>Which written deliverables should be developed?</legend><label class="st-choice cursor-interaction"><input type="checkbox" data-field="elearning" ${state.elearning?'checked':''}><span>Detailed e-learning storyboard<small>Tool-specific screens or blocks, scripts, interactions, and the reviewed assessments.</small></span></label><label class="st-choice cursor-interaction"><input type="checkbox" data-field="support" ${state.support?'checked':''}><span>Complete written learning-support draft<small>A guide or reference that supports this learning response.</small></span></label></fieldset><div data-support-title ${state.support?'':'hidden'}><label class="st-label" for="st-supportTitle">Working title for the support draft</label><input class="st-field" id="st-supportTitle" data-field="supportTitle" maxlength="180" type="text" value="${esc(state.supportTitle)}"></div><p class="st-footnote">This screen follows the confirmed learning route. Changes to that route are reviewed in the performance-solution decision.</p>${errors()}<div class="st-actions">${btn('Save and return later','pause')}${btn(state.elearning?'Confirm intervention and review format →':'Confirm intervention and review next step →','accept-intervention',true)}</div>`;}
 function unitMarkup(u,index){return `<section class="st-unit" aria-labelledby="st-unit-heading-${u.id}"><div class="st-between"><h3 id="st-unit-heading-${u.id}">Unit ${index+1} <span class="st-small">· U${u.id}</span></h3>${state.units.length>1?`<button class="st-button cursor-interaction" type="button" data-remove="${u.id}" aria-label="Remove unit ${index+1}">Remove</button>`:''}</div><label class="st-label" for="st-unit-title-${u.id}">Working title</label><input class="st-field" id="st-unit-title-${u.id}" type="text" data-unit="${u.id}" data-key="title" maxlength="180" value="${esc(u.title)}"><label class="st-label" for="st-unit-focus-${u.id}">What should this unit or module address?</label><textarea class="st-field" id="st-unit-focus-${u.id}" data-unit="${u.id}" data-key="focus" maxlength="400" rows="2">${esc(u.focus)}</textarea>${state.format==='mix'?`<label class="st-label" for="st-unit-kind-${u.id}">Unit type</label><select class="st-field" id="st-unit-kind-${u.id}" data-unit="${u.id}" data-key="kind"><option value="">Choose a type</option><option value="micro" ${u.kind==='micro'?'selected':''}>Microlearning</option><option value="module" ${u.kind==='module'?'selected':''}>Course module</option></select>`:''}</section>`;}
 function formatView(){return `${controls()}<h1>Shape the e-learning structure</h1><p class="st-description">Choose the format first. Authoring-tool selection comes next.</p><div class="st-row"><span class="st-tag">Editable starting outline</span><span class="st-small">Intervention confirmed for this preview</span></div><fieldset><legend>How should this e-learning be structured?</legend>${Object.entries(formats).map(([key,label])=>`<label class="st-choice cursor-interaction"><input type="radio" name="st-format" value="${key}" ${state.format===key?'checked':''}><span>${label}<small>${key==='micro'?'Focused units addressing a specific task or need.':key==='course'?'A connected sequence of modules supporting a broader learning outcome.':'A course sequence with focused units where useful.'}</small></span></label>`).join('')}</fieldset>${textField('formatReason','Rationale for this structure',2)}<section class="st-section"><h2>Review the initial outline</h2><p class="st-small">Proposed units, not final screen counts. Refine the sequence after objectives and assessments are defined.</p><div class="st-units">${state.units.map(unitMarkup).join('')}</div>${state.units.length<6?btn('Add unit or module','add-unit'):'<p class="st-small">This preview supports up to six units.</p>'}</section><p class="st-footnote">Five minutes and moderate interaction are a reference example, not a project-wide limit.</p>${errors()}<div class="st-actions">${btn('Back to intervention','intervention')}${btn('Confirm format and choose tools →','accept-format',true)}</div>`;}
 function toolSelect(u){return `<section class="st-unit"><h3>U${u.id} · ${esc(u.title)}</h3><label class="st-label" for="st-tool-${u.id}">Which tool will be used for this unit?</label><select class="st-field" id="st-tool-${u.id}" data-unit="${u.id}" data-key="tool"><option value="">Choose a tool</option>${['storyline','rise'].map(t=>`<option value="${t}" ${u.tool===t?'selected':''}>${tools[t]}</option>`).join('')}</select></section>`;}
 function allocation(){if(state.tool!=='both')return `<div class="st-readout"><p>${state.tool?`All current e-learning units are assigned to ${tools[state.tool]} for this draft.`:'Choose an authoring tool to see the allocation.'}</p></div>`;return `<section class="st-section"><h2>Allocate the components</h2><p class="st-small">Assign each unit to a tool. If a unit needs both, split it into components in the outline.</p><div class="st-units">${state.units.map(toolSelect).join('')}</div>${textField('connection','How should learners move between these components?',4)}<p class="st-footnote">Describe the sequence and entry/return points. The connection needs technical feasibility review before final build instructions.</p></section>`;}
 function toolsView(){return `${controls()}<h1>Choose the authoring tools</h1><p class="st-description">Choose tools for the reviewed structure and intended learning experience.</p><div class="st-row"><span class="st-tag">${formats[state.format]}</span><span class="st-small">${state.units.length} ${state.units.length===1?'unit':'units'} · Format confirmed</span></div><fieldset><legend>Which authoring tools will be used?</legend>${Object.entries(tools).map(([key,label])=>`<label class="st-choice cursor-interaction"><input type="radio" name="st-tool" value="${key}" ${state.tool===key?'checked':''}><span>${label}</span></label>`).join('')}</fieldset><p class="st-footnote">Format and tool are separate choices. Microlearning does not automatically mean Rise, and a course does not automatically mean Storyline.</p><div data-allocations>${allocation()}</div>${errors()}<div class="st-actions">${btn('Back to format and outline','format')}${btn('Confirm structure and review summary →','accept-tools',true)}</div>`;}
 function summary(){return `${controls()}<span class="st-tag">${state.elearning?'Structure confirmed for this draft':'Intervention confirmed'}</span><h1 style="margin-top:18px">Design choices carried forward</h1><p class="st-description">These choices become the starting point for objectives and the remaining Design sections.</p><dl class="st-summary"><dt>Learning response</dt><dd>${esc(state.approach)}</dd><dt>Deliverables</dt><dd>${state.elearning?'Detailed e-learning storyboard':''}${state.elearning&&state.support?'\n':''}${state.support?esc(state.supportTitle)+' · Complete written draft':''}</dd>${state.elearning?`<dt>Format</dt><dd>${formats[state.format]}</dd><dt>Authoring tools</dt><dd>${tools[state.tool]}</dd><dt>Initial outline</dt><dd>${state.units.map(u=>`U${u.id} · ${esc(u.title)}\n${state.tool==='both'?tools[u.tool]:tools[state.tool]}${state.format==='mix'?' · '+(u.kind==='micro'?'Microlearning':'Course module'):''}`).join('\n\n')}</dd>${state.tool==='both'?`<dt>Component connection</dt><dd>${esc(state.connection)}<p class="st-footnote">Proposed connection · Feasibility review required</p></dd>`:''}`:''}<dt>Open items</dt><dd>${esc(state.limits)}</dd></dl><div class="st-readout"><h2>Next: learning objectives</h2><p>Draft observable objectives using revised Bloom’s taxonomy and the confirmed L2 measure. Then break them into enabling objectives to identify the content and support needed.</p><p class="st-small">Assessments will be defined during Design and carried into the storyboard. This preview ends before objective generation.</p></div><div class="st-actions">${btn('Edit intervention','intervention')}${state.elearning?btn('Edit structure','format'):''}</div>`;}
 function navMarkup(){const entries=[['intervention','Intervention',state.interventionAccepted?'Confirmed':'Needs review',true],['format','Format and outline',state.formatAccepted?'Confirmed':'Needs review',state.interventionAccepted&&state.elearning],['tools','Authoring tools',state.toolsAccepted?'Confirmed':'Needs review',state.formatAccepted&&state.elearning],['summary','Review choices',state.elearning?'Confirmed choices':'Learning support',state.interventionAccepted&&(!state.elearning||state.toolsAccepted)]];nav.innerHTML=`<h2>Design</h2><ol>${entries.filter(([key])=>state.elearning||!['format','tools'].includes(key)).map(([key,label,status,enabled])=>`<li>${enabled?`<button type="button" class="cursor-interaction" data-action="${key}" ${state.view===key?'aria-current="location"':''}>${label}<small>${status}</small></button>`:`<div class="st-nav-locked">${label}<small>After the preceding decision</small></div>`}</li>`).join('')}</ol><p class="st-nav-note">Saved edits and confirmed decisions are separate. Changes retain your draft and flag affected choices for review.</p>`;}
 function panelMarkup(){panel.hidden=state.panel===null;shell.classList.toggle('st-expanded',state.panel!==null);if(!state.panel)return;const context=state.panel==='context';panel.innerHTML=`<div class="st-panel-head"><h2>${context?'Decision context':'Design guidance'}</h2>${btn('Close','close-panel')}</div>${context?'<p class="st-small">Sample baseline from the preceding review; separate previews do not transfer edits automatically.</p><h3>Performance</h3><p>Resolve routine complaints independently and escalate cases meeting the approved criteria.</p><h3>Confirmed response</h3><p>Learning response, with remaining evidence gaps visible.</p><h3>Confirmed L2 measure</h3><p>Scenario-based routing tasks using the guide. Decisions and explanations match the applicable criteria; all critical decisions correct.</p><h3>Source basis</h3><p>Sample supervisor notes describe routing errors. The sample procedure defines criteria. Neither establishes the cause of errors.</p><h3>Constraints</h3><p>Desktop use. Subject-matter expert: 30 minutes weekly, two business days review turnaround.</p>':state.view==='intervention'?'<h3>Review the fit</h3><p>Link the proposed intervention to the reviewed performance influences and learning measure.</p><h3>Keep limits visible</h3><p>A learning response cannot resolve missing tools, conflicting feedback, or workflow barriers on its own.</p><h3>Written support</h3><p>This learning branch can include a written support draft. A solely nonlearning response uses its own handoff and task requirements.</p>':state.view==='format'?'<h3>Choose by the task</h3><p>Use the performance need, task complexity, prior knowledge, and context to choose the format. Duration alone does not decide.</p><h3>Start with an outline</h3><p>Keep units editable. Objectives and assessment design may reveal a better sequence or grouping.</p>':'<h3>Allocate deliberately</h3><p>Either tool can be considered for any format. Confirm suitability for the actual activities and assessments.</p><h3>Using both</h3><p>Record each component’s tool and how learners move between them. Confirm integration feasibility before final specifications.</p><h3>Later changes</h3><p>Preserve objective and assessment links if the format or tool changes.</p>'}`;}
 function render(){navMarkup();main.innerHTML=state.view==='intervention'?intervention():state.view==='format'?formatView():state.view==='tools'?toolsView():state.view==='summary'?summary():`<h1>Your Design work is paused</h1><p class="st-description">Return to the intervention, saved outline, and review state.</p>${btn('Resume intervention review','intervention',true)}`;panelMarkup();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidate(level){if(level==='intervention')state.interventionAccepted=false;if(level!=='tools')state.formatAccepted=false;state.toolsAccepted=false;}
 function flagStatus(){navMarkup();let el=main.querySelector('[data-review-change]');if(!el){el=document.createElement('p');el.className='st-footnote';el.dataset.reviewChange='true';main.querySelector('.st-actions')?.before(el);}if(el)el.textContent='Changes saved as a draft. Confirm this step again; affected later choices need review.';}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const t=e.target;if(t.dataset.unit){const u=state.units.find(u=>u.id===Number(t.dataset.unit));if(!u||!['title','focus'].includes(t.dataset.key))return;u[t.dataset.key]=t.value;invalidate('format');}else{const f=t.dataset.field;if(!['approach','contribution','limits','supportTitle','formatReason','connection'].includes(f))return;state[f]=t.value;invalidate(f==='connection'?'tools':f==='formatReason'?'format':'intervention');}flagStatus();schedule();});
 root.addEventListener('change',e=>{const t=e.target;if(t.name==='st-format'){state.format=t.value;invalidate('format');error='';render();save();main.querySelector(`input[name="st-format"][value="${state.format}"]`)?.focus();announce(formats[state.format]+' selected; outline retained.');return;}if(t.name==='st-tool'){state.tool=t.value;invalidate('tools');error='';render();save();main.querySelector(`input[name="st-tool"][value="${state.tool}"]`)?.focus();return;}if(['elearning','support'].includes(t.dataset.field)){state[t.dataset.field]=t.checked;invalidate('intervention');render();save();main.querySelector(`[data-field="${t.dataset.field}"]`)?.focus();return;}if(t.dataset.unit){const u=state.units.find(u=>u.id===Number(t.dataset.unit));if(!u||!['kind','tool'].includes(t.dataset.key))return;u[t.dataset.key]=t.value;invalidate(t.dataset.key==='tool'?'tools':'format');flagStatus();save();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;panelMarkup();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.remove){const id=Number(b.dataset.remove);if(state.units.length>1)state.units=state.units.filter(u=>u.id!==id);invalidate('format');render();save();main.querySelector('[data-action="add-unit"]')?.focus();announce('Unit removed. Remaining titles and IDs preserved.');return;}const a=b.dataset.action;if(!a)return;error='';if(a==='close-panel'){state.panel=null;panelMarkup();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='add-unit'){if(state.units.length<6){state.units.push({id:state.nextId++,title:'',focus:'',kind:'',tool:''});invalidate('format');}render();save();main.querySelector(`#st-unit-title-${state.units.at(-1).id}`)?.focus();return;}
 if(a==='accept-intervention'){if(!state.approach.trim()||!state.contribution.trim())error='Define the intervention and its expected contribution.';else if(!state.elearning&&!state.support)error='Select at least one deliverable.';else if(state.support&&!state.supportTitle.trim())error='Add a working title for the written support draft.';else{state.interventionAccepted=true;state.view=state.elearning?'format':'summary';}}
 else if(a==='accept-format'){if(state.units.some(u=>!u.title.trim()||!u.focus.trim()))error='Add a title and focus for every unit or module.';else if(state.format==='mix'&&state.units.some(u=>!u.kind))error='Choose a type for each unit in the mixed structure.';else{state.formatAccepted=true;state.view='tools';}}
 else if(a==='accept-tools'){if(!state.tool)error='Choose Storyline, Rise, or both.';else if(state.tool==='both'&&state.units.some(u=>!u.tool))error='Assign an authoring tool to every unit or component.';else if(state.tool==='both'&&(!state.units.some(u=>u.tool==='storyline')||!state.units.some(u=>u.tool==='rise')))error='Allocate at least one component to each tool, or choose a single tool.';else if(state.tool==='both'&&!state.connection.trim())error='Describe how learners should move between the components.';else{state.toolsAccepted=true;state.hadConfirmedStructure=true;state.view='summary';}}
 else if(a==='pause'){state.view='paused';state.panel=null;}else if(['intervention','format','tools','summary'].includes(a)){state.view=a;}
 render();save();if(error){announce(error);const target=state.view==='tools'?'input[name="st-tool"]':state.view==='format'?'.st-unit input':'[data-field="approach"]';main.querySelector(target)?.focus();}else{focusFirst();announce(state.view==='summary'?'Confirmed choices carried forward in this preview.':'Design step opened.');}});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
