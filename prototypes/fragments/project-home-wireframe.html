<div id="aipid-home-wireframe" class="viz-carousel" aria-label="Project home layout options">
  <section data-variant="Project cards" aria-label="Project home with project cards">
    <div class="id-app" data-layout="cards" aria-label="Project cards layout">
      <header class="id-chrome">
        <div class="id-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i><span>AIPoweredID</span></div>
        <span class="id-demo">Wireframe · Sample data</span>
      </header>
      <main class="id-main" aria-label="Project home"></main>
      <footer class="id-footer"><span>Example content · No live saving or AI connection</span><span class="id-announcement" role="status" aria-live="polite"></span></footer>
    </div>
  </section>
  <section data-variant="Project rows" aria-label="Project home with compact project rows" hidden>
    <div class="id-app" data-layout="rows" aria-label="Project rows layout">
      <header class="id-chrome">
        <div class="id-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i><span>AIPoweredID</span></div>
        <span class="id-demo">Wireframe · Sample data</span>
      </header>
      <main class="id-main" aria-label="Project home"></main>
      <footer class="id-footer"><span>Example content · No live saving or AI connection</span><span class="id-announcement" role="status" aria-live="polite"></span></footer>
    </div>
  </section>
</div>
<style>
  #aipid-home-wireframe .id-app {
    color-scheme: light dark;
    --id-bg: light-dark(#f5f5f4, #171717);
    --id-paper: light-dark(#ffffff, #222222);
    --id-ink: light-dark(#242424, #f2f2f0);
    --id-soft: light-dark(#565656, #bdbdb9);
    --id-line: light-dark(#d4d4d0, #50504c);
    --id-inset: light-dark(#eeeee9, #30302d);
    --id-button: light-dark(#30302d, #eeeeea);
    --id-button-text: light-dark(#ffffff, #242424);
    --id-space: 20px;
    background: var(--id-bg);
    color: var(--id-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 400;
    min-height: 660px;
    display: flex;
    flex-direction: column;
  }
  #aipid-home-wireframe .id-app * {box-sizing: border-box;}
  #aipid-home-wireframe .id-app [hidden] {display: none !important;}
  #aipid-home-wireframe .id-chrome {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    padding: 23px 112px 23px 32px;
    background: var(--id-paper); border-bottom: 1px solid var(--id-line);
  }
  #aipid-home-wireframe .id-brand {display: flex; align-items: center; gap: 10px; font-weight: 500;}
  #aipid-home-wireframe .id-brand svg {width: 20px; height: 20px;}
  #aipid-home-wireframe .id-demo {margin-left: auto; color: var(--id-soft); font-size: 12px;}
  #aipid-home-wireframe .id-main {padding: 30px 32px; flex: 1; min-width: 0;}
  #aipid-home-wireframe .id-page-heading {display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px;}
  #aipid-home-wireframe .id-app h1 {font-size: 26px; line-height: 1.3; font-weight: 500; margin: 0 0 7px;}
  #aipid-home-wireframe .id-app h2 {font-size: 18px; line-height: 1.4; font-weight: 500; margin: 0; overflow-wrap: anywhere;}
  #aipid-home-wireframe .id-app p {margin: 0;}
  #aipid-home-wireframe .id-subtitle {color: var(--id-soft);}
  #aipid-home-wireframe .id-button {
    font: inherit; font-weight: 500; border: 1px solid var(--id-line); border-radius: 6px;
    color: var(--id-ink); background: var(--id-paper); padding: 9px 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 42px; max-width: 100%; text-align: center;
  }
  #aipid-home-wireframe .id-primary {background: var(--id-button); color: var(--id-button-text); border-color: var(--id-button);}
  #aipid-home-wireframe .id-button:hover {filter: brightness(.94);}
  #aipid-home-wireframe .id-button svg {width: 16px; height: 16px; flex-shrink: 0;}
  #aipid-home-wireframe .id-projects {display: grid; gap: var(--id-space);}
  #aipid-home-wireframe [data-layout="cards"] .id-projects {grid-template-columns: repeat(3,minmax(0,1fr));}
  #aipid-home-wireframe .id-project {
    background: var(--id-paper); border: 1px solid var(--id-line); border-radius: 8px;
    padding: 20px; min-width: 0;
  }
  #aipid-home-wireframe [data-layout="cards"] .id-project {display: flex; flex-direction: column; gap: 18px;}
  #aipid-home-wireframe .id-title-group {min-width: 0;}
  #aipid-home-wireframe .id-kind {color: var(--id-soft); font-size: 12px; margin-top: 5px;}
  #aipid-home-wireframe .id-stage {
    display: inline-flex; align-items: center; justify-content: center; align-self: flex-start;
    background: var(--id-inset); border-radius: 4px; padding: 4px 8px;
    font-size: 12px; font-weight: 500; width: max-content; max-width: 100%;
  }
  #aipid-home-wireframe .id-next {min-height: 67px;}
  #aipid-home-wireframe .id-small-label {display: block; color: var(--id-soft); font-size: 12px; margin-bottom: 3px;}
  #aipid-home-wireframe .id-issue {display: flex; align-items: flex-start; gap: 7px; font-size: 13px;}
  #aipid-home-wireframe .id-issue svg {width: 15px; height: 15px; margin-top: 3px; flex-shrink: 0;}
  #aipid-home-wireframe .id-saved {color: var(--id-soft); font-size: 12px;}
  #aipid-home-wireframe [data-layout="cards"] .id-project-action {margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 11px;}
  #aipid-home-wireframe [data-layout="rows"] .id-projects {gap: 12px;}
  #aipid-home-wireframe [data-layout="rows"] .id-project {display: grid; grid-template-columns: minmax(180px,1.5fr) minmax(180px,1.3fr) minmax(150px,1fr); align-items: center; gap: var(--id-space);}
  #aipid-home-wireframe [data-layout="rows"] .id-project-heading {display: flex; flex-direction: column; align-items: flex-start; gap: 10px;}
  #aipid-home-wireframe [data-layout="rows"] .id-next {min-height: 0;}
  #aipid-home-wireframe [data-layout="rows"] .id-issue {margin-top: 8px;}
  #aipid-home-wireframe [data-layout="rows"] .id-project-action {display: flex; flex-direction: column; align-items: flex-end; gap: 10px;}
  #aipid-home-wireframe .id-footer {padding: 14px 32px 18px; color: var(--id-soft); font-size: 12px;}
  #aipid-home-wireframe .id-announcement {position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;}
  #aipid-home-wireframe .id-back {margin-bottom: 22px;}
  #aipid-home-wireframe .id-context {background: var(--id-paper); border: 1px solid var(--id-line); border-radius: 8px; padding: 24px; max-width: 760px;}
  #aipid-home-wireframe .id-context h2 {margin-bottom: 18px;}
  #aipid-home-wireframe .id-context dl {display: grid; grid-template-columns: 145px minmax(0,1fr); gap: 15px 20px; margin: 0;}
  #aipid-home-wireframe .id-context dt {color: var(--id-soft);}
  #aipid-home-wireframe .id-context dd {margin: 0; overflow-wrap: anywhere;}
  #aipid-home-wireframe .id-stages {display: flex; gap: 10px 20px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0 0 22px; color: var(--id-soft); font-size: 13px;}
  #aipid-home-wireframe .id-stages [aria-current="step"] {color: var(--id-ink); font-weight: 500; text-decoration: underline; text-underline-offset: 5px;}
  #aipid-home-wireframe .id-preview-label {display: block; color: var(--id-soft); font-size: 12px; margin-top: 18px;}
  #aipid-home-wireframe .id-form {max-width: 600px;}
  #aipid-home-wireframe .id-app label {font-weight: 500; display: block; margin-bottom: 7px;}
  #aipid-home-wireframe .id-app input {
    font: inherit; font-size: 16px; color: var(--id-ink); background: var(--id-paper);
    border: 1px solid var(--id-line); border-radius: 5px; padding: 10px 12px; width: 100%; min-height: 44px;
  }
  #aipid-home-wireframe .id-hint {color: var(--id-soft); margin-top: 8px !important; font-size: 13px;}
  #aipid-home-wireframe .id-form-actions {display: flex; gap: 10px; flex-wrap: wrap; margin-top: 25px;}
  #aipid-home-wireframe .id-error {margin-top: 10px !important; font-weight: 500;}
  @media(max-width: 900px) {
    #aipid-home-wireframe [data-layout="cards"] .id-projects {grid-template-columns: repeat(2,minmax(0,1fr));}
    #aipid-home-wireframe .id-app {min-height: 970px;}
    #aipid-home-wireframe [data-layout="rows"] .id-project {grid-template-columns: minmax(170px,1.2fr) minmax(160px,1fr);}
    #aipid-home-wireframe [data-layout="rows"] .id-project-action {grid-column: 1/-1; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap;}
  }
  @media(max-width: 560px) {
    #aipid-home-wireframe .id-main {padding: 24px 18px;}
    #aipid-home-wireframe .id-chrome {padding: 20px 100px 20px 18px;}
    #aipid-home-wireframe .id-demo {margin-left: 0;}
    #aipid-home-wireframe .id-app {min-height: 1370px;}
    #aipid-home-wireframe [data-layout="cards"] .id-projects {grid-template-columns: minmax(0,1fr);}
    #aipid-home-wireframe [data-layout="rows"] .id-project {grid-template-columns: minmax(0,1fr); gap: 15px;}
    #aipid-home-wireframe [data-layout="rows"] .id-project-action {grid-column: auto; flex-direction: column; align-items: flex-start;}
    #aipid-home-wireframe .id-context {padding: 18px;}
    #aipid-home-wireframe .id-context dl {grid-template-columns: minmax(0,1fr); gap: 5px;}
    #aipid-home-wireframe .id-context dd {margin-bottom: 13px;}
    #aipid-home-wireframe .id-footer {padding-left: 18px; padding-right: 18px;}
  }
</style>
<script>
(() => {
  const root = document.getElementById('aipid-home-wireframe');
  const samples = [
    {id:'complaints', title:'Customer complaint escalation', kind:'E-learning · Storyline + Rise', stage:'Design', next:'Review enabling objectives', issue:'2 content gaps', saved:'Oct 17, 10:42 AM', place:'Learning objectives → Enabling objectives', last:'Refining the criteria for EO-1.2.', open:'Two enabling objectives still need supporting content.'},
    {id:'checklist', title:'New starter checklist', kind:'Performance support · Checklist', stage:'Analysis', next:'Add supporting evidence', issue:'1 evidence gap', saved:'Oct 17, 9:15 AM', place:'Evidence and possible causes', last:'Describing the current performance gap.', open:'Supporting evidence has not been added yet.'},
    {id:'handover', title:'Clear shift handovers', kind:'Microlearning · Rise', stage:'Development', next:'Review the Development sample', issue:'1 source needs confirmation', saved:'Oct 16, 4:20 PM', place:'Development sample → Lesson 1', last:'Reviewing a proposed scenario and feedback.', open:'Confirm the source supporting the handover example.'}
  ];
  const state = {created:[],views:{cards:'home',rows:'home'},selected:{cards:null,rows:null},spacing:{cards:20,rows:20}};
  const apps = Array.from(root.querySelectorAll('.id-app'));
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const allProjects = () => samples.concat(state.created);
  const icons = () => {if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}});};
  const saveState = () => {
    if(!window.openai || typeof window.openai.setWidgetState !== 'function') return;
    const selected = apps.map(app=>({layout:app.dataset.layout,project:state.selected[app.dataset.layout],view:state.views[app.dataset.layout]}));
    window.openai.setWidgetState({modelContent:{screen:'Project home wireframe',selected},privateContent:state}).catch(()=>{});
  };
  function applyState(saved) {
    const p = saved && saved.privateContent;
    if(!p || typeof p !== 'object') return;
    if(Array.isArray(p.created)) state.created = p.created.filter(x=>x && typeof x.id==='string' && typeof x.title==='string').slice(0,6);
    for(const layout of ['cards','rows']) {
      if(p.views && ['home','new','resume'].includes(p.views[layout])) state.views[layout] = p.views[layout];
      if(p.selected && typeof p.selected[layout]==='string') state.selected[layout] = p.selected[layout];
      if(p.spacing && Number.isFinite(p.spacing[layout])) state.spacing[layout] = Math.max(12, Math.min(28,p.spacing[layout]));
    }
  }
  function projectMarkup(project, layout) {
    const heading = `<div class="id-title-group"><h2>${escape(project.title)}</h2><p class="id-kind">${escape(project.kind)}</p></div>`;
    const stage = `<span class="id-stage">${escape(project.stage)}</span>`;
    const next = `<div><div class="id-next"><span class="id-small-label">Next action</span><p>${escape(project.next)}</p></div><p class="id-issue"><i data-lucide="circle-alert" aria-hidden="true"></i><span>${escape(project.issue)}</span></p></div>`;
    const action = `<div class="id-project-action"><span class="id-saved">${project.preview?'Preview only':`Last saved ${escape(project.saved)}`}</span><button class="id-button cursor-interaction" type="button" data-action="continue" data-project="${escape(project.id)}" aria-label="Continue project: ${escape(project.title)}">Continue project<i data-lucide="arrow-right" aria-hidden="true"></i></button></div>`;
    return `<article class="id-project" aria-label="${escape(project.title)}">${layout==='cards'?stage+heading+next+action:`<div class="id-project-heading">${heading}${stage}</div>`+next+action}</article>`;
  }
  function homeMarkup(layout) {
    return `<div class="id-page-heading"><div><h1>Your projects</h1><p class="id-subtitle">Pick up where you left off.</p></div><button class="id-button id-primary cursor-interaction" type="button" data-action="new"><i data-lucide="plus" aria-hidden="true"></i>New project</button></div><div class="id-projects" aria-label="Saved projects">${allProjects().map(p=>projectMarkup(p,layout)).join('')}</div>`;
  }
  function resumeMarkup(layout) {
    const p = allProjects().find(x=>x.id===state.selected[layout]);
    if(!p) {state.views[layout]='home'; return homeMarkup(layout);}
    return `<button class="id-button id-back cursor-interaction" type="button" data-action="home"><i data-lucide="arrow-left" aria-hidden="true"></i>Back to projects</button><div class="id-page-heading"><div><h1>${escape(p.title)}</h1><p class="id-subtitle">Your saved place</p></div></div><ol class="id-stages" aria-label="Project stages">${['Analysis','Design','Development'].map(s=>`<li ${p.stage===s?'aria-current="step"':''}>${s}</li>`).join('')}</ol><section class="id-context" aria-label="Resume recap"><h2>Continue where you left off</h2><dl><dt>Section</dt><dd>${escape(p.place)}</dd><dt>Last action</dt><dd>${escape(p.last)}</dd><dt>Outstanding issues</dt><dd>${escape(p.open)}</dd><dt>Next action</dt><dd>${escape(p.next)}</dd><dt>Save status</dt><dd>${p.preview?'Preview project — no live saving':`Example saved state · ${escape(p.saved)}`}</dd></dl><span class="id-preview-label">Resume recap preview · The stage workspace is the next screen to design.</span></section>`;
  }
  function newMarkup(layout) {
    return `<button class="id-button id-back cursor-interaction" type="button" data-action="home"><i data-lucide="arrow-left" aria-hidden="true"></i>Back to projects</button><div class="id-page-heading"><div><h1>Start a new project</h1><p class="id-subtitle">Give it a working title. You can change it later.</p></div></div><form class="id-context id-form" aria-label="New example project" data-new-form><label for="id-project-title-${layout}">Project name</label><input id="id-project-title-${layout}" name="projectTitle" type="text" maxlength="80" required autocomplete="off" placeholder="For example, customer complaint escalation" aria-describedby="id-project-hint-${layout}"><p class="id-hint" id="id-project-hint-${layout}">Your project starts in Analysis.</p><p class="id-error" role="alert" hidden>Please enter a working project title.</p><div class="id-form-actions"><button class="id-button id-primary cursor-interaction" type="submit">Create project<i data-lucide="arrow-right" aria-hidden="true"></i></button><button class="id-button cursor-interaction" type="button" data-action="home">Cancel</button></div><span class="id-preview-label">Preview only · Creates example content in this wireframe.</span></form>`;
  }
  function renderApp(app) {
    const layout = app.dataset.layout;
    const main = app.querySelector('.id-main');
    main.innerHTML = state.views[layout]==='new'?newMarkup(layout):state.views[layout]==='resume'?resumeMarkup(layout):homeMarkup(layout);
    app.style.setProperty('--id-space', `${state.spacing[layout]}px`);
  }
  function renderAll() {apps.forEach(renderApp);icons();}
  applyState(window.openai && window.openai.widgetState);
  renderAll();
  root.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if(!button) return;
    const app = button.closest('.id-app');
    const layout = app.dataset.layout;
    if(button.dataset.action==='home') state.views[layout]='home';
    if(button.dataset.action==='new') state.views[layout]='new';
    if(button.dataset.action==='continue') {state.selected[layout]=button.dataset.project;state.views[layout]='resume';}
    renderApp(app);icons();saveState();
    const selectedProject = allProjects().find(p=>p.id===state.selected[layout]);
    app.querySelector('.id-announcement').textContent = state.views[layout]==='new'?'New project form opened.':state.views[layout]==='resume'?`Resume recap opened for ${selectedProject ? selectedProject.title : 'the selected project'}.`:'Project home opened.';
    const focusTarget = state.views[layout]==='new'?app.querySelector('input'):app.querySelector('.id-main button');
    if(focusTarget) focusTarget.focus();
  });
  root.addEventListener('submit', event => {
    const form = event.target.closest('form[data-new-form]');
    if(!form) return;
    event.preventDefault();
    const title = form.elements.projectTitle.value.trim();
    if(!title) {form.querySelector('.id-error').hidden=false;form.elements.projectTitle.focus();return;}
    const app = form.closest('.id-app');const layout=app.dataset.layout;
    if(state.created.length>=6) state.created.shift();
    const id = `preview-${Date.now()}`;
    state.created.push({id,title,kind:'Solution to be determined',stage:'Analysis',next:'Describe the workplace task',issue:'Analysis not started',saved:'Preview only',place:'Project context and performance gap',last:'Created a working project title in this preview.',open:'Describe the task, desired performance, current performance, and audience.',preview:true});
    state.selected[layout]=id;state.views[layout]='resume';
    renderAll();saveState();app.querySelector('.id-main button').focus();
    app.querySelector('.id-announcement').textContent=`Example project created: ${title}. Analysis is the first stage.`;
  });
  window.addEventListener('openai:set_globals',event=>{
    if(event.detail && event.detail.globals && event.detail.globals.widgetState) {applyState(event.detail.globals.widgetState);renderAll();}
  });
  if(globalThis.Tweak) {
    apps.forEach(app=>{
      const layout=app.dataset.layout;
      const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--id-space',`${state.spacing[layout]}px`);saveState();}});
      tweak.addSlider(state.spacing,layout,{label:'Project spacing',min:12,max:28,step:2,unit:'px'});
    });
  }
})();
</script>
