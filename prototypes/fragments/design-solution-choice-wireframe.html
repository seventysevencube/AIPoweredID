<div id="aipid-choice-wireframe" aria-label="AI-supported solution choice and derived deliverables wireframe">
 <header class="sc-chrome"><span class="sc-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="sc-small sc-demo">Wireframe · Sample data</span></header>
 <div class="sc-project"><div><span class="sc-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="sc-shell"><nav class="sc-nav" aria-label="Solution decision steps"></nav><main class="sc-main" aria-label="Solution decision workspace"></main><aside class="sc-panel" id="sc-context" aria-label="Decision evidence and guidance" hidden></aside></div>
 <footer class="sc-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="sc-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-choice-wireframe{color-scheme:light dark;--sc-bg:light-dark(#f5f5f4,#171717);--sc-paper:light-dark(#fff,#222);--sc-ink:light-dark(#242424,#f2f2f0);--sc-soft:light-dark(#565656,#bdbdb9);--sc-line:light-dark(#d4d4d0,#50504c);--sc-inset:light-dark(#eeeee9,#30302d);--sc-button:light-dark(#30302d,#eeeeea);--sc-button-text:light-dark(#fff,#242424);background:var(--sc-bg);color:var(--sc-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-choice-wireframe *{box-sizing:border-box}
 #aipid-choice-wireframe [hidden]{display:none!important}
 #aipid-choice-wireframe p{margin:0}
 #aipid-choice-wireframe .sc-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--sc-paper);border-bottom:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-choice-wireframe .sc-brand svg{width:20px;height:20px}
 #aipid-choice-wireframe .sc-demo{margin-left:auto}
 #aipid-choice-wireframe .sc-small{font-size:12px;color:var(--sc-soft)}
 #aipid-choice-wireframe .sc-project{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;padding:17px 28px;background:var(--sc-paper);border-bottom:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-project p{font-weight:500}
 #aipid-choice-wireframe .sc-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;margin:0;padding:0;font-size:13px;color:var(--sc-soft)}
 #aipid-choice-wireframe [aria-current="step"]{color:var(--sc-ink);font-weight:500;text-decoration:underline;text-underline-offset:6px}
 #aipid-choice-wireframe .sc-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-choice-wireframe .sc-shell.sc-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-choice-wireframe .sc-nav{padding:25px 14px;border-right:1px solid var(--sc-line);min-width:0}
 #aipid-choice-wireframe .sc-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-choice-wireframe .sc-nav ol{list-style:none;display:grid;gap:7px;margin:0;padding:0}
 #aipid-choice-wireframe .sc-nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:11px 10px;color:var(--sc-ink);font:inherit;font-size:13px}
 #aipid-choice-wireframe .sc-nav button[aria-current="location"]{background:var(--sc-inset);border-color:var(--sc-line)}
 #aipid-choice-wireframe .sc-nav small{display:block;font-size:12px;color:var(--sc-soft);margin-top:4px}
 #aipid-choice-wireframe .sc-nav-note{margin:24px 10px 0;font-size:12px;color:var(--sc-soft)}
 #aipid-choice-wireframe .sc-locked{font-size:13px;color:var(--sc-soft);padding:11px 10px}
 #aipid-choice-wireframe .sc-main{padding:28px;min-width:0;background:var(--sc-paper)}
 #aipid-choice-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-choice-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-choice-wireframe h3{font-size:15px;font-weight:500;margin:0 0 10px}
 #aipid-choice-wireframe .sc-description{color:var(--sc-soft);margin-bottom:22px}
 #aipid-choice-wireframe .sc-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-choice-wireframe .sc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-choice-wireframe .sc-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--sc-line);border-radius:6px;background:var(--sc-paper);color:var(--sc-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-choice-wireframe .sc-primary{background:var(--sc-button);color:var(--sc-button-text);border-color:var(--sc-button)}
 #aipid-choice-wireframe .sc-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--sc-inset);border-radius:4px}
 #aipid-choice-wireframe .sc-readout{background:var(--sc-inset);border-radius:6px;padding:18px;margin:20px 0}
 #aipid-choice-wireframe .sc-readout p+p{margin-top:12px}
 #aipid-choice-wireframe .sc-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-choice-wireframe .sc-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--sc-line);border-radius:5px;color:var(--sc-ink);background:var(--sc-paper);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-choice-wireframe textarea{resize:vertical;display:block}
 #aipid-choice-wireframe fieldset{min-width:0;padding:0;margin:24px 0 0;border:0}
 #aipid-choice-wireframe legend{font-weight:500;margin-bottom:12px;padding:0}
 #aipid-choice-wireframe .sc-choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--sc-line);border-radius:6px;padding:14px;margin-bottom:9px}
 #aipid-choice-wireframe .sc-choice:has(input:checked){background:var(--sc-inset);border-color:var(--sc-ink)}
 #aipid-choice-wireframe .sc-choice small{display:block;font-size:13px;color:var(--sc-soft);margin-top:5px}
 #aipid-choice-wireframe input[type="radio"],#aipid-choice-wireframe input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;accent-color:var(--sc-button);margin:3px 0 0}
 #aipid-choice-wireframe .sc-check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;margin-top:12px}
 #aipid-choice-wireframe .sc-section{margin-top:24px;padding-top:22px;border-top:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-footnote{font-size:12px;color:var(--sc-soft);margin-top:13px}
 #aipid-choice-wireframe .sc-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-error{font-weight:500;margin-top:16px}
 #aipid-choice-wireframe .sc-panel{padding:25px 19px;min-width:0;border-left:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
 #aipid-choice-wireframe .sc-panel-head h2{margin:0}
 #aipid-choice-wireframe .sc-panel p{font-size:13px;margin:12px 0}
 #aipid-choice-wireframe .sc-panel h3{margin-top:20px}
 #aipid-choice-wireframe .sc-summary{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px 18px;margin:20px 0}
 #aipid-choice-wireframe .sc-summary dt{font-size:13px;color:var(--sc-soft)}
 #aipid-choice-wireframe .sc-summary dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
 #aipid-choice-wireframe .sc-list{padding-left:22px;margin:12px 0}
 #aipid-choice-wireframe .sc-list li+li{margin-top:10px}
 #aipid-choice-wireframe .sc-footer{font-size:12px;color:var(--sc-soft);padding:15px 28px;border-top:1px solid var(--sc-line)}
 #aipid-choice-wireframe .sc-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-choice-wireframe .sc-shell.sc-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-choice-wireframe .sc-expanded .sc-panel{grid-column:2;border-left:0;border-top:1px solid var(--sc-line)}#aipid-choice-wireframe .sc-expanded .sc-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-choice-wireframe .sc-shell,#aipid-choice-wireframe .sc-shell.sc-expanded{grid-template-columns:minmax(0,1fr)}#aipid-choice-wireframe .sc-expanded .sc-nav{grid-row:auto}#aipid-choice-wireframe .sc-expanded .sc-panel{grid-column:1}#aipid-choice-wireframe .sc-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--sc-line)}#aipid-choice-wireframe .sc-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}#aipid-choice-wireframe .sc-main{padding:24px 18px}#aipid-choice-wireframe .sc-project,#aipid-choice-wireframe .sc-footer{padding-left:18px;padding-right:18px}#aipid-choice-wireframe .sc-chrome{padding-left:18px;padding-right:100px}#aipid-choice-wireframe .sc-demo{margin-left:0}#aipid-choice-wireframe .sc-summary{grid-template-columns:minmax(0,1fr);gap:6px}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-choice-wireframe'),main=root.querySelector('.sc-main'),nav=root.querySelector('.sc-nav'),panel=root.querySelector('.sc-panel'),shell=root.querySelector('.sc-shell');
 const options={elearning:['E-learning','Build knowledge, practice decisions, and receive feedback before workplace application.'],aid:['Performance aid','Provide a checklist, guide, or decision support where the task is performed.'],both:['Both','Combine learning and practice with accessible support during the task.'],investigate:['Gather more evidence first','Resolve the gaps before choosing or drafting the solution.']};
 const purposes={work:'During work — support task performance',learning:'During learning — support a learning outcome',both:'During both learning and work'};
 const state={view:'choice',panel:null,choice:'',purpose:'',reason:'',routeAcknowledged:false,accepted:false,currentRoute:'learning',acceptedRoute:null,outputsConfirmed:false,storyTitle:'Complaint-routing e-learning',aidTitle:'Complaint-routing reference aid',scope:'Apply the approved escalation criteria to routine and escalation cases. Confirm the current procedure before final content is approved.',openItems:'Verify whether representatives can apply the criteria with the guide available. Observe guide access and usability. Confirm expectations and feedback.',resume:'choice'};
 let timer,error='';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(text,action,primary=false)=>`<button type="button" class="sc-button ${primary?'sc-primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
 const hasCourse=()=>['elearning','both'].includes(state.choice);
 const hasAid=()=>['aid','both'].includes(state.choice);
 function route(){if(state.choice==='investigate')return 'pending';if(!state.choice||(hasAid()&&!state.purpose))return null;if(!hasAid())return 'learning';if(state.purpose==='learning')return 'learning';if(hasCourse()||state.purpose==='both')return 'combined';return 'nonlearning';}
 const routeLabel=r=>({learning:'Learning response',combined:'Combined response',nonlearning:'Nonlearning response',pending:'Further investigation'}[r]||'Not yet determined');
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Solution choice before deliverables wireframe',view:state.view,solutionChoice:state.choice||null,aidPurpose:state.purpose||null,solutionConfirmed:state.accepted,responseRoute:state.acceptedRoute,deliverablesConfirmed:state.outputsConfirmed},privateContent:{kind:'solution-choice-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='solution-choice-v1')return;for(const k of ['reason','scope','openItems'])if(typeof p[k]==='string')state[k]=p[k].slice(0,900);for(const k of ['storyTitle','aidTitle'])if(typeof p[k]==='string')state[k]=p[k].slice(0,180);if(Object.hasOwn(options,p.choice))state.choice=p.choice;if(Object.hasOwn(purposes,p.purpose))state.purpose=p.purpose;for(const k of ['currentRoute','acceptedRoute'])if(['learning','combined','nonlearning','pending'].includes(p[k]))state[k]=p[k];for(const k of ['accepted','routeAcknowledged','outputsConfirmed'])if(typeof p[k]==='boolean')state[k]=p[k];if(['choice','outputs','summary','investigation','paused'].includes(p.view))state.view=p.view;if(['choice','outputs','summary','investigation'].includes(p.resume))state.resume=p.resume;if(!route())state.accepted=false;if(!state.accepted&&['outputs','summary','investigation'].includes(state.view))state.view='choice';if(state.accepted&&state.choice==='investigate'&&['outputs','summary'].includes(state.view))state.view='investigation';}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function announce(t){root.querySelector('.sc-live').textContent=t;}
 function top(){return `<div class="sc-top"><span class="sc-small" role="status" data-save>Preview · Draft</span><div class="sc-row">${['evidence','guidance'].map(p=>`<button class="sc-button cursor-interaction" type="button" data-panel="${p}" aria-controls="sc-context" aria-expanded="${state.panel===p}">${p==='evidence'?'Analysis evidence':'Guidance'}</button>`).join('')}</div></div>`;}
 function errorMarkup(){return `<p class="sc-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p>`;}
 function routeReview(){const r=route();if(!r)return '';if(r==='pending')return '<div class="sc-readout"><h2>Drafting stays on hold</h2><p>Carry the open questions into an investigation plan. Revisit the earlier solution and evaluation decisions when evidence is available.</p></div>';const update=r!==state.currentRoute;return `<div class="sc-readout"><h2>Alignment with the earlier decision</h2><p>${update?`${esc(routeLabel(state.currentRoute))} → ${esc(routeLabel(r))}`:`${esc(routeLabel(r))} retained.`}</p><p>${r==='nonlearning'?'L2 becomes “Not applicable — no learning intervention,” with your rationale. Relevant L3 behavior and L4 results measures remain.':'The linked, confirmed L2 measure remains applicable to the learning component. Keep nonlearning dependencies visible where relevant.'}</p>${update?`<label class="sc-check cursor-interaction"><input type="checkbox" data-field="routeAcknowledged" ${state.routeAcknowledged?'checked':''}><span>Confirm this change to the performance-solution decision and linked evaluation plan.</span></label>`:''}</div>`;}
 function choiceView(){return `${top()}<h1>Choose the solution approach</h1><p class="sc-description">Use the Analysis and Six Boxes findings to decide what will help, before choosing the outputs.</p><div class="sc-row"><span class="sc-tag">AI recommendation for review</span><span class="sc-small">From Analysis brief V1 · Sample continuation</span></div><div class="sc-readout"><h2>Recommendation: gather targeted evidence first</h2><p>Routing errors are documented. It is not yet clear whether people need practice applying the criteria, easier access to the guide, or both.</p><p class="sc-small">Check performance with the guide available and observe its use. The existing procedure may already provide adequate support; a new aid should not be assumed necessary.</p></div><fieldset><legend>Which solution approach should we proceed with?</legend>${Object.entries(options).map(([key,o])=>`<label class="sc-choice cursor-interaction"><input type="radio" name="sc-choice" value="${key}" ${state.choice===key?'checked':''}><span>${o[0]}<small>${o[1]}</small></span></label>`).join('')}</fieldset>${hasAid()?`<label class="sc-label" for="sc-purpose">When will the performance aid be used?</label><select class="sc-field" id="sc-purpose" data-field="purpose"><option value="">Choose the intended use</option>${Object.entries(purposes).map(([key,text])=>`<option value="${key}" ${state.purpose===key?'selected':''}>${text}</option>`).join('')}</select>`:''}<label class="sc-label" for="sc-reason">Decision rationale and supporting Analysis evidence</label><textarea class="sc-field" id="sc-reason" data-field="reason" maxlength="900" rows="3">${esc(state.reason)}</textarea><p class="sc-footnote">Accept the recommendation or choose an alternative. Explain the fit and keep any assumptions visible.</p>${routeReview()}${errorMarkup()}<div class="sc-actions">${btn('Save and return later','pause')}${btn(state.choice==='investigate'?'Confirm investigation plan →':'Confirm solution and review deliverables →','confirm-choice',true)}</div>`;}
 function outputsView(){return `${top()}<h1>Review planned deliverables</h1><p class="sc-description">These outputs follow your confirmed solution choice.</p><div class="sc-row"><span class="sc-tag">${options[state.choice][0]} · Confirmed</span><span class="sc-small">${routeLabel(state.acceptedRoute)}</span></div>${hasCourse()?`<section class="sc-section"><h2>Detailed e-learning storyboard</h2><p>Screen-by-screen or block-by-block content, scripts, interactions, assessment tasks, feedback, and build instructions. Used to build the e-learning in Storyline, Rise, or both.</p><label class="sc-label" for="sc-storyTitle">Working title</label><input class="sc-field" id="sc-storyTitle" data-field="storyTitle" type="text" maxlength="180" value="${esc(state.storyTitle)}"></section>`:''}${hasAid()?`<section class="sc-section"><h2>Written job aid / performance-support draft</h2><p>The complete written content for a checklist, quick-reference guide, or decision aid. Reviewed for accuracy, then formatted for use.</p><p class="sc-footnote">Intended use: ${purposes[state.purpose]}</p><label class="sc-label" for="sc-aidTitle">Working title</label><input class="sc-field" id="sc-aidTitle" data-field="aidTitle" type="text" maxlength="180" value="${esc(state.aidTitle)}"></section>`:''}<label class="sc-label" for="sc-scope">What should these deliverables address?</label><textarea class="sc-field" id="sc-scope" data-field="scope" rows="3" maxlength="900">${esc(state.scope)}</textarea><label class="sc-label" for="sc-openItems">Evidence gaps and dependencies carried forward</label><textarea class="sc-field" id="sc-openItems" data-field="openItems" rows="3" maxlength="900">${esc(state.openItems)}</textarea><p class="sc-footnote">To change the output types, revisit the solution choice. Deliverable confirmation does not generate content.</p>${errorMarkup()}<div class="sc-actions">${btn('Revisit solution choice','choice')}${btn('Confirm deliverables and review next step →','confirm-outputs',true)}</div>`;}
 function summaryView(){const learning=state.acceptedRoute!=='nonlearning';return `${top()}<span class="sc-tag">Solution and deliverables confirmed</span><h1 style="margin-top:18px">Ready for the next Design step</h1><dl class="sc-summary"><dt>Solution</dt><dd>${options[state.choice][0]}</dd><dt>Response route</dt><dd>${routeLabel(state.acceptedRoute)}</dd><dt>Rationale</dt><dd>${esc(state.reason)}</dd><dt>Deliverables</dt><dd>${hasCourse()?esc(state.storyTitle)+' · Detailed e-learning storyboard':''}${hasCourse()&&hasAid()?'\n\n':''}${hasAid()?esc(state.aidTitle)+' · Written job aid / performance-support draft':''}</dd><dt>Scope</dt><dd>${esc(state.scope)}</dd><dt>L2 evaluation</dt><dd>${learning?'Linked confirmed measure retained for learning components.':'Not applicable — no learning intervention. Decision rationale retained; relevant L3/L4 measures remain.'}</dd><dt>Open items</dt><dd>${esc(state.openItems)}</dd></dl><div class="sc-readout"><h2>${hasCourse()?'Next: e-learning structure':learning?'Next: learning and support requirements':'Next: task and performance-support requirements'}</h2><p>${hasCourse()?'Choose microlearning, a course, or a mix; review the initial outline; then choose Storyline, Rise, or both. Learning objectives and assessments follow in Design.':learning?'Define learning objectives and suitable learning evidence, then map the aid’s content and support to the learning needs. No course format or authoring-tool selection is required.':'Define the work task, decision points, information needed, and support format. Continue to source/content mapping and the complete written aid. Course objectives and learning assessments are omitted.'}</p></div><div class="sc-actions">${btn('Revisit solution choice','choice')}${btn('Edit deliverable details','outputs')}</div><p class="sc-footnote">This preview ends at the handoff to the next Design screen.</p>`;}
 function investigation(){return `${top()}<h1>Investigate before choosing the solution</h1><p class="sc-description">No storyboard or aid is commissioned yet.</p><div class="sc-readout"><h2>Decision rationale</h2><p>${esc(state.reason)}</p></div><h2>Questions carried forward</h2><ul class="sc-list"><li>Can representatives apply the criteria to realistic cases when the guide is available?</li><li>Can they find and use the current guide during work?</li><li>Are expectations and feedback consistent, and are other work conditions contributing?</li></ul><p class="sc-footnote">Keep the existing evaluation record and flag applicability for review. Do not replace a confirmed measure with an invented answer.</p><div class="sc-actions">${btn('Save and return later','pause')}${btn('Revisit solution choice','choice',true)}</div>`;}
 function renderNav(){const items=[['choice','Solution approach',state.accepted?'Confirmed':'Needs review',true],...(state.choice==='investigate'&&state.accepted?[['investigation','Investigation plan','Drafting on hold',true]]:[['outputs','Derived deliverables',state.outputsConfirmed?'Confirmed':'Needs review',state.accepted],['summary','Next Design step','Based on confirmed choices',state.accepted&&state.outputsConfirmed]])];nav.innerHTML=`<h2>Design</h2><ol>${items.map(([key,title,status,enabled])=>`<li>${enabled?`<button type="button" class="cursor-interaction" data-action="${key}" ${state.view===key?'aria-current="location"':''}>${title}<small>${status}</small></button>`:`<div class="sc-locked">${title}<small>After the preceding decision</small></div>`}</li>`).join('')}</ol><p class="sc-nav-note">Six Boxes decides what influences performance. Solution choice decides the approach. Deliverables follow that choice.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('sc-expanded',state.panel!==null);if(!state.panel)return;panel.innerHTML=`<div class="sc-panel-head"><h2>${state.panel==='evidence'?'Analysis evidence':'Decision guidance'}</h2>${btn('Close','close-panel')}</div>${state.panel==='evidence'?'<p class="sc-small">Illustrative Analysis brief V1; sample documents only.</p><h3>Observed gap</h3><p>Some routine complaints are escalated unnecessarily; some cases requiring escalation are missed.</p><h3>Sample supervisor notes</h3><p>Routing observations document errors. They do not establish a knowledge or skill gap.</p><h3>Sample escalation procedure</h3><p>Criteria are documented. Guide access and usability at the point of work remain unconfirmed.</p><h3>Audience and context</h3><p>Representatives know complaint logging. Familiarity with criteria varies. Work occurs on desktop browsers.</p><h3>Evaluation</h3><p>L2: apply the criteria to scenarios and explain the routing. L3: appropriate routing and guide use. L4: avoidable escalation rate.</p><h3>Constraints</h3><p>Subject-matter expert review: 30 minutes weekly, two business days turnaround.</p>':'<h3>E-learning</h3><p>Consider it when people need to develop knowledge, decisions, or skills through explanation, practice, and feedback.</p><h3>Performance aid</h3><p>Consider it when accessible information or decision support helps during the task. Check whether an existing resource already meets the need.</p><h3>Both</h3><p>Consider both when people need practice and continuing support at work. State what each contributes.</p><h3>Use the evidence</h3><p>Weigh task demands, errors, prior knowledge, workflow, access, risk, and constraints. Show evidence gaps instead of an invented confidence score.</p><h3>Keep the route consistent</h3><p>A performance aid can support learning, work performance, or both. Review the response route and L2 applicability when the purpose changes.</p>'}`;}
 function render(){renderNav();main.innerHTML=state.view==='choice'?choiceView():state.view==='outputs'?outputsView():state.view==='summary'?summaryView():state.view==='investigation'?investigation():`<h1>Your Design decision is paused</h1><p class="sc-description">Resume the same decision and review state.</p>${btn('Resume review','resume',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidateChoice(){state.accepted=false;state.outputsConfirmed=false;state.routeAcknowledged=false;}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const f=e.target.dataset.field;if(!['reason','storyTitle','aidTitle','scope','openItems'].includes(f))return;state[f]=e.target.value;if(f==='reason'){invalidateChoice();const check=main.querySelector('[data-field="routeAcknowledged"]');if(check)check.checked=false;}else state.outputsConfirmed=false;renderNav();schedule();});
 root.addEventListener('change',e=>{const t=e.target;if(t.name==='sc-choice'){state.choice=t.value;if(state.choice==='investigate'&&!state.reason.trim())state.reason='Routing errors are documented, but the skill-gap hypothesis and guide access/usability are unconfirmed. Check case decisions with the guide available and observe guide use before finalizing the approach.';invalidateChoice();error='';render();save();main.querySelector(`input[name="sc-choice"][value="${state.choice}"]`)?.focus();return;}if(t.dataset.field==='purpose'){state.purpose=t.value;invalidateChoice();error='';render();save();main.querySelector('[data-field="purpose"]')?.focus();return;}if(t.dataset.field==='routeAcknowledged'){state.routeAcknowledged=t.checked;save();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}const a=b.dataset.action;if(!a)return;error='';let errorTarget='';if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='confirm-choice'){if(!state.choice){error='Choose a solution approach.';errorTarget='input[name="sc-choice"]';}else if(hasAid()&&!state.purpose){error='Choose when the performance aid will be used.';errorTarget='[data-field="purpose"]';}else if(!state.reason.trim()){error='Add the decision rationale and supporting evidence.';errorTarget='[data-field="reason"]';}else if(route()!=='pending'&&route()!==state.currentRoute&&!state.routeAcknowledged){error='Confirm the change to the earlier response decision and linked evaluation plan.';errorTarget='[data-field="routeAcknowledged"]';}else{state.accepted=true;state.acceptedRoute=route();if(route()!=='pending')state.currentRoute=route();state.view=state.choice==='investigate'?'investigation':'outputs';}}
 else if(a==='confirm-outputs'){if(hasCourse()&&!state.storyTitle.trim()){error='Add a working title for the storyboard.';errorTarget='[data-field="storyTitle"]';}else if(hasAid()&&!state.aidTitle.trim()){error='Add a working title for the job aid / performance-support draft.';errorTarget='[data-field="aidTitle"]';}else if(!state.scope.trim()){error='Describe the scope of the deliverables.';errorTarget='[data-field="scope"]';}else{state.outputsConfirmed=true;state.view='summary';}}
 else if(a==='pause'){state.resume=state.view;state.view='paused';state.panel=null;}else if(a==='resume'){state.view=state.resume;}else if(['choice','outputs','summary','investigation'].includes(a)){state.view=a;}
 render();save();if(error){main.querySelector(errorTarget)?.focus();announce(error);}else{focusFirst();announce(state.view==='outputs'?'Solution confirmed. Deliverables follow the selected approach.':state.view==='summary'?'Deliverables confirmed for the next Design step.':'Review opened.');}});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
