<div id="aipid-plan-wireframe" aria-label="Detailed Design plan review wireframe">
 <header class="dp-chrome"><span class="dp-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="dp-small dp-demo">Wireframe · Sample data</span></header>
 <div class="dp-project"><div><span class="dp-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="dp-shell"><nav class="dp-nav" aria-label="Design plan sections"></nav><main class="dp-main" aria-label="Detailed Design plan workspace"></main><aside class="dp-panel" id="dp-context" aria-label="Contextual information" hidden></aside></div>
 <footer class="dp-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="dp-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-plan-wireframe{color-scheme:light dark;--dp-bg:light-dark(#f5f5f4,#171717);--dp-paper:light-dark(#fff,#222);--dp-ink:light-dark(#242424,#f2f2f0);--dp-soft:light-dark(#565656,#bdbdb9);--dp-line:light-dark(#d4d4d0,#50504c);--dp-inset:light-dark(#eeeee9,#30302d);--dp-button:light-dark(#30302d,#eeeeea);--dp-button-text:light-dark(#fff,#242424);background:var(--dp-bg);color:var(--dp-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-plan-wireframe *{box-sizing:border-box}
 #aipid-plan-wireframe [hidden]{display:none!important}
 #aipid-plan-wireframe p{margin:0;overflow-wrap:anywhere}
 #aipid-plan-wireframe .dp-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--dp-paper);border-bottom:1px solid var(--dp-line)}
 #aipid-plan-wireframe .dp-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-plan-wireframe .dp-brand svg{width:20px;height:20px}
 #aipid-plan-wireframe .dp-demo{margin-left:auto}
 #aipid-plan-wireframe .dp-small{font-size:12px;color:var(--dp-soft)}
 #aipid-plan-wireframe .dp-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--dp-paper);border-bottom:1px solid var(--dp-line)}
 #aipid-plan-wireframe .dp-project p{font-weight:500}
 #aipid-plan-wireframe .dp-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--dp-soft)}
 #aipid-plan-wireframe [aria-current="step"]{font-weight:500;color:var(--dp-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-plan-wireframe .dp-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-plan-wireframe .dp-shell.dp-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-plan-wireframe .dp-nav{padding:25px 14px;border-right:1px solid var(--dp-line);min-width:0}
 #aipid-plan-wireframe .dp-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-plan-wireframe .dp-nav ol{list-style:none;display:grid;gap:6px;margin:0;padding:0}
 #aipid-plan-wireframe .dp-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--dp-ink);padding:11px 10px;font:inherit;font-size:13px}
 #aipid-plan-wireframe .dp-nav button[aria-current="location"]{background:var(--dp-inset);border-color:var(--dp-line)}
 #aipid-plan-wireframe .dp-nav small{display:block;font-size:12px;color:var(--dp-soft);margin-top:4px}
 #aipid-plan-wireframe .dp-nav-note{font-size:12px;color:var(--dp-soft);margin:24px 10px 0}
 #aipid-plan-wireframe .dp-main{min-width:0;padding:28px;background:var(--dp-paper)}
 #aipid-plan-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-plan-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-plan-wireframe h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-plan-wireframe .dp-description{color:var(--dp-soft);margin-bottom:22px}
 #aipid-plan-wireframe .dp-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-plan-wireframe .dp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-plan-wireframe .dp-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--dp-line);border-radius:6px;background:var(--dp-paper);color:var(--dp-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-plan-wireframe .dp-primary{background:var(--dp-button);color:var(--dp-button-text);border-color:var(--dp-button)}
 #aipid-plan-wireframe .dp-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--dp-inset);border-radius:4px}
 #aipid-plan-wireframe .dp-readout{background:var(--dp-inset);border-radius:6px;padding:17px;margin:20px 0}
 #aipid-plan-wireframe .dp-readout p+p{margin-top:12px}
 #aipid-plan-wireframe .dp-sections{display:grid;gap:10px;margin-top:22px}
 #aipid-plan-wireframe .dp-section{border:1px solid var(--dp-line);border-radius:6px;min-width:0}
 #aipid-plan-wireframe .dp-heading{margin:0;font-size:15px}
 #aipid-plan-wireframe .dp-heading button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;text-align:left;border:0;background:transparent;color:var(--dp-ink);font:500 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px 18px}
 #aipid-plan-wireframe .dp-section-body{padding:0 18px 18px}
 #aipid-plan-wireframe .dp-section-body p{white-space:pre-line;margin-bottom:14px}
 #aipid-plan-wireframe .dp-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-plan-wireframe .dp-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--dp-line);border-radius:5px;background:var(--dp-paper);color:var(--dp-ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-plan-wireframe textarea{display:block;resize:vertical}
 #aipid-plan-wireframe .dp-footnote{font-size:12px;color:var(--dp-soft);margin-top:13px}
 #aipid-plan-wireframe .dp-list{padding-left:22px;margin:12px 0}
 #aipid-plan-wireframe .dp-list li+li{margin-top:10px}
 #aipid-plan-wireframe .dp-check{display:flex;align-items:flex-start;gap:10px;padding:12px 0;min-height:44px}
 #aipid-plan-wireframe input[type="checkbox"]{width:18px;height:18px;margin:3px 0 0;flex-shrink:0;accent-color:var(--dp-button)}
 #aipid-plan-wireframe .dp-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--dp-line)}
 #aipid-plan-wireframe .dp-panel{padding:25px 19px;min-width:0;border-left:1px solid var(--dp-line)}
 #aipid-plan-wireframe .dp-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
 #aipid-plan-wireframe .dp-panel-head h2{margin:0}
 #aipid-plan-wireframe .dp-panel p{font-size:13px;margin:12px 0}
 #aipid-plan-wireframe .dp-panel h3{margin-top:20px}
 #aipid-plan-wireframe .dp-error{font-weight:500;margin-top:16px}
 #aipid-plan-wireframe .dp-footer{font-size:12px;color:var(--dp-soft);padding:15px 28px;border-top:1px solid var(--dp-line)}
 #aipid-plan-wireframe .dp-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-plan-wireframe .dp-shell.dp-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-plan-wireframe .dp-expanded .dp-panel{grid-column:2;border-left:0;border-top:1px solid var(--dp-line)}#aipid-plan-wireframe .dp-expanded .dp-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-plan-wireframe .dp-shell,#aipid-plan-wireframe .dp-shell.dp-expanded{grid-template-columns:minmax(0,1fr)}#aipid-plan-wireframe .dp-expanded .dp-nav{grid-row:auto}#aipid-plan-wireframe .dp-expanded .dp-panel{grid-column:1}#aipid-plan-wireframe .dp-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--dp-line)}#aipid-plan-wireframe .dp-main{padding:24px 18px}#aipid-plan-wireframe .dp-project,#aipid-plan-wireframe .dp-footer{padding-left:18px;padding-right:18px}#aipid-plan-wireframe .dp-chrome{padding-left:18px;padding-right:100px}#aipid-plan-wireframe .dp-demo{margin-left:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-plan-wireframe'),main=root.querySelector('.dp-main'),nav=root.querySelector('.dp-nav'),panel=root.querySelector('.dp-panel'),shell=root.querySelector('.dp-shell');
 const sections=[
  {title:'Performance-solution decision',field:'Solution rationale',record:'Solution decision',value:'Learning response for applying and explaining routing criteria, with a written aid used for learning. The skill-gap hypothesis and guide access still need verification.'},
  {title:'Solution structure',field:'Deliverable scope',record:'Solution scope',value:'Complete written job aid / performance-support draft for the learning session. Planned sections: information to collect, complaint categories, routing guidance, and learning activities. No e-learning course or authoring-tool selection applies to this sample branch.'},
  {title:'Main and enabling objectives',field:'LO-1 objective statement',record:'LO-1',value:'Given complaint cases and the approved guide, select the appropriate response and routing path, and explain the decision using the applicable criteria. All critical routing decisions must be correct.'},
  {title:'Assessment plan',field:'Assessment 1 expected performance / rubric',record:'Assessment A-1',value:'Identify the relevant detail, classify the complaint, choose the route, and explain the applicable criterion. The sample rubric assigns one point to each element; all four are required for this sample case.'},
  {title:'Learning sequence',field:'Sequence review note',record:'Sequence plan',value:'Prepare relevant details → compare categories → Practice 1 → worked routing decision → resolve routing-practice gap → Assessment 1 → transfer discussion. The new practice need remains a planning placeholder.'},
  {title:'Content and source map',field:'Source/coverage issue',record:'Content map issue',value:'Required information is missing; categories and routing guidance are partially supported by fictional exercise rules only. Obtain the applicable approved procedure and verify all factual claims and assessment answers.'},
  {title:'Evaluation alignment',field:'Evaluation ownership/timing note',record:'Linked evaluation plan',value:'L3 behavior: appropriate routing and use of the guide. L4 results: avoidable escalation rate. Baselines, targets, ownership, and timing need confirmation. L2 remains the linked measure; this note does not redefine it.'},
  {title:'Open issues and dependencies',field:'Additional open-issue note',record:'Open-issue register',value:'Confirm guide access, workflow fit, review ownership, case coverage, and the distinct routing-practice task. Retain missing information and source-verification requirements in any draft.'}
 ];
 const impacts={0:[1,2,3,4,5,6],1:[2,3,4,5],2:[3,4,5,6],3:[4,5],4:[5],5:[3,4],6:[2,3],7:[]};
 const state={view:'plan',open:0,panel:null,values:sections.map(x=>x.value),notes:sections.map(()=>''),reviewed:[],needsUpdate:[],drafts:{},edit:0,revision:1,lastChange:null,shareCreated:false,sampleMode:'structure',sampleAcknowledged:false,snapshot:null,handoffNeedsUpdate:false,prefs:{guidance:'Adjustable guidance',contribution:'Propose a starting draft',detail:'Detailed',resources:'On request'}};
 let timer,error='';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(t,a,primary=false)=>`<button type="button" class="dp-button ${primary?'dp-primary ':''}cursor-interaction" data-action="${a}">${t}</button>`;
 const status=i=>state.needsUpdate.includes(i)?'Needs update':state.reviewed.includes(i)?'Reviewed':'Needs review';
 const draftKeys=()=>Object.keys(state.drafts).filter(k=>String(Number(k))===k&&Number(k)>=0&&Number(k)<8);
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Detailed Design plan review wireframe',view:state.view,revision:state.revision,reviewedSections:state.reviewed.map(i=>sections[i].title),needsUpdate:state.needsUpdate.map(i=>sections[i].title),unappliedDrafts:draftKeys().length,sampleMode:state.sampleMode,baselineSelected:!!state.snapshot,handoffNeedsUpdate:state.handoffNeedsUpdate},privateContent:{kind:'design-plan-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='design-plan-v1')return;if(['plan','edit','share','readiness','handoff','paused'].includes(p.view))state.view=p.view;if(p.open===null||Number.isInteger(p.open)&&p.open>=0&&p.open<8)state.open=p.open;if([null,'sources','guidance','preferences'].includes(p.panel))state.panel=p.panel;for(const k of ['values','notes'])if(Array.isArray(p[k]))sections.forEach((x,i)=>{if(typeof p[k][i]==='string')state[k][i]=p[k][i].slice(0,k==='values'?350:200);});for(const k of ['reviewed','needsUpdate'])if(Array.isArray(p[k]))state[k]=[...new Set(p[k].filter(i=>Number.isInteger(i)&&i>=0&&i<8))];if(p.drafts&&typeof p.drafts==='object')for(let i=0;i<8;i++)if(typeof p.drafts[i]==='string')state.drafts[i]=p.drafts[i].slice(0,350);if(Number.isInteger(p.edit)&&p.edit>=0&&p.edit<8)state.edit=p.edit;if(Number.isInteger(p.revision)&&p.revision>0)state.revision=p.revision;if(p.lastChange&&Number.isInteger(p.lastChange.index)&&p.lastChange.index>=0&&p.lastChange.index<8&&typeof p.lastChange.before==='string')state.lastChange={index:p.lastChange.index,before:p.lastChange.before.slice(0,350)};state.shareCreated=p.shareCreated===true;if(['structure','factual'].includes(p.sampleMode))state.sampleMode=p.sampleMode;state.sampleAcknowledged=p.sampleAcknowledged===true;if(p.snapshot&&Number.isInteger(p.snapshot.revision)&&Array.isArray(p.snapshot.values)&&p.snapshot.values.length===8)state.snapshot={revision:p.snapshot.revision,values:p.snapshot.values.map(s=>typeof s==='string'?s.slice(0,350):''),notes:Array.isArray(p.snapshot.notes)?p.snapshot.notes.slice(0,8).map(s=>typeof s==='string'?s.slice(0,200):''):[],mode:'structure'};state.handoffNeedsUpdate=p.handoffNeedsUpdate===true;if(p.prefs&&typeof p.prefs==='object')for(const k of Object.keys(state.prefs))if(typeof p.prefs[k]==='string')state.prefs[k]=p.prefs[k].slice(0,60);if(state.view==='handoff'&&!state.snapshot)state.view='readiness';}
 function announce(t){root.querySelector('.dp-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function top(){return `<div class="dp-top"><span class="dp-small" data-save role="status">Preview · Draft</span><div class="dp-row">${['sources','guidance','preferences'].map(p=>`<button type="button" class="dp-button cursor-interaction" data-panel="${p}" aria-controls="dp-context" aria-expanded="${state.panel===p}">${p==='sources'?'Sources':p==='guidance'?'Guidance':'AI preferences (optional)'}</button>`).join('')}</div></div>`;}
 function extra(i){if(i===2)return '<p>Enabling objectives: identify relevant complaint details (Understand); classify the complaint (Understand); apply routing criteria (Apply). Conditions and criteria remain linked to LO-1 and L2-1.</p>';if(i===3)return `<p>Assessment 1: identify details, classify, choose the route, and explain the criterion. Practice 1: recognize a routine order-status question. The sample rules and answers remain fictional.</p><p class="dp-small">Linked main objective: ${esc(state.values[2])}</p>`;if(i===5)return '<p>Project source mode: provided material only. The fictional exercise guide and sample supervisor notes are not approved organizational evidence. Source questions apply project-wide.</p>';if(i===6)return '<p>Linked L2-1: scenario-based decisions with the guide; critical decisions correct and explanations linked to the applicable criteria. Evaluation execution remains outside MVP scope.</p>';if(i===7)return `<p>Source/coverage dependency: ${esc(state.values[5])}</p>`;return '';}
 function sectionMarkup(s,i){return `<section class="dp-section"><h2 class="dp-heading"><button type="button" class="cursor-interaction" data-toggle="${i}" aria-expanded="${state.open===i}" aria-controls="dp-section-${i}"><span>${i+1}. ${s.title}</span><span class="dp-small">${status(i)}${Object.hasOwn(state.drafts,i)?' · Edit draft saved':''}</span></button></h2><div class="dp-section-body" id="dp-section-${i}" ${state.open===i?'':'hidden'}><p class="dp-small">Linked record: ${s.record} · Sample baseline</p><p>${esc(state.values[i])}</p>${extra(i)}<label class="dp-label" for="dp-note-${i}">Review note, if needed</label><textarea class="dp-field" id="dp-note-${i}" data-note="${i}" maxlength="200" rows="2">${esc(state.notes[i])}</textarea><div class="dp-row" style="margin-top:16px"><button type="button" class="dp-button cursor-interaction" data-edit="${i}">Review / edit linked record</button><button type="button" class="dp-button cursor-interaction" data-review="${i}">${state.reviewed.includes(i)&&!state.needsUpdate.includes(i)?'Mark needs review':'Mark reviewed'}</button></div><p class="dp-footnote">Saved notes, section review, and source verification are separate. Reviewing this section does not clear factual gaps.</p></div></section>`;}
 function planView(){return `${top()}<h1>Review the detailed Design plan</h1><p class="dp-description">Review the linked decisions together before choosing a Development sample.</p><div class="dp-row"><span class="dp-tag">Draft · Revision ${state.revision}</span><span class="dp-small">Written learning-aid branch · Illustrative content</span></div>${state.snapshot?`<div class="dp-readout"><p>Sample baseline preserved: Design revision ${state.snapshot.revision}.${state.handoffNeedsUpdate?' The current plan has changed; the existing baseline is not overwritten.':''}</p></div>`:''}<div class="dp-sections">${sections.map(sectionMarkup).join('')}</div><div class="dp-actions">${btn('Save and return later','pause')}<div class="dp-row">${btn('Share for comments','share')}${btn('Generate Development sample','readiness',true)}</div></div><p class="dp-footnote">Optional peer comments and AI-preference reflection are not progression requirements.</p>`;}
 function editView(){const i=state.edit;return `${top()}<h1>Review linked record</h1><p class="dp-description">${sections[i].record}. Apply an intentional record change or keep the edit as a saved draft.</p><label class="dp-label" for="dp-edit">${sections[i].field}</label><textarea class="dp-field" id="dp-edit" data-edit-draft maxlength="350" rows="6">${esc(Object.hasOwn(state.drafts,i)?state.drafts[i]:state.values[i])}</textarea><p class="dp-footnote">Typing saves this edit draft. Applying it updates the linked record in this preview and flags affected sections for review; their content is preserved.</p><div class="dp-readout"><h2>Affected review</h2><p>${impacts[i].length?impacts[i].map(j=>sections[j].title).join(', '):'The edited record and its open-issue note.'}</p><p class="dp-small">This does not verify the source, resolve evidence gaps, or silently redefine the linked L2 measure.</p></div>${error?`<p class="dp-error" role="alert">${esc(error)}</p>`:''}<div class="dp-actions">${btn('Keep draft and return','plan')}<div class="dp-row">${btn('Discard this edit draft','discard')}${btn('Apply linked record change','apply',true)}</div></div>${state.lastChange?`<div class="dp-row" style="margin-top:16px">${btn('Undo last applied record change','undo')}</div>`:''}`;}
 function shareView(){return `${top()}<h1>Share for comments</h1><p class="dp-description">Share a Design version for guest review without requiring a reviewer account.</p><div class="dp-readout"><p>Design revision ${state.revision}. Comments attach to specific sections and linked objectives, assessments, and content records.</p><p class="dp-small">Preview only. No project is published and no invitations are sent.</p></div>${state.shareCreated?'<label class="dp-label" for="dp-share-link">Example share link — inactive</label><input class="dp-field" id="dp-share-link" type="text" readonly value="https://review.example/design-draft"><p class="dp-footnote">Anyone with an active review link could review its shared version. This example link is inactive.</p>':btn('Create share link (preview)','create-link',true)}<div class="dp-actions">${btn('Back to Design plan','plan')}</div>`;}
 function readinessView(){const drafts=draftKeys();return `${top()}<h1>Review the Development sample scope</h1><p class="dp-description">Choose what can be usefully drafted from Design revision ${state.revision}.</p><div class="dp-readout"><h2>Present in this Design draft</h2><p>Learning-aid deliverable, main/enabling objective hierarchy, identified L2 measure, assessment definitions, content/source map, and proposed sequence.</p><p class="dp-small">${state.needsUpdate.length} section(s) need update; ${8-state.reviewed.length} section(s) are not marked reviewed. These flags remain visible.</p></div><h2>Essential gaps for factual drafting</h2><ul class="dp-list"><li>The actual approved procedure and required information are missing.</li><li>The sample assessment answer follows fictional exercise rules and is not an organizationally verified correct answer.</li><li>The distinct routing-practice task and broader case coverage need review.</li></ul><p class="dp-footnote">L3/L4 baselines, targets, timing, and final presentation assets can remain explicit open items where they do not prevent a useful sample.</p>${drafts.length?`<div class="dp-readout"><h2>Unapplied record edits</h2><p>Apply or explicitly discard the saved edit drafts before selecting the sample baseline.</p><div class="dp-row">${drafts.map(k=>`<button type="button" class="dp-button cursor-interaction" data-edit="${k}">${sections[Number(k)].record}</button>`).join('')}</div></div>`:''}<label class="dp-label" for="dp-sample-mode">What should this sample contain?</label><select class="dp-field" id="dp-sample-mode" data-sample-mode><option value="structure" ${state.sampleMode==='structure'?'selected':''}>Full outline + representative section with factual placeholders</option><option value="factual" ${state.sampleMode==='factual'?'selected':''}>Representative section populated with factual guidance</option></select><div class="dp-readout"><p>${state.sampleMode==='structure'?'Proposed limited sample: outline all aid sections and populate the layout of the information-checklist section. Missing procedure details and answers remain explicit placeholders.':'Factual guidance cannot be populated from the current source material. Resolve the source and answer-verification gaps first.'}</p><p class="dp-small">The selected Design version is preserved. This preview performs no AI call.</p></div><label class="dp-check cursor-interaction"><input type="checkbox" data-acknowledge ${state.sampleAcknowledged?'checked':''}><span>I confirm the sample scope and the unresolved issues that must remain visible.</span></label>${error?`<p class="dp-error" role="alert">${esc(error)}</p>`:''}<div class="dp-actions">${btn('Return to Design plan','plan')}${btn('Generate Development sample','generate',true)}</div>`;}
 function handoffView(){return `${top()}<span class="dp-tag">Baseline selected · Preview</span><h1 style="margin-top:18px">Development sample starts from Design revision ${state.snapshot.revision}</h1><div class="dp-readout"><h2>Preserved objective</h2><p>${esc(state.snapshot.values[2])}</p><h2 style="margin-top:20px">Sample scope</h2><p>Full written-aid outline plus the representative information-checklist section, with missing factual content left as placeholders.</p><p class="dp-small">The source/assessment gaps remain open. No complete factual draft, verified answer, or final handoff readiness is claimed.</p></div><ol class="dp-list"><li>Information to collect — representative section, required details pending.</li><li>Complaint categories — outline and source placeholders.</li><li>Routing guidance — outline and source placeholders.</li><li>Practice and assessment — link existing records; retain the unresolved practice gap.</li></ol><p class="dp-footnote">This preview stops at the versioned handoff. The next screen to review is the Development sample workspace.</p><div class="dp-actions">${btn('Back to Design plan','plan')}</div>`;}
 function renderNav(){nav.innerHTML=`<h2>Design plan</h2><ol>${sections.map((s,i)=>`<li><button type="button" class="cursor-interaction" data-open="${i}" ${state.view==='plan'&&state.open===i?'aria-current="location"':''}>${s.title}<small>${status(i)}</small></button></li>`).join('')}</ol><p class="dp-nav-note">An edit flags affected records. Saved work and the baseline used for a Development sample are preserved separately.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('dp-expanded',state.panel!==null);if(!state.panel)return;let content='',title='';if(state.panel==='sources'){title='Sources and gaps';content='<h3>Provided material only</h3><p>The sample exercise guide contains two fictional routing rules. The sample supervisor notes describe errors, without establishing their cause.</p><h3>Missing authority</h3><p>No actual approved procedure or verified organizational answer is supplied. Those gaps cannot be cleared by marking a section reviewed.</p><h3>Limited sample</h3><p>A structural sample may use visible placeholders where useful. Factual instructions require approved source support.</p>';}else if(state.panel==='preferences'){title='AI preferences';const options={guidance:['Adjustable guidance','Less guidance','More guidance'],contribution:['Propose a starting draft','Offer suggestions only','Provide more drafting help'],detail:['Detailed','Concise'],resources:['On request','Show more resources']};content=Object.entries(options).map(([k,values])=>`<label class="dp-label" for="dp-pref-${k}">${{guidance:'Guidance depth',contribution:'AI contribution',detail:'Output detail',resources:'Resources'}[k]}</label><select class="dp-field" id="dp-pref-${k}" data-pref="${k}">${values.map(v=>`<option ${state.prefs[k]===v?'selected':''}>${v}</option>`).join('')}</select>`).join('')+'<p class="dp-footnote">Optional. Apply to future generation; current reviewed records are not rewritten.</p>';}else{title='Review guidance';content='<h3>Review the existing decisions</h3><p>The plan assembles linked records. It should not introduce new unreviewed objectives, tasks, or facts.</p><h3>Apply edits deliberately</h3><p>Edit drafts are saved separately from accepted record changes. Applying a change flags dependent sections instead of overwriting them.</p><h3>Keep review and verification distinct</h3><p>Section review does not establish source accuracy. Essential gaps constrain what the Development sample may contain.</p><h3>Preserve the baseline</h3><p>The explicit generation action selects a Design version. Later changes flag the existing handoff for review.</p>';}panel.innerHTML=`<div class="dp-panel-head"><h2>${title}</h2>${btn('Close','close-panel')}</div>${content}`;}
 function render(){renderNav();main.innerHTML=state.view==='plan'?planView():state.view==='edit'?editView():state.view==='share'?shareView():state.view==='readiness'?readinessView():state.view==='handoff'?handoffView():`<h1>Your Design review is paused</h1><p class="dp-description">Resume the same plan, record drafts, and review state.</p>${btn('Resume Design review','plan',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){if(error){const field=state.view==='edit'?main.querySelector('[data-edit-draft]'):draftKeys().length?main.querySelector('[data-edit]'):state.sampleMode==='factual'?main.querySelector('[data-sample-mode]'):main.querySelector('[data-acknowledge]');if(field){field.focus();return;}}main.querySelector('button')?.focus();}
 function flagChange(i){state.reviewed=state.reviewed.filter(j=>j!==i&&!impacts[i].includes(j));state.needsUpdate=[...new Set([...state.needsUpdate.filter(j=>j!==i),...impacts[i]])];state.revision++;state.sampleAcknowledged=false;if(state.snapshot)state.handoffNeedsUpdate=true;}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const t=e.target;if(t.hasAttribute('data-edit-draft'))state.drafts[state.edit]=t.value;else if(t.dataset.note!==undefined){state.notes[Number(t.dataset.note)]=t.value;state.sampleAcknowledged=false;if(state.snapshot)state.handoffNeedsUpdate=true;}else return;schedule();});
 root.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-sample-mode')){state.sampleMode=t.value;state.sampleAcknowledged=false;error='';render();save();main.querySelector('[data-sample-mode]')?.focus();}else if(t.hasAttribute('data-acknowledge')){state.sampleAcknowledged=t.checked;save();}else if(t.dataset.pref){state.prefs[t.dataset.pref]=t.value;save();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.open!==undefined||b.dataset.toggle!==undefined){const i=Number(b.dataset.open??b.dataset.toggle);state.open=b.dataset.toggle!==undefined&&state.open===i?null:i;state.view='plan';error='';render();save();main.querySelector(`[data-toggle="${i}"]`)?.focus();return;}if(b.dataset.edit!==undefined){state.edit=Number(b.dataset.edit);state.view='edit';error='';render();save();main.querySelector('[data-edit-draft]')?.focus();return;}if(b.dataset.review!==undefined){const i=Number(b.dataset.review);if(state.reviewed.includes(i)&&!state.needsUpdate.includes(i))state.reviewed=state.reviewed.filter(j=>j!==i);else{state.reviewed=[...new Set([...state.reviewed,i])];state.needsUpdate=state.needsUpdate.filter(j=>j!==i);}render();save();main.querySelector(`[data-review="${i}"]`)?.focus();return;}const a=b.dataset.action;if(!a)return;error='';if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='apply'){const i=state.edit,value=Object.hasOwn(state.drafts,i)?state.drafts[i]:state.values[i];if(!value.trim())error='Enter the linked record content, or keep the prior record and record a gap separately.';else{state.lastChange={index:i,before:state.values[i]};state.values[i]=value;delete state.drafts[i];flagChange(i);state.open=i;state.view='plan';}}else if(a==='discard'){delete state.drafts[state.edit];state.open=state.edit;state.view='plan';}else if(a==='undo'&&state.lastChange){const {index,before}=state.lastChange;state.values[index]=before;state.lastChange=null;flagChange(index);state.open=index;state.view='plan';}else if(a==='create-link')state.shareCreated=true;else if(a==='generate'){if(draftKeys().length)error='Apply or explicitly discard the saved record edit drafts before selecting this baseline.';else if(state.sampleMode==='factual')error='Resolve the approved-source and answer-verification gaps before generating factual guidance.';else if(!state.sampleAcknowledged)error='Confirm the limited sample scope and the unresolved issues first.';else{state.snapshot={revision:state.revision,values:[...state.values],notes:[...state.notes],mode:'structure'};state.handoffNeedsUpdate=false;state.view='handoff';}}else if(a==='pause'){state.view='paused';state.panel=null;}else if(['plan','share','readiness'].includes(a))state.view=a;render();save();focusFirst();announce(error||'Design review updated.');});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
