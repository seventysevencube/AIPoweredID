<div id="aipid-development-review" aria-label="Development full-draft review wireframe">
 <header class="dr-chrome"><span class="dr-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="dr-small dr-demo">Wireframe · Sample data</span></header>
 <div class="dr-project"><div><span class="dr-small">Project example</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li>Design</li><li aria-current="step">Development</li></ol></div>
 <div class="dr-shell"><nav class="dr-nav" aria-label="Storyboard review outline"></nav><main class="dr-main" aria-label="Storyboard review workspace"></main><aside class="dr-panel" id="dr-context" aria-label="Contextual information" hidden></aside></div>
 <footer class="dr-footer">Illustrative preview · No live saving, sharing, export, or AI connection<p class="dr-live" role="status" aria-live="polite"></p></footer>
</div>
<style>
 #aipid-development-review{color-scheme:light dark;--dr-bg:light-dark(#f5f5f4,#171717);--dr-paper:light-dark(#fff,#222);--dr-ink:light-dark(#242424,#f2f2f0);--dr-soft:light-dark(#565656,#bdbdb9);--dr-line:light-dark(#d4d4d0,#50504c);--dr-inset:light-dark(#eeeee9,#30302d);--dr-button:light-dark(#30302d,#eeeeea);--dr-on:light-dark(#fff,#242424);background:var(--dr-bg);color:var(--dr-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-development-review *{box-sizing:border-box}#aipid-development-review [hidden]{display:none!important}#aipid-development-review p{margin:0;overflow-wrap:anywhere}#aipid-development-review b{font-weight:500}#aipid-development-review h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}#aipid-development-review h2{font-size:18px;font-weight:500;margin:0 0 14px}#aipid-development-review h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-development-review .dr-chrome{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:22px 112px 22px 28px;background:var(--dr-paper);border-bottom:1px solid var(--dr-line)}#aipid-development-review .dr-brand{display:flex;align-items:center;gap:10px;font-weight:500}#aipid-development-review .dr-brand svg{width:20px;height:20px}#aipid-development-review .dr-demo{margin-left:auto}#aipid-development-review .dr-small{font-size:12px;color:var(--dr-soft)}
 #aipid-development-review .dr-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--dr-paper);border-bottom:1px solid var(--dr-line)}#aipid-development-review .dr-project p{font-weight:500}#aipid-development-review .dr-project ol{list-style:none;display:flex;flex-wrap:wrap;gap:18px;padding:0;margin:0;font-size:13px;color:var(--dr-soft)}#aipid-development-review [aria-current="step"]{font-weight:500;color:var(--dr-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-development-review .dr-shell{display:grid;grid-template-columns:210px minmax(0,1fr)}#aipid-development-review .dr-shell.dr-expanded{grid-template-columns:210px minmax(0,1fr) 240px}#aipid-development-review .dr-nav{padding:25px 14px;border-right:1px solid var(--dr-line);min-width:0}#aipid-development-review .dr-nav h2{font-size:15px;margin:0 10px 16px}#aipid-development-review .dr-nav ol{list-style:none;display:grid;gap:6px;margin:0;padding:0}#aipid-development-review .dr-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--dr-ink);min-height:44px;padding:11px 10px;font:inherit;font-size:13px}#aipid-development-review .dr-nav button[aria-current="location"]{background:var(--dr-inset);border-color:var(--dr-line)}#aipid-development-review .dr-nav small{display:block;font-size:12px;color:var(--dr-soft);margin-top:4px}#aipid-development-review .dr-nav-note{margin:22px 10px 0;font-size:12px;color:var(--dr-soft)}
 #aipid-development-review .dr-main{min-width:0;background:var(--dr-paper);padding:28px}#aipid-development-review .dr-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}#aipid-development-review .dr-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#aipid-development-review .dr-button{max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--dr-line);border-radius:6px;background:var(--dr-paper);color:var(--dr-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}#aipid-development-review .dr-primary{background:var(--dr-button);border-color:var(--dr-button);color:var(--dr-on)}#aipid-development-review .dr-button:disabled{opacity:.55}#aipid-development-review .dr-description{color:var(--dr-soft);margin-bottom:20px}#aipid-development-review .dr-notice{padding:16px;background:var(--dr-inset);border-radius:6px;margin:20px 0}#aipid-development-review .dr-notice p+p{margin-top:10px}#aipid-development-review .dr-meta{font-size:12px;color:var(--dr-soft);margin:12px 0}#aipid-development-review .dr-field{margin:20px 0}#aipid-development-review .dr-label{display:block;font-weight:500;margin-bottom:7px}#aipid-development-review textarea,#aipid-development-review select{width:100%;min-height:44px;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:10px;border:1px solid var(--dr-line);border-radius:5px;background:var(--dr-paper);color:var(--dr-ink)}#aipid-development-review textarea{min-height:100px;resize:vertical}#aipid-development-review .dr-section-title{margin-top:28px;padding-top:22px;border-top:1px solid var(--dr-line)}#aipid-development-review .dr-actions{margin-top:24px}#aipid-development-review .dr-panel{min-width:0;padding:24px 18px;border-left:1px solid var(--dr-line);background:var(--dr-bg);font-size:13px}#aipid-development-review .dr-panel p+p{margin-top:14px}#aipid-development-review .dr-panel h3{margin-top:20px}#aipid-development-review .dr-panel ul{padding-left:20px}#aipid-development-review .dr-note-text{white-space:pre-wrap;overflow-wrap:anywhere}#aipid-development-review details{margin:16px 0;border-top:1px solid var(--dr-line);padding-top:12px}#aipid-development-review summary{min-height:44px;padding:10px 0;font-weight:500}#aipid-development-review details p{margin:12px 0}#aipid-development-review .dr-list{list-style:none;padding:0;margin:20px 0}#aipid-development-review .dr-list li{padding:16px 0;border-bottom:1px solid var(--dr-line)}#aipid-development-review .dr-list li p{margin-top:7px}#aipid-development-review .dr-check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:12px 0}#aipid-development-review input[type="checkbox"]{width:20px;height:20px;flex-shrink:0;margin-top:2px}#aipid-development-review .dr-footer{padding:17px 28px;border-top:1px solid var(--dr-line);font-size:12px;color:var(--dr-soft)}#aipid-development-review .dr-live{margin-top:8px}
 @media(max-width:960px){#aipid-development-review .dr-shell.dr-expanded{grid-template-columns:210px minmax(0,1fr)}#aipid-development-review .dr-panel{grid-column:2;border-left:0;border-top:1px solid var(--dr-line)}}
 @media(max-width:650px){#aipid-development-review .dr-shell,#aipid-development-review .dr-shell.dr-expanded{grid-template-columns:minmax(0,1fr)}#aipid-development-review .dr-nav{border-right:0;border-bottom:1px solid var(--dr-line)}#aipid-development-review .dr-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}#aipid-development-review .dr-panel{grid-column:1}#aipid-development-review .dr-main{padding:24px 18px}#aipid-development-review .dr-chrome{padding-left:18px}#aipid-development-review .dr-project{padding:17px 18px}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-development-review'),main=root.querySelector('.dr-main'),nav=root.querySelector('.dr-nav'),panel=root.querySelector('.dr-panel'),shell=root.querySelector('.dr-shell');
 const definitions=[
  {id:'SL-01',title:'Purpose and task',links:'LO-1 · Apply · L2-1',status:'Reviewed',text:'Use the guide to make a complaint-routing decision and explain which criteria support it.',build:'Present the task in text. Keep the guide available during the worked examples, practice, and assessment, subject to the confirmed Design requirements.',access:'Use a clear heading and descriptive navigation labels. All essential instructions are available as text.'},
  {id:'SL-02',title:'Check required information',links:'EO-1.1 · Understand · LO-1',status:'Needs review',text:'Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]\n[What to do when details are missing — approved source needed]',build:'Retain the accepted sample treatment: a text checklist on one screen. No additional states or layers proposed here. Confirm navigation requirements during tool feasibility review.',access:'No image is needed. Keep a logical reading and focus order. No narration proposed; all essential content remains on screen.',sample:true},
  {id:'SL-03',title:'Recognize the category',links:'EO-1.2 · Understand · LO-1',status:'Draft',text:'Compare the complaint details with the category definitions in the guide.\n\n[Approved category definitions and worked example needed]',build:'Present one worked example with the case detail, applicable category, and explanation. The explanation must use the same approved source as the category definition.',access:'Keep the case, answer, and explanation readable in a logical order. Any future visual needs a text equivalent.'},
  {id:'SL-04',title:'Practice identifying the category',links:'Practice 1 · EO-1.1 / EO-1.2 · Understand',status:'Needs review',text:null,build:'Keep the linked practice task and feedback intact. Proposed: learners write a response and compare it with the explanation. Confirm collection and facilitator arrangements; do not silently convert this into automatically scored multiple choice.',access:'Provide clear written instructions and an accessible response/feedback path. Do not rely on hover to reveal essential feedback.',record:'P-1'},
  {id:'SL-05',title:'Choose a route',links:'EO-1.3 · Apply · LO-1',status:'Needs update',text:'Use the guide to choose the response and routing path. Explain how the complaint meets the relevant criteria.\n\n[Current approved routing criteria and worked example needed]',build:'Use a worked decision example linked to the current routing guide. The previous source reference needs review. Do not overwrite the prior version or reuse an unverified answer.',access:'Use descriptive path labels and a readable text explanation. No branching interaction is assumed before feasibility review.'},
  {id:'SL-06',title:'Integrated assessment',links:'Assessment 1 · LO-1 · Apply · L2-1',status:'Draft',text:null,build:'Carry forward the reviewed written-response task and rubric. Facilitator review/collection is still to be confirmed. Verify the end-to-end evidence and completion process before writing final authoring instructions.',access:'Keep the response instructions, allowed guide access, feedback, and retry directions accessible. Preserve the required explanation, not just a selected route.',record:'A-1'},
  {id:'SL-07',title:'Transfer to work',links:'LO-1 · workplace support dependency',status:'Draft',text:'Use the approved guide when handling a complaint.\n\n[Approved guide access and help contact needed]',build:'Link to the approved guide and help route after their locations and access permissions are confirmed. This dependency does not add a new deliverable.',access:'Use descriptive link text; identify the destination and any change of context.'}
 ];
 const assessment={
  'P-1':{label:'Practice 1 — Recognize a routine order-status question',task:'Fictional exercise: A customer asks when an undamaged order will arrive. Identify the relevant details and classify the complaint using the exercise guide.',expected:'Routine order-status question; no damaged item is reported. Exercise rule 1 applies.',feedback:'Use the order-status category because the customer asks about delivery timing. Compare this with a damaged-item complaint before moving to routing practice.',scoring:'Formative practice — no numeric score.',rules:'Allow another attempt after viewing the explanation. Use a new example if the same misunderstanding continues.'},
  'A-1':{label:'Assessment 1 — Route a damaged-item complaint',task:'Fictional exercise: A customer reports that an item arrived damaged. Using the exercise guide, identify the relevant detail, classify the complaint, choose the response/routing path, and explain the rule that supports your decision.',expected:'Relevant detail: damaged item. Category: damaged-item complaint. Route: send to the resolution team. Explanation: exercise rule 2 applies to a reported damaged item.',feedback:'Correct: the damaged-item detail makes rule 2 applicable; route to the resolution team. If routed as a routine order-status question, revisit the complaint type. If the explanation is missing, cite the applicable rule and case detail.',scoring:'Four criteria: relevant detail, category, route, and explanation. One point each; all four required for success on this sample case.',rules:'Proposed: after feedback and guide review, use an equivalent case. Confirm permitted attempts and remediation with the learning owner.'}
 };
 const issues=[
  {id:'source',title:'Approved procedure details missing',detail:'Required complaint details, category definitions, routing rules, guide access, and help details need approved sources.',sections:['SL-02','SL-03','SL-05','SL-07'],action:'Resolve in content/source mapping'},
  {id:'answers',title:'Assessment and practice answers unverified',detail:'The linked tasks use fictional exercise rules. Confirm organizational answers, feedback, scoring, and collection arrangements in Design.',sections:['SL-04','SL-06'],action:'Review linked assessment records'},
  {id:'practice',title:'Routing practice is still undefined',detail:'The Design sequence includes a routing-practice gap. Do not reuse the scored assessment as practice without an explicit Design decision.',sections:['SL-05','SL-06'],action:'Return to assessment and sequence planning'},
  {id:'tool',title:'Tool and collection process need review',detail:'Confirm the written-response/facilitator process and tool-specific navigation and accessibility requirements.',sections:['SL-01','SL-02','SL-03','SL-04','SL-05','SL-06','SL-07'],action:'Review feasibility and build requirements'}
 ];
 const state={view:'section',active:'SL-02',panel:'',revision:2,records:definitions.map(d=>({id:d.id,text:d.text,build:d.build,access:d.access,status:d.status})),previous:null,requests:{},format:'PDF'};
 let timer,editing=false,exportSnapshot=null;
 const current=()=>state.records.find(x=>x.id===state.active),definition=()=>definitions.find(x=>x.id===state.active);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(label,action,primary=false)=>`<button type="button" class="dr-button cursor-interaction${primary?' dr-primary':''}" data-action="${action}">${label}</button>`;
 const countReviewed=()=>state.records.filter(x=>x.status==='Reviewed').length;
 function request(){return state.requests[state.active]||(state.requests[state.active]={scope:'section',text:'',saved:false});}
 function persist(){const payload={modelContent:{screen:'Development full-draft review wireframe',view:state.view,activeSection:state.active,revision:state.revision,sections:state.records.map(x=>({id:x.id,status:x.status})),essentialIssueIds:issues.map(x=>x.id),readyForHandoff:false,revisionRequestSectionIds:Object.keys(state.requests).filter(id=>state.requests[id].saved)},privateContent:{kind:'development-review-v1',...state}};if(new Blob([JSON.stringify(payload)]).size>15000)return;try{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(payload)).catch(()=>{});}catch{}}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='development-review-v1')return;if(definitions.some(x=>x.id===p.active))state.active=p.active;state.view=['section','summary','request'].includes(p.view)?p.view:'section';state.panel=['sources','history','design'].includes(p.panel)?p.panel:'';state.revision=Number.isInteger(p.revision)?Math.max(2,Math.min(p.revision,9999)):2;for(const x of state.records){const v=p.records?.find(r=>r.id===x.id);if(!v)continue;for(const f of ['text','build','access'])if(typeof x[f]==='string'&&typeof v[f]==='string')x[f]=v[f].slice(0,500);if(['Draft','Needs review','Reviewed','Needs update'].includes(v.status))x.status=v.status;}if(p.previous&&definitions.some(d=>d.id===p.previous.id)){const d=definitions.find(x=>x.id===p.previous.id),v=p.previous;state.previous={id:d.id,text:d.text===null?null:String(v.text||'').slice(0,500),build:String(v.build||'').slice(0,500),access:String(v.access||'').slice(0,500),status:['Draft','Needs review','Reviewed','Needs update'].includes(v.status)?v.status:'Needs review',revision:Number(v.revision)||2};}if(p.requests&&typeof p.requests==='object')for(const d of definitions){const q=p.requests[d.id];if(q)state.requests[d.id]={scope:q.scope==='design'?'design':'section',text:String(q.text||'').slice(0,300),saved:q.saved===true};}state.format=p.format==='PowerPoint'?'PowerPoint':'PDF';}
 function announce(text){root.querySelector('.dr-live').textContent=text;}
 function top(){return `<div class="dr-top"><span class="dr-small" data-save>Revision ${state.revision} · preview draft</span><div class="dr-row">${btn('Sources & links','sources')}${btn('Version history','history')}${btn('Review summary','summary')}</div></div>`;}
 function renderNav(){nav.innerHTML=`<h2>Storyline storyboard</h2><p class="dr-small" style="margin:0 10px 14px">Scene 1 · Review example</p><ol>${definitions.map((d,i)=>`<li><button type="button" class="cursor-interaction" data-open="${d.id}"${state.active===d.id&&state.view!=='summary'?' aria-current="location"':''}>${i+1}. ${esc(d.title)}<small>${esc(state.records[i].status)}${d.sample?' · sample':''}</small></button></li>`).join('')}</ol><p class="dr-nav-note">${countReviewed()} of ${definitions.length} sections reviewed.<br>Review completion does not resolve source or feasibility issues.</p>`;}
 function field(key,label){return `<div class="dr-field"><label class="dr-label" for="dr-${key}">${label}</label><textarea id="dr-${key}" data-field="${key}" maxlength="500" rows="4">${esc(current()[key])}</textarea></div>`;}
 function sectionView(){const r=current(),d=definition(),related=issues.filter(x=>x.sections.includes(r.id));return `${top()}<h1>${esc(d.title)}</h1><p class="dr-description">Review one section at a time. This is a structural draft-review example with unresolved facts; no full factual draft has been generated.</p><p class="dr-meta">${d.id} · ${esc(d.links)}<br><span data-status>${esc(r.status)}</span>${d.sample?' · accepted sample treatment retained':''}</p><div class="dr-notice"><h2>Open checks for this section</h2><ul>${related.map(x=>`<li>${esc(x.title)}</li>`).join('')}</ul><p class="dr-small">Marking a draft reviewed records your review of this version. These essential issues remain open and continue to block handoff.</p></div><h2 class="dr-section-title">Learner-facing content</h2>${d.record?assessmentView(d.record):field('text','Exact on-screen text / written script')}<h2 class="dr-section-title">Production specifications</h2>${field('build','Interaction and build instructions')}${field('access','Assets and accessibility requirements')}<p class="dr-small">Written specifications only. Generated media and native Storyline project files remain outside scope.</p><div class="dr-row dr-actions">${btn(r.status==='Reviewed'?'Mark needs review':'Mark reviewed with open issues','review',true)}${btn('Request changes','request')}${btn('Review next section','next')}</div><div class="dr-row dr-actions"><button type="button" class="dr-button cursor-interaction" data-action="undo"${state.previous?.id===r.id?'':' disabled'}>Undo latest edit</button></div><p class="dr-small" style="margin-top:14px">Edits are kept in this preview and clear the affected section’s review status. They do not trigger AI generation.</p>`;}
 function assessmentView(id){const a=assessment[id];return `<div class="dr-notice"><h3>${esc(a.label)}</h3><p>Linked Design record · ${id}. Fictional exercise only; organizational verification pending.</p><p class="dr-note-text">${esc(a.task)}</p></div><details><summary class="cursor-interaction">Expected response, feedback, and rules</summary><h3>Expected response</h3><p>${esc(a.expected)}</p><h3>Feedback</h3><p>${esc(a.feedback)}</p><h3>${id==='A-1'?'Scoring':'Purpose'}</h3><p>${esc(a.scoring)}</p><h3>Attempts and remediation</h3><p>${esc(a.rules)}</p></details>${btn('Review linked Design record','design')}<p class="dr-small" style="margin-top:10px">Changes to the task, answer, rubric, scoring, or retry rules require Design review. Build-note edits below do not change the linked record.</p>`;}
 function summaryView(){const remaining=state.records.filter(x=>x.status!=='Reviewed');return `${top()}<h1>Review the draft before handoff</h1><p class="dr-description">Storyline storyboard · revision ${state.revision}. Review completion and readiness are separate decisions.</p><h2>Section review</h2><p>${countReviewed()} of ${definitions.length} sections reviewed. ${remaining.length} still need attention.</p><ul class="dr-list">${remaining.map(r=>`<li><b>${esc(definitions.find(d=>d.id===r.id).title)}</b><p>${esc(r.status)}</p><div class="dr-actions">${btn('Open section','open-'+r.id)}</div></li>`).join('')||'<li>All current sections have been reviewed. Essential issue checks still apply.</li>'}</ul><h2>Essential issues blocking handoff</h2><ul class="dr-list">${issues.map(x=>`<li><b>${esc(x.title)}</b><p>${esc(x.detail)}</p><p class="dr-small">${esc(x.action)} · ${x.sections.join(', ')}</p></li>`).join('')}</ul><div class="dr-row">${btn('Review Design issues','design')}<button type="button" class="dr-button dr-primary" disabled aria-describedby="dr-ready-why">Mark ready for handoff</button></div><p id="dr-ready-why" class="dr-small" style="margin-top:12px">Unavailable while essential source, assessment, practice, or tool requirements remain unresolved. Acknowledging an issue does not resolve it.</p><div class="dr-notice"><h2>Draft exports remain available</h2><p>A draft PDF or editable PowerPoint can include incomplete work, clearly labeled with its version, review status, sources, and open issues. Exporting does not approve the draft or start an AI rewrite.</p></div>${btn('Prepare draft export','export',true)}<p class="dr-small" style="margin-top:16px">Final assets with agreed specifications and permitted L3/L4 planning unknowns can remain as nonblocking dependencies. The essential gaps in this example cannot.</p>`;}
 function requestView(){return `${top()}<h1>Request a targeted revision</h1><p class="dr-description">${esc(definition().title)} · ${state.active}. Preserve accepted work outside the requested scope.</p><div class="dr-field"><label class="dr-label" for="dr-scope">Revision scope</label><select id="dr-scope" data-request="scope"><option value="section"${request().scope==='section'?' selected':''}>This section’s wording / build notes</option><option value="design"${request().scope==='design'?' selected':''}>Linked Design decisions</option></select></div><div class="dr-field"><label class="dr-label" for="dr-request">What should change?</label><textarea id="dr-request" data-request="text" maxlength="300" rows="4">${esc(request().text)}</textarea></div><div class="dr-notice"><p>Objectives, assessment content/scoring, source authority, intervention scope, and tool allocation require review of the affected Design records. AI must not replace them silently.</p></div><div class="dr-row">${btn('Save revision request','save-request',true)}${btn('Back to section','section')}</div><p class="dr-small" style="margin-top:12px">Preview only: the request is held locally and is not sent to AI.</p>${request().saved?'<p class="dr-meta">Unsent request saved for this example. The draft has not been changed.</p>':''}`;}
 function exportView(){return `${top()}<h1>Prepare a draft export</h1><p class="dr-description">Export the current structured draft. No content rewrite is required.</p><div class="dr-field"><label class="dr-label" for="dr-format">Format</label><select id="dr-format" data-format><option${state.format==='PDF'?' selected':''}>PDF</option><option${state.format==='PowerPoint'?' selected':''}>PowerPoint</option></select></div><div class="dr-notice"><h2>Included in the draft</h2><ul><li>Project title, revision, date, and Storyline identification.</li><li>All current section content and build/accessibility notes.</li><li>Linked objectives and assessment records.</li><li>Review statuses, source references, and unresolved issues.</li></ul><p>Draft status remains visible. Exact document layouts are the next export-design discussion.</p></div><div class="dr-row">${btn('Preview export summary','snapshot',true)}${btn('Back to review','summary')}</div>${exportSnapshot?`<div class="dr-notice"><h2>Draft export snapshot</h2><p>Customer complaint escalation · revision ${exportSnapshot.revision} · ${esc(exportSnapshot.format)} · 17 October 2026</p><p>${exportSnapshot.records.length} sections · ${exportSnapshot.records.filter(x=>x.status==='Reviewed').length} reviewed · ${issues.length} essential issues retained.</p><p class="dr-small">Illustrative snapshot only. No PDF or PowerPoint file is generated by this preview.</p></div>`:''}`;}
 function renderPanel(){panel.hidden=!state.panel;shell.classList.toggle('dr-expanded',!!state.panel);if(!state.panel){panel.innerHTML='';return;}if(state.panel==='history'){const p=state.previous;panel.innerHTML=`<h2>Version history</h2><p>Current draft · revision ${state.revision}.</p>${p?`<h3>Before the latest edit</h3><p>${esc(p.id)} · revision ${p.revision} · ${esc(p.status)}</p><p class="dr-note-text">${esc(p.text??'Learner task remains linked to Design.')}</p><details><summary class="cursor-interaction">Earlier production notes</summary><p class="dr-note-text">${esc(p.build)}</p><p class="dr-note-text">${esc(p.access)}</p></details>${btn('Restore as new draft','restore')}`:'<p>No local edit snapshot yet. Edit a section to compare its prior content here.</p>'}<p class="dr-small">This preview retains one previous edit snapshot. Production version retention and conflict recovery remain to be specified and tested.</p>${btn('Close history','close')}`;return;}panel.innerHTML=`<h2>${state.panel==='design'?'Design issues':'Sources & links'}</h2><p><b>${esc(definition().links)}</b><br>Linked records carry their IDs and review flags from Design.</p>${issues.filter(x=>state.panel==='design'||x.sections.includes(state.active)).map(x=>`<h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p><p class="dr-small">${esc(x.action)}</p>`).join('')}<p class="dr-small">Fictional example sources are not verified organizational evidence. No source or assessment record is changed by this preview.</p>${btn('Close panel','close')}`;}
 function render(){renderNav();main.innerHTML=state.view==='summary'?summaryView():state.view==='request'?requestView():state.view==='export'?exportView():sectionView();renderPanel();try{globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}catch{}}
 function navigate(id){state.active=id;state.view='section';editing=false;render();persist();nav.querySelector(`[data-open="${id}"]`)?.focus();announce('Opened '+definition().title+'. '+current().status+'.');}
 root.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){const r=current();if(!editing){state.previous={...r,revision:state.revision};state.revision++;editing=true;}r[el.dataset.field]=el.value.slice(0,500);r.status=r.id==='SL-05'?'Needs update':'Needs review';const status=main.querySelector('[data-status]');if(status)status.textContent=r.status;const review=main.querySelector('[data-action="review"]');if(review)review.textContent='Mark reviewed with open issues';main.querySelector('[data-save]').textContent='Revision '+state.revision+' · edits held in this preview';renderNav();renderPanel();main.querySelector('[data-action="undo"]').disabled=false;clearTimeout(timer);timer=setTimeout(persist,600);}if(el.dataset.request){request()[el.dataset.request]=el.value.slice(0,300);request().saved=false;clearTimeout(timer);timer=setTimeout(persist,600);}if(el.hasAttribute('data-format')){state.format=el.value;exportSnapshot=null;render();main.querySelector('#dr-format')?.focus();persist();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.open){navigate(b.dataset.open);return;}const a=b.dataset.action;if(!a)return;if(a.startsWith('open-')){navigate(a.slice(5));return;}const r=current();editing=false;clearTimeout(timer);let message='';if(a==='sources'||a==='history'||a==='design'){state.panel=state.panel===a?'':a;}else if(a==='close'){state.panel='';}else if(a==='summary'||a==='request'||a==='section'||a==='export'){state.view=a;if(a==='export')exportSnapshot=null;}else if(a==='next'){const nextIndex=definitions.findIndex(d=>d.id===state.active)+1;if(nextIndex<definitions.length){navigate(definitions[nextIndex].id);return;}state.view='summary';}else if(a==='review'){r.status=r.status==='Reviewed'?(r.id==='SL-05'?'Needs update':'Needs review'):'Reviewed';message='Section '+r.status.toLowerCase()+'. Essential issues remain open.';}else if(a==='undo'&&state.previous?.id===r.id){const p=state.previous;for(const f of ['text','build','access'])r[f]=p[f];r.status=r.id==='SL-05'?'Needs update':'Needs review';state.revision++;state.previous=null;message='Earlier content restored as a new draft revision. Review and source checks remain.';}else if(a==='restore'&&state.previous){const p=state.previous,target=state.records.find(x=>x.id===p.id);for(const f of ['text','build','access'])target[f]=p[f];target.status=target.id==='SL-05'?'Needs update':'Needs review';state.active=p.id;state.view='section';state.revision++;state.previous=null;message='Earlier section restored as a new draft. Open issues are retained.';}else if(a==='save-request'){request().saved=true;message='Unsent revision request held in this preview. Draft content is unchanged.';}else if(a==='snapshot'){exportSnapshot={revision:state.revision,format:state.format,records:state.records.map(x=>({...x}))};message='Draft export summary prepared. No file was generated.';}render();persist();const target=a==='request'?main.querySelector('#dr-scope'):a==='close'?main.querySelector('[data-action="sources"]'):a==='restore'||a==='undo'?main.querySelector('textarea'):root.querySelector(`[data-action="${a}"]`);target?.focus();if(message)announce(message);});
 restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',e=>{if(root.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;const s=e.detail?.globals?.widgetState;if(s?.privateContent?.kind==='development-review-v1'){restore(s);editing=false;exportSnapshot=null;render();}});
})();
</script>
