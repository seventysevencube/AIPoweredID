<div id="aipid-sequence-wireframe" aria-label="Learning sequence wireframe">
 <header class="sq-chrome"><span class="sq-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="sq-small sq-demo">Wireframe · Sample data</span></header>
 <div class="sq-project"><div><span class="sq-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="sq-shell"><nav class="sq-nav" aria-label="Sequence workspace sections"></nav><main class="sq-main" aria-label="Learning sequence workspace"></main><aside class="sq-panel" id="sq-context" aria-label="Sequence context" hidden></aside></div>
 <footer class="sq-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="sq-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-sequence-wireframe{color-scheme:light dark;--sq-bg:light-dark(#f5f5f4,#171717);--sq-paper:light-dark(#fff,#222);--sq-ink:light-dark(#242424,#f2f2f0);--sq-soft:light-dark(#565656,#bdbdb9);--sq-line:light-dark(#d4d4d0,#50504c);--sq-inset:light-dark(#eeeee9,#30302d);--sq-button:light-dark(#30302d,#eeeeea);--sq-button-text:light-dark(#fff,#242424);background:var(--sq-bg);color:var(--sq-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-sequence-wireframe *{box-sizing:border-box}
 #aipid-sequence-wireframe [hidden]{display:none!important}
 #aipid-sequence-wireframe p{margin:0}
 #aipid-sequence-wireframe .sq-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--sq-paper);border-bottom:1px solid var(--sq-line)}
 #aipid-sequence-wireframe .sq-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-sequence-wireframe .sq-brand svg{width:20px;height:20px}
 #aipid-sequence-wireframe .sq-demo{margin-left:auto}
 #aipid-sequence-wireframe .sq-small{font-size:12px;color:var(--sq-soft)}
 #aipid-sequence-wireframe .sq-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--sq-paper);border-bottom:1px solid var(--sq-line)}
 #aipid-sequence-wireframe .sq-project p{font-weight:500}
 #aipid-sequence-wireframe .sq-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--sq-soft)}
 #aipid-sequence-wireframe [aria-current="step"]{font-weight:500;color:var(--sq-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-sequence-wireframe .sq-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-sequence-wireframe .sq-shell.sq-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-sequence-wireframe .sq-nav{padding:25px 14px;border-right:1px solid var(--sq-line);min-width:0}
 #aipid-sequence-wireframe .sq-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-sequence-wireframe .sq-nav ol{list-style:none;padding:0;margin:0;display:grid;gap:6px}
 #aipid-sequence-wireframe .sq-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--sq-ink);padding:11px 10px;font:inherit;font-size:13px}
 #aipid-sequence-wireframe .sq-nav button[aria-current="location"]{background:var(--sq-inset);border-color:var(--sq-line)}
 #aipid-sequence-wireframe .sq-nav small{display:block;font-size:12px;color:var(--sq-soft);margin-top:4px}
 #aipid-sequence-wireframe .sq-nav-note{font-size:12px;color:var(--sq-soft);margin:24px 10px 0}
 #aipid-sequence-wireframe .sq-main{padding:28px;background:var(--sq-paper);min-width:0}
 #aipid-sequence-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-sequence-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-sequence-wireframe h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-sequence-wireframe .sq-description{color:var(--sq-soft);margin-bottom:22px}
 #aipid-sequence-wireframe .sq-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-sequence-wireframe .sq-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-sequence-wireframe .sq-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--sq-line);border-radius:6px;background:var(--sq-paper);color:var(--sq-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-sequence-wireframe .sq-primary{background:var(--sq-button);color:var(--sq-button-text);border-color:var(--sq-button)}
 #aipid-sequence-wireframe .sq-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--sq-inset);border-radius:4px}
 #aipid-sequence-wireframe .sq-readout{background:var(--sq-inset);border-radius:6px;padding:17px;margin:20px 0}
 #aipid-sequence-wireframe .sq-readout p+p{margin-top:12px}
 #aipid-sequence-wireframe .sq-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-sequence-wireframe .sq-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--sq-line);border-radius:5px;background:var(--sq-paper);color:var(--sq-ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-sequence-wireframe textarea{display:block;resize:vertical}
 #aipid-sequence-wireframe .sq-outline{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
 #aipid-sequence-wireframe .sq-step{padding:17px;border:1px solid var(--sq-line);border-radius:6px;min-width:0}
 #aipid-sequence-wireframe .sq-step p{margin:8px 0 12px}
 #aipid-sequence-wireframe .sq-step-title{font:500 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sq-ink);background:transparent;text-align:left;border:0;padding:0;min-height:44px;width:100%;overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:3px}
 #aipid-sequence-wireframe .sq-check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0}
 #aipid-sequence-wireframe input[type="checkbox"]{width:18px;height:18px;margin:3px 0 0;flex-shrink:0;accent-color:var(--sq-button)}
 #aipid-sequence-wireframe fieldset{min-width:0;border:0;padding:0;margin:24px 0 0}
 #aipid-sequence-wireframe legend{font-weight:500;padding:0;margin-bottom:8px}
 #aipid-sequence-wireframe .sq-footnote{font-size:12px;color:var(--sq-soft);margin-top:13px}
 #aipid-sequence-wireframe .sq-list{padding-left:22px;margin:12px 0}
 #aipid-sequence-wireframe .sq-list li+li{margin-top:12px}
 #aipid-sequence-wireframe .sq-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--sq-line)}
 #aipid-sequence-wireframe .sq-error{font-weight:500;margin-top:16px}
 #aipid-sequence-wireframe .sq-panel{padding:25px 19px;min-width:0;border-left:1px solid var(--sq-line)}
 #aipid-sequence-wireframe .sq-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
 #aipid-sequence-wireframe .sq-panel-head h2{margin:0}
 #aipid-sequence-wireframe .sq-panel p{font-size:13px;margin:12px 0}
 #aipid-sequence-wireframe .sq-panel h3{margin-top:20px}
 #aipid-sequence-wireframe .sq-footer{font-size:12px;color:var(--sq-soft);padding:15px 28px;border-top:1px solid var(--sq-line)}
 #aipid-sequence-wireframe .sq-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-sequence-wireframe .sq-shell.sq-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-sequence-wireframe .sq-expanded .sq-panel{grid-column:2;border-left:0;border-top:1px solid var(--sq-line)}#aipid-sequence-wireframe .sq-expanded .sq-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-sequence-wireframe .sq-shell,#aipid-sequence-wireframe .sq-shell.sq-expanded{grid-template-columns:minmax(0,1fr)}#aipid-sequence-wireframe .sq-expanded .sq-nav{grid-row:auto}#aipid-sequence-wireframe .sq-expanded .sq-panel{grid-column:1}#aipid-sequence-wireframe .sq-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--sq-line)}#aipid-sequence-wireframe .sq-main{padding:24px 18px}#aipid-sequence-wireframe .sq-project,#aipid-sequence-wireframe .sq-footer{padding-left:18px;padding-right:18px}#aipid-sequence-wireframe .sq-chrome{padding-left:18px;padding-right:100px}#aipid-sequence-wireframe .sq-demo{margin-left:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-sequence-wireframe'),main=root.querySelector('.sq-main'),nav=root.querySelector('.sq-nav'),panel=root.querySelector('.sq-panel'),shell=root.querySelector('.sq-shell');
 const catalog={
  'content:EO-1.1':{title:'Identify the relevant complaint details',type:'Content and support',objectives:'EO-1.1 · Understand',summary:'Use the planned annotated case and information checklist to identify details needed for classification and routing.',issue:'The complete required-information list is missing from the sample source.'},
  'support:EO-1.2':{title:'Compare complaint categories',type:'Worked example',objectives:'EO-1.2 · Understand',summary:'Use the planned category comparison and explain why each case matches its category.',issue:'Only two fictional categories are available; the approved taxonomy and boundaries need verification.'},
  'P-1':{title:'Practice 1 — Recognize a routine order-status question',type:'Formative practice',objectives:'EO-1.1 and EO-1.2 · Understand',summary:'Existing practice item: identify relevant details and classify a routine order-status question, with explanatory feedback.',issue:'Exercise rules are fictional. The practice task and feedback remain the existing record.'},
  'support:EO-1.3':{title:'Work through a routing decision',type:'Worked example',objectives:'EO-1.3 · Apply',summary:'Use the planned decision guide and worked explanation to demonstrate applying the criteria and explaining a route.',issue:'Actual routing criteria and boundary cases require approved-source verification.'},
  'pending:routing-practice':{title:'Resolve the routing-practice gap',type:'Activity needing definition',objectives:'EO-1.3 · Apply',summary:'Proposed need: guided routing practice before the integrated assessment. Return to assessment planning to define a distinct practice item if needed; do not silently turn Assessment 1 into practice.',issue:'No linked routing-practice record has been defined. This is a visible planning gap, not a generated task.'},
  'A-1':{title:'Assessment 1 — Route a damaged-item complaint',type:'Scored assessment',objectives:'LO-1 · Apply; enabling objectives 1.1–1.3',summary:'Existing assessment: identify relevant details, classify the complaint, choose the route, and explain the applicable rule. Retain the four-criterion sample rubric, feedback, and attempt rules.',issue:'The sample answer follows fictional rules; organizational accuracy and broader case coverage remain unverified.'},
  'dependency:guide-access':{title:'Plan workplace application',type:'Transfer planning',objectives:'LO-1; relevant L3 behavior',summary:'Identify when and where the approved procedure will be consulted at work, and confirm access with the business owner.',issue:'Guide access and workflow fit are unresolved. This does not add a new deliverable or authorize operational changes.'}
 };
 const state={view:'outline',active:'ST-1',panel:null,addRef:'content:EO-1.1',confirmed:false,nextId:8,lastRemoved:null,steps:[
  {id:'ST-1',ref:'content:EO-1.1',title:catalog['content:EO-1.1'].title,notes:'Prepare the information needed before category and routing decisions.',location:'Learning session · Aid section: information to collect',before:[],reviewed:false},
  {id:'ST-2',ref:'support:EO-1.2',title:catalog['support:EO-1.2'].title,notes:'Compare relevant case details and category characteristics with a worked example.',location:'Learning session · Aid section: complaint categories',before:['ST-1'],reviewed:false},
  {id:'ST-3',ref:'P-1',title:catalog['P-1'].title,notes:'Use the existing practice task and feedback. Discuss the explanation before proceeding.',location:'Learning session · Category practice',before:['ST-1','ST-2'],reviewed:false},
  {id:'ST-4',ref:'support:EO-1.3',title:catalog['support:EO-1.3'].title,notes:'Demonstrate the decision and explanation with the guide available.',location:'Learning session · Aid section: routing guide',before:['ST-1','ST-2'],reviewed:false},
  {id:'ST-5',ref:'pending:routing-practice',title:catalog['pending:routing-practice'].title,notes:'Decide what guided practice is needed for the whole routing decision. Define any new task in assessment planning before final specifications.',location:'Learning session · Planned routing practice',before:['ST-4'],reviewed:false},
  {id:'ST-6',ref:'A-1',title:catalog['A-1'].title,notes:'Use the reviewed assessment record without changing the task, rubric, feedback, or retries. Confirm collection and facilitator review arrangements.',location:'Learning session · Integrated learning evidence',before:['ST-3','ST-4','ST-5'],reviewed:false},
  {id:'ST-7',ref:'dependency:guide-access',title:catalog['dependency:guide-access'].title,notes:'Discuss use of the existing approved guide in work and record any access dependency.',location:'Learning session · Transfer discussion',before:['ST-6'],reviewed:false}
 ]};
 let timer,error='',removePending=false;
 const current=()=>state.steps.find(x=>x.id===state.active)||state.steps[0];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(t,a,primary=false)=>`<button type="button" class="sq-button ${primary?'sq-primary ':''}cursor-interaction" data-action="${a}">${t}</button>`;
 function checks(){const messages=[];state.steps.forEach((s,i)=>s.before.forEach(id=>{const j=state.steps.findIndex(x=>x.id===id);if(j<0)messages.push(`${s.title}: a prerequisite step was removed; review the dependency.`);else if(j>=i)messages.push(`${s.title}: “${state.steps[j].title}” is currently placed afterward.`);}));const count=state.steps.filter(x=>x.ref==='A-1').length;if(!count)messages.push('Assessment 1 is not placed in the sequence; review evidence for the integrated main objective.');if(count>1)messages.push('Assessment 1 is placed more than once. Check the reuse intent and attempt rules; these placements still reference one record.');if(state.steps.some(x=>x.ref==='pending:routing-practice'))messages.push('Guided routing practice needs a defined activity or an explicit alternative in the assessment plan.');else messages.push('Review whether learners have sufficient routing practice before integrated assessment.');return [...new Set(messages)];}
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Learning sequence wireframe',view:state.view,activeStep:state.active,sequence:state.steps.map(s=>({step:s.id,record:s.ref,reviewed:s.reviewed})),draftSelectedForDesignPlan:state.confirmed,orderChecks:checks().length},privateContent:{kind:'sequence-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='sequence-v1')return;const valid=x=>x&&/^ST-[1-9][0-9]{0,3}$/.test(x.id)&&Object.hasOwn(catalog,x.ref);const clean=x=>({id:x.id,ref:x.ref,title:typeof x.title==='string'?x.title.slice(0,100):catalog[x.ref].title,notes:typeof x.notes==='string'?x.notes.slice(0,350):'',location:typeof x.location==='string'?x.location.slice(0,180):'',before:Array.isArray(x.before)?[...new Set(x.before.filter(id=>/^ST-[1-9][0-9]{0,3}$/.test(id)&&id!==x.id))].slice(0,10):[],reviewed:x.reviewed===true});if(Array.isArray(p.steps)&&p.steps.length>0&&p.steps.length<=10&&p.steps.every(valid)&&new Set(p.steps.map(x=>x.id)).size===p.steps.length)state.steps=p.steps.map(clean);if(p.lastRemoved&&valid(p.lastRemoved.step)&&!state.steps.some(s=>s.id===p.lastRemoved.step.id)&&Number.isInteger(p.lastRemoved.index))state.lastRemoved={step:clean(p.lastRemoved.step),index:Math.max(0,Math.min(9,p.lastRemoved.index))};state.active=state.steps.some(x=>x.id===p.active)?p.active:state.steps[0].id;state.nextId=Math.max(...state.steps.map(x=>Number(x.id.slice(3))),state.lastRemoved?Number(state.lastRemoved.step.id.slice(3)):0)+1;if(Number.isInteger(p.nextId)&&p.nextId>state.nextId&&p.nextId<10000)state.nextId=p.nextId;if(['outline','detail','review','add','next','paused'].includes(p.view))state.view=p.view;if([null,'context','guidance'].includes(p.panel))state.panel=p.panel;if(Object.hasOwn(catalog,p.addRef))state.addRef=p.addRef;state.confirmed=p.confirmed===true;if(state.view==='next'&&!state.confirmed)state.view='review';}
 function announce(t){root.querySelector('.sq-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function top(){return `<div class="sq-top"><span class="sq-small" data-save role="status">Preview · Draft</span><div class="sq-row">${['context','guidance'].map(p=>`<button type="button" class="sq-button cursor-interaction" data-panel="${p}" aria-controls="sq-context" aria-expanded="${state.panel===p}">${p==='context'?'Linked context':'Guidance'}</button>`).join('')}</div></div>`;}
 function errors(){return `<p class="sq-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p>`;}
 function outlineView(){return `${top()}<h1>Arrange the learning sequence</h1><p class="sq-description">Put preparation, practice, and assessment in a purposeful order. Reuse the existing records.</p><div class="sq-readout"><p>Sample branch: a written aid used for learning, with a learning-session sequence. No course format, authoring tool, or additional deliverable is assumed.</p></div><ol class="sq-outline">${state.steps.map((s,i)=>`<li class="sq-step"><button type="button" class="sq-step-title cursor-interaction" data-open="${s.id}">${i+1}. ${esc(s.title)}</button><p class="sq-small">${catalog[s.ref].type} · ${s.reviewed?'Reviewed':'Needs review'}</p><div class="sq-row">${i>0?`<button type="button" class="sq-button cursor-interaction" data-move="up" data-step="${s.id}" aria-label="Move ${esc(s.title)} earlier">Move earlier</button>`:''}${i<state.steps.length-1?`<button type="button" class="sq-button cursor-interaction" data-move="down" data-step="${s.id}" aria-label="Move ${esc(s.title)} later">Move later</button>`:''}</div></li>`).join('')}</ol><div class="sq-row" style="margin-top:18px">${state.steps.length<10?btn('Add a step','add'):''}${state.lastRemoved?btn('Undo last removal','undo'):''}</div><p class="sq-footnote">Reordering changes placements, not the linked objectives, content, assessment tasks, or rules. Seven steps is sample structure, not a target.</p><div class="sq-actions">${btn('Save and return later','pause')}${btn('Review sequence checks →','review',true)}</div>`;}
 function detailView(){const s=current(),r=catalog[s.ref],i=state.steps.indexOf(s),missing=s.before.filter(id=>!state.steps.some(x=>x.id===id));return `${top()}<h1>Review sequence step</h1><label class="sq-label" for="sq-step">Select a step</label><select class="sq-field" id="sq-step" data-select-step>${state.steps.map((x,j)=>`<option value="${x.id}" ${s.id===x.id?'selected':''}>${j+1}. ${esc(x.title)}</option>`).join('')}</select><div class="sq-row" style="margin-top:16px"><span class="sq-tag">${r.type}</span><span class="sq-small" data-review-status>${s.reviewed?'Reviewed':'Needs review'}</span></div><div class="sq-readout"><h2>Linked record: ${esc(r.title)}</h2><p>${r.summary}</p><p class="sq-small">${r.objectives}</p></div><label class="sq-label" for="sq-title">Step title</label><input class="sq-field" id="sq-title" data-field="title" type="text" maxlength="100" value="${esc(s.title)}"><label class="sq-label" for="sq-notes">Placement and delivery notes</label><textarea class="sq-field" id="sq-notes" data-field="notes" maxlength="350" rows="3">${esc(s.notes)}</textarea><label class="sq-label" for="sq-location">Where does this step appear?</label><input class="sq-field" id="sq-location" data-field="location" type="text" maxlength="180" value="${esc(s.location)}"><fieldset><legend>Which steps should come before this one?</legend>${state.steps.filter(x=>x.id!==s.id).map(x=>`<label class="sq-check cursor-interaction"><input type="checkbox" data-before="${x.id}" ${s.before.includes(x.id)?'checked':''}><span>${esc(x.title)}</span></label>`).join('')}${missing.length?'<p class="sq-footnote">A previously selected prerequisite was removed. Undo the removal or clear this dependency.</p>':''}${missing.map(id=>`<label class="sq-check cursor-interaction"><input type="checkbox" data-before="${id}" checked><span>Removed prerequisite step</span></label>`).join('')}</fieldset><div class="sq-readout"><h2>Open dependency</h2><p>${r.issue}</p><p class="sq-small">Linked record content is shown for context. Changes to its objective, task, answer, criteria, or feedback belong in the corresponding earlier section.</p></div><div class="sq-row">${btn(s.reviewed?'Mark needs review':'Mark step reviewed','mark')}${state.steps.length>1?btn('Remove step','remove'):''}</div>${removePending?`<div class="sq-readout"><p>Remove this placement? The linked record remains available, and the removal can be undone.</p><div class="sq-row" style="margin-top:12px">${btn('Keep step','cancel-remove')}${btn('Confirm removal','confirm-remove')}</div></div>`:''}${errors()}<div class="sq-actions">${btn('Back to outline','outline')}${btn(i<state.steps.length-1?'Next step →':'Review sequence checks →','next-step',true)}</div>`;}
 function addView(){return `${top()}<h1>Add a sequence step</h1><p class="sq-description">Place an existing record or a visible planning gap. This does not generate a duplicate task.</p><label class="sq-label" for="sq-add-ref">What should this step use?</label><select class="sq-field" id="sq-add-ref" data-add-ref>${Object.entries(catalog).map(([id,r])=>`<option value="${id}" ${state.addRef===id?'selected':''}>${r.title}</option>`).join('')}</select><div class="sq-readout"><h2>${catalog[state.addRef].type}</h2><p>${catalog[state.addRef].summary}</p><p class="sq-small">${catalog[state.addRef].issue}</p></div><div class="sq-actions">${btn('Back to outline','outline')}${btn('Add to the end of the sequence','add-confirm',true)}</div>`;}
 function reviewView(){return `${top()}<h1>Review sequence checks</h1><p class="sq-description">Review order, preparation, practice, and integrated evidence before assembling the Design plan.</p><div class="sq-readout"><h2>Order and activity checks</h2><ul class="sq-list">${checks().map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="sq-small">These checks support designer judgment. Confirm the intended sequence and document any deliberate alternative.</p></div><h2>Source and coverage issues carry forward</h2><p>The information requirements, full category set, real routing procedure, assessment answers, case coverage, and workplace guide access still need confirmation. The exercise rules remain fictional.</p><p class="sq-footnote">${state.steps.filter(x=>!x.reviewed).length} step(s) are marked Needs review. Review status does not verify source accuracy or resolve the pending practice task.</p>${errors()}<div class="sq-actions">${btn('Return to outline','outline')}${btn('Use draft sequence in Design plan →','confirm',true)}</div>`;}
 function nextView(){return `${top()}<span class="sq-tag">Draft sequence selected</span><h1 style="margin-top:18px">Next: review the detailed Design plan</h1><p class="sq-description">Bring the existing reviewed records together without introducing new objectives, assessments, or factual claims.</p><div class="sq-readout"><p>The plan will include the solution decision and structure, objective hierarchy, defined assessments, learning sequence, content/source map, evaluation alignment, and open issues.</p><p class="sq-small">This draft keeps the practice-definition gap, source uncertainty, and review flags visible. It does not authorize Development generation or establish readiness for handoff.</p></div>${btn('Return to sequence review','review')}`;}
 function renderNav(){nav.innerHTML=`<h2>Learning sequence</h2><ol>${[['outline','Sequence outline','Arrange existing records'],['detail','Step details','Placement and prerequisites'],['review','Review sequence','Order, preparation, and gaps']].map(([key,title,subtitle])=>`<li><button type="button" class="cursor-interaction" data-action="${key}" ${state.view===key?'aria-current="location"':''}>${title}<small>${subtitle}</small></button></li>`).join('')}</ol><p class="sq-nav-note">Objectives → assessments → content/support → sequence → Design plan.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('sq-expanded',state.panel!==null);if(!state.panel)return;panel.innerHTML=`<div class="sq-panel-head"><h2>${state.panel==='context'?'Linked context':'Sequence guidance'}</h2>${btn('Close','close-panel')}</div>${state.panel==='context'?'<h3>Main objective</h3><p>LO-1: select an appropriate complaint response and route, and explain the applicable criteria. Proposed Bloom level: Apply.</p><h3>Defined evidence</h3><p>Assessment 1 covers the integrated decision and explanation. Practice 1 supports details and category recognition. The additional routing-practice need is unresolved.</p><h3>Content/support</h3><p>Use the earlier plans for relevant information, category comparison, and a routing guide. Source settings remain provided-material-only in this sample.</p><h3>Boundary</h3><p>This is an independent sample preview. It does not transfer user edits between files or validate the fictional procedure.</p>':'<h3>Prepare for the performance</h3><p>Check that explanation, examples, and practice prepare learners for the intended assessment demand.</p><h3>Reorder accessibly</h3><p>Use Move earlier and Move later. Stable record links remain intact when the order changes.</p><h3>Preserve records</h3><p>A placement refers to existing content, support, practice, or assessment. Reuse is not a new copy of its underlying task.</p><h3>Resolve revealed gaps</h3><p>If sequencing reveals missing practice or assessment evidence, return to the relevant record for review rather than silently changing it here.</p><h3>Support transfer within scope</h3><p>Keep workplace dependencies visible. Do not add assets or operational changes that the designer has not selected.</p>'}`;}
 function render(){renderNav();main.innerHTML=state.view==='outline'?outlineView():state.view==='detail'?detailView():state.view==='review'?reviewView():state.view==='add'?addView():state.view==='next'?nextView():`<h1>Your sequence review is paused</h1><p class="sq-description">Resume the current sequence and linked draft records.</p>${btn('Resume sequence review','outline',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidate(all=false){state.confirmed=false;if(all)state.steps.forEach(s=>s.reviewed=false);else current().reviewed=false;const el=main.querySelector('[data-review-status]');if(el)el.textContent='Needs review after edits';const b=main.querySelector('[data-action="mark"]');if(b)b.textContent='Mark step reviewed';}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const k=e.target.dataset.field;if(!['title','notes','location'].includes(k))return;current()[k]=e.target.value;invalidate();schedule();});
 root.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-select-step')){state.active=t.value;removePending=false;error='';render();save();main.querySelector('[data-select-step]')?.focus();return;}if(t.hasAttribute('data-add-ref')){state.addRef=t.value;render();save();main.querySelector('[data-add-ref]')?.focus();return;}if(t.dataset.before){current().before=current().before.filter(id=>id!==t.dataset.before);if(t.checked)current().before.push(t.dataset.before);invalidate();save();}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.open){state.active=b.dataset.open;state.view='detail';error='';removePending=false;render();save();focusFirst();return;}if(b.dataset.move){const i=state.steps.findIndex(s=>s.id===b.dataset.step),j=i+(b.dataset.move==='up'?-1:1);if(i>=0&&j>=0&&j<state.steps.length){[state.steps[i],state.steps[j]]=[state.steps[j],state.steps[i]];invalidate(true);render();save();const moved=main.querySelector(`[data-open="${b.dataset.step}"]`);moved?.focus();announce(`Step moved to position ${j+1} of ${state.steps.length}. Sequence review flags updated.`);}return;}const a=b.dataset.action;if(!a)return;error='';if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='mark'){if(!current().title.trim())error='Add a step title before marking reviewed.';else current().reviewed=!current().reviewed;state.confirmed=false;}else if(a==='next-step'){const i=state.steps.indexOf(current());if(i<state.steps.length-1)state.active=state.steps[i+1].id;else state.view='review';removePending=false;}else if(a==='remove')removePending=true;else if(a==='cancel-remove')removePending=false;else if(a==='confirm-remove'&&state.steps.length>1){const i=state.steps.indexOf(current());state.lastRemoved={step:{...current(),before:[...current().before]},index:i};state.steps.splice(i,1);state.active=state.steps[Math.min(i,state.steps.length-1)].id;state.view='outline';removePending=false;invalidate(true);}else if(a==='undo'&&state.lastRemoved&&state.steps.length<10){state.steps.splice(Math.min(state.lastRemoved.index,state.steps.length),0,state.lastRemoved.step);state.lastRemoved=null;invalidate(true);}else if(a==='add-confirm'&&state.steps.length<10){const id='ST-'+state.nextId++;state.steps.push({id,ref:state.addRef,title:catalog[state.addRef].title,notes:'',location:'',before:[],reviewed:false});state.active=id;state.view='detail';invalidate(true);}else if(a==='confirm'){if(state.steps.some(s=>!s.title.trim()))error='Add a title for every sequence step.';else{state.confirmed=true;state.view='next';}}else if(a==='pause'){state.view='paused';state.panel=null;}else if(['outline','detail','review','add'].includes(a)){state.view=a;removePending=false;}render();save();focusFirst();announce(error||'Sequence review updated.');});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
