<div id="aipid-solution-wireframe" aria-label="Design performance-solution review wireframe">
  <header class="ds-chrome"><span class="ds-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="ds-small ds-demo">Wireframe · Sample data</span></header>
  <div class="ds-project"><div><span class="ds-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
  <div class="ds-shell"><nav class="ds-nav" aria-label="Design review steps"></nav><main class="ds-main" aria-label="Performance-solution workspace"></main><aside class="ds-panel" id="ds-context" aria-label="Contextual information" hidden></aside></div>
  <footer class="ds-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="ds-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-solution-wireframe{color-scheme:light dark;--ds-bg:light-dark(#f5f5f4,#171717);--ds-paper:light-dark(#fff,#222);--ds-ink:light-dark(#242424,#f2f2f0);--ds-soft:light-dark(#565656,#bdbdb9);--ds-line:light-dark(#d4d4d0,#50504c);--ds-inset:light-dark(#eeeee9,#30302d);--ds-button:light-dark(#30302d,#eeeeea);--ds-button-text:light-dark(#fff,#242424);background:var(--ds-bg);color:var(--ds-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-solution-wireframe *{box-sizing:border-box}
 #aipid-solution-wireframe [hidden]{display:none!important}
 #aipid-solution-wireframe p{margin:0}
 #aipid-solution-wireframe .ds-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--ds-paper);border-bottom:1px solid var(--ds-line)}
 #aipid-solution-wireframe .ds-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-solution-wireframe .ds-brand svg{width:20px;height:20px}
 #aipid-solution-wireframe .ds-demo{margin-left:auto}
 #aipid-solution-wireframe .ds-small{font-size:12px;color:var(--ds-soft)}
 #aipid-solution-wireframe .ds-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--ds-paper);border-bottom:1px solid var(--ds-line)}
 #aipid-solution-wireframe .ds-project p{font-weight:500}
 #aipid-solution-wireframe .ds-project ol{list-style:none;display:flex;flex-wrap:wrap;gap:18px;padding:0;margin:0;font-size:13px;color:var(--ds-soft)}
 #aipid-solution-wireframe [aria-current="step"]{font-weight:500;color:var(--ds-ink);text-decoration:underline;text-underline-offset:6px}
 #aipid-solution-wireframe .ds-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-solution-wireframe .ds-shell.ds-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-solution-wireframe .ds-nav{padding:25px 14px;border-right:1px solid var(--ds-line);min-width:0}
 #aipid-solution-wireframe .ds-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-solution-wireframe .ds-nav ol{list-style:none;padding:0;margin:0;display:grid;gap:7px}
 #aipid-solution-wireframe .ds-nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:11px 10px;color:var(--ds-ink);font:inherit;font-size:13px}
 #aipid-solution-wireframe .ds-nav button[aria-current="location"]{background:var(--ds-inset);border-color:var(--ds-line)}
 #aipid-solution-wireframe .ds-nav small{display:block;font-size:12px;color:var(--ds-soft);margin-top:4px}
 #aipid-solution-wireframe .ds-nav-note{margin:24px 10px 0;font-size:12px;color:var(--ds-soft)}
 #aipid-solution-wireframe .ds-main{min-width:0;padding:28px;background:var(--ds-paper)}
 #aipid-solution-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-solution-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-solution-wireframe h3{font-size:15px;font-weight:500;margin:0 0 9px}
 #aipid-solution-wireframe .ds-description{color:var(--ds-soft);margin-bottom:22px}
 #aipid-solution-wireframe .ds-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-solution-wireframe .ds-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
 #aipid-solution-wireframe .ds-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;max-width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--ds-line);border-radius:6px;color:var(--ds-ink);background:var(--ds-paper);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-solution-wireframe .ds-button svg{width:16px;height:16px;flex-shrink:0}
 #aipid-solution-wireframe .ds-primary{color:var(--ds-button-text);background:var(--ds-button);border-color:var(--ds-button)}
 #aipid-solution-wireframe .ds-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--ds-inset);border-radius:4px}
 #aipid-solution-wireframe .ds-intro{margin-bottom:21px}
 #aipid-solution-wireframe .ds-box-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}
 #aipid-solution-wireframe .ds-box{font:inherit;text-align:left;min-width:0;color:var(--ds-ink);background:var(--ds-paper);border:1px solid var(--ds-line);border-radius:6px;padding:14px}
 #aipid-solution-wireframe .ds-box[aria-pressed="true"]{background:var(--ds-inset);border:2px solid var(--ds-ink);padding:13px}
 #aipid-solution-wireframe .ds-box span{display:block;font-size:12px;color:var(--ds-soft);margin-top:7px}
 #aipid-solution-wireframe .ds-detail{border-top:1px solid var(--ds-line);padding-top:22px;margin-top:22px}
 #aipid-solution-wireframe .ds-detail p+p{margin-top:12px}
 #aipid-solution-wireframe .ds-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-solution-wireframe .ds-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--ds-line);border-radius:5px;color:var(--ds-ink);background:var(--ds-paper);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-solution-wireframe textarea{display:block;resize:vertical}
 #aipid-solution-wireframe .ds-readout{background:var(--ds-inset);border-radius:6px;padding:16px;margin:20px 0}
 #aipid-solution-wireframe .ds-readout p+p{margin-top:12px}
 #aipid-solution-wireframe .ds-readout .ds-label{margin-top:0}
 #aipid-solution-wireframe .ds-check{display:flex;align-items:flex-start;gap:10px;margin-top:18px;padding:9px 0}
 #aipid-solution-wireframe input[type="checkbox"],#aipid-solution-wireframe input[type="radio"]{width:18px;height:18px;margin:3px 0 0;flex-shrink:0;accent-color:var(--ds-button)}
 #aipid-solution-wireframe fieldset{min-width:0;border:0;margin:24px 0 0;padding:0}
 #aipid-solution-wireframe legend{font-weight:500;margin-bottom:12px;padding:0}
 #aipid-solution-wireframe .ds-choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ds-line);border-radius:6px;padding:14px;margin-bottom:9px}
 #aipid-solution-wireframe .ds-choice:has(input:checked){background:var(--ds-inset);border-color:var(--ds-ink)}
 #aipid-solution-wireframe .ds-choice small{display:block;font-size:13px;color:var(--ds-soft);margin-top:5px}
 #aipid-solution-wireframe .ds-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ds-line);padding-top:20px;margin-top:26px}
 #aipid-solution-wireframe .ds-footnote{margin-top:13px;font-size:12px;color:var(--ds-soft)}
 #aipid-solution-wireframe .ds-error{padding:12px 0;font-weight:500}
 #aipid-solution-wireframe .ds-list{padding-left:22px;margin:12px 0}
 #aipid-solution-wireframe .ds-list li+li{margin-top:12px}
 #aipid-solution-wireframe .ds-panel{min-width:0;padding:25px 19px;border-left:1px solid var(--ds-line)}
 #aipid-solution-wireframe .ds-panel-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
 #aipid-solution-wireframe .ds-panel-head h2{margin:0}
 #aipid-solution-wireframe .ds-panel p{font-size:13px;margin:12px 0}
 #aipid-solution-wireframe .ds-panel h3{margin-top:22px}
 #aipid-solution-wireframe .ds-footer{font-size:12px;color:var(--ds-soft);padding:15px 28px;border-top:1px solid var(--ds-line)}
 #aipid-solution-wireframe .ds-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-solution-wireframe .ds-shell.ds-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-solution-wireframe .ds-expanded .ds-panel{grid-column:2;border-left:0;border-top:1px solid var(--ds-line)}#aipid-solution-wireframe .ds-expanded .ds-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-solution-wireframe .ds-shell,#aipid-solution-wireframe .ds-shell.ds-expanded{grid-template-columns:minmax(0,1fr)}#aipid-solution-wireframe .ds-expanded .ds-nav{grid-row:auto}#aipid-solution-wireframe .ds-expanded .ds-panel{grid-column:1}#aipid-solution-wireframe .ds-nav{border-right:0;border-bottom:1px solid var(--ds-line);padding:20px 18px}#aipid-solution-wireframe .ds-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}#aipid-solution-wireframe .ds-main{padding:24px 18px}#aipid-solution-wireframe .ds-project,#aipid-solution-wireframe .ds-footer{padding-left:18px;padding-right:18px}#aipid-solution-wireframe .ds-chrome{padding-left:18px;padding-right:100px}#aipid-solution-wireframe .ds-demo{margin-left:0}}
 @media(max-width:420px){#aipid-solution-wireframe .ds-box-grid,#aipid-solution-wireframe .ds-nav ol{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-solution-wireframe');
 const main=root.querySelector('.ds-main'),nav=root.querySelector('.ds-nav'),panel=root.querySelector('.ds-panel'),shell=root.querySelector('.ds-shell');
 const boxes=[
  {name:'Expectations and Feedback',status:'Hypothesis',evidence:'The sample procedure defines escalation criteria. Supervisor notes report inconsistent routing; they do not show whether expectations or feedback are clear.',question:'Can representatives describe the expected decisions, and what feedback do they receive after a routing error?',finding:'Check whether expectations and feedback are consistent across supervisors.',source:true},
  {name:'Tools and Resources',status:'Needs investigation',evidence:'A sample escalation procedure is available. Access to it during live complaint handling and its usability have not been confirmed.',question:'Can representatives find and use the current guide when making a routing decision?',finding:'Observe guide access and use during complaint handling before assuming a new resource is needed.',source:true},
  {name:'Consequences and Incentives',status:'No evidence yet',evidence:'The Analysis brief contains no evidence about rewards, workload targets, or consequences for routing decisions.',question:'Do targets or consequences encourage unnecessary escalation or discourage appropriate escalation?',finding:'Ask the business owner about targets and consequences. No cause established.',source:false},
  {name:'Skills and Knowledge',status:'Hypothesis',evidence:'The sample supervisor notes describe routing errors. Errors alone do not establish a knowledge or skill gap.',question:'Can representatives apply the criteria to realistic cases when the guide and expectations are clear?',finding:'Use a few diagnostic case decisions with explanations to establish whether instruction is needed.',source:true},
  {name:'Selection and Assignment (Capacity)',status:'No evidence yet',evidence:'There is no evidence about role assignment, capability requirements, or mismatches between tasks and available capacity.',question:'Are role requirements, assignments, and available capabilities appropriate for the task?',finding:'Confirm role and assignment requirements with the relevant owner; do not infer incapacity from errors.',source:false},
  {name:'Motives and Preferences (Attitude)',status:'No evidence yet',evidence:'There is no direct evidence about willingness to perform or individual preferences.',question:'What do representatives say helps or discourages appropriate routing, and how does the work environment contribute?',finding:'Ask representatives about their experience. Do not label poor performance as a motivation problem.',source:false}
 ];
 const routes={learning:['Learning response','Address an evidenced knowledge or skill gap.'],nonlearning:['Nonlearning response','Address tools, expectations, feedback, work conditions, or other influences.'],both:['Combined response','Coordinate learning with nonlearning actions and dependencies.'],investigate:['Further investigation','Resolve evidence gaps before selecting an intervention.']};
 const state={screen:'boxes',box:0,panel:null,reviewed:[],findings:boxes.map(b=>b.finding),statuses:boxes.map(b=>b.status),route:'',reason:'',dependencies:'Confirm guide access and expectations with the business owner before relying on practice alone.',l2:'Use scenario-based routing tasks with the approved guide. Evidence: the selected path and explanation match the applicable criteria. Proposed success criterion: all critical routing decisions are correct and the explanation identifies the applicable criteria.',l2Confirmed:false,accepted:false};
 let timer,error='';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const button=(text,action,primary=false)=>`<button type="button" class="ds-button ${primary?'ds-primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
 function persist(){if(!window.openai||typeof window.openai.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Design Six Boxes wireframe',view:state.screen,selectedBox:boxes[state.box].name,route:state.route||null,routeConfirmed:state.accepted,reviewedBoxes:state.reviewed.map(i=>boxes[i].name),l2Confirmed:state.l2Confirmed},privateContent:{kind:'design-solution-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){const p=saved?.privateContent;if(p?.kind!=='design-solution-v1')return;if(['boxes','route','recommend','paused'].includes(p.screen))state.screen=p.screen;if(Number.isInteger(p.box)&&p.box>=0&&p.box<6)state.box=p.box;if([null,'context','guidance','sources'].includes(p.panel))state.panel=p.panel;if(Array.isArray(p.reviewed))state.reviewed=[...new Set(p.reviewed.filter(i=>Number.isInteger(i)&&i>=0&&i<6))];if(Array.isArray(p.findings))boxes.forEach((b,i)=>{if(typeof p.findings[i]==='string')state.findings[i]=p.findings[i].slice(0,600)});if(Array.isArray(p.statuses))boxes.forEach((b,i)=>{if(['Hypothesis','Needs investigation','No evidence yet','Evidence supports influence','Evidence does not support influence'].includes(p.statuses[i]))state.statuses[i]=p.statuses[i]});if(Object.hasOwn(routes,p.route))state.route=p.route;for(const k of ['reason','dependencies','l2'])if(typeof p[k]==='string')state[k]=p[k].slice(0,900);state.l2Confirmed=p.l2Confirmed===true;state.accepted=p.accepted===true;if(state.screen==='recommend'&&!state.accepted)state.screen='route';}
 function announce(t){root.querySelector('.ds-live').textContent=t;}
 function save(){clearTimeout(timer);const el=main.querySelector('[data-save]');const ok=persist();if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function queue(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function tools(){return `<div class="ds-top"><span class="ds-small" data-save role="status">Preview · Draft</span><div class="ds-row">${['context','guidance'].map(x=>`<button type="button" class="ds-button cursor-interaction" data-panel="${x}" aria-controls="ds-context" aria-expanded="${state.panel===x}">${x==='context'?'Analysis context':'Guidance'}</button>`).join('')}</div></div>`;}
 function boxView(){const b=boxes[state.box];return `${tools()}<h1>What will improve performance?</h1><p class="ds-description">Review the six influences before choosing a response. More than one may contribute.</p><div class="ds-intro ds-row"><span class="ds-tag">Design skeleton · Needs review</span><span class="ds-small">From Analysis brief · Version 1</span></div><h2>Six Boxes review</h2><div class="ds-box-grid">${boxes.map((b,i)=>`<button type="button" class="ds-box cursor-interaction" data-box="${i}" aria-pressed="${state.box===i}" aria-controls="ds-box-detail">${i+1}. ${esc(b.name)}<span data-box-status="${i}">${esc(state.statuses[i])} · ${state.reviewed.includes(i)?'Reviewed':'Needs review'}</span></button>`).join('')}</div><section class="ds-detail" id="ds-box-detail" aria-labelledby="ds-box-heading"><h2 id="ds-box-heading">${state.box+1}. ${esc(b.name)}</h2><p class="ds-small">Draft interpretation for designer review</p><div class="ds-readout"><span class="ds-label">Evidence carried from Analysis</span><p>${esc(b.evidence)}</p>${b.source?`<div class="ds-row" style="margin-top:14px"><button type="button" class="ds-button cursor-interaction" data-panel="sources" aria-controls="ds-context" aria-expanded="${state.panel==='sources'}">View sample sources</button></div>`:''}</div><p><span class="ds-label">Question to investigate</span>${esc(b.question)}</p><label class="ds-label" for="ds-evidence">Evidence status</label><select class="ds-field" id="ds-evidence" data-field="status">${['Hypothesis','Needs investigation','No evidence yet','Evidence supports influence','Evidence does not support influence'].map(x=>`<option ${state.statuses[state.box]===x?'selected':''}>${x}</option>`).join('')}</select><label class="ds-label" for="ds-finding">Your finding or next step</label><textarea class="ds-field" id="ds-finding" data-field="finding" maxlength="600" rows="3">${esc(state.findings[state.box])}</textarea><label class="ds-check cursor-interaction"><input type="checkbox" data-field="reviewed" ${state.reviewed.includes(state.box)?'checked':''}><span>I have reviewed this box.<small class="ds-small" style="display:block">Reviewing a box does not confirm its hypothesis.</small></span></label></section><div class="ds-actions">${button('Save and return later','pause')}${button('Review response →','route',true)}</div><p class="ds-footnote">Unknowns remain visible. Choosing a response is a separate decision.</p>`;}
 function routeFields(){if(!state.route)return '';if(state.route==='investigate')return `<div class="ds-readout"><h2>Resolve the evidence gaps</h2><ul class="ds-list"><li>Observe how the current guide is accessed and used.</li><li>Ask representatives to explain a few routing decisions with the guide available.</li><li>Check feedback, targets, and work conditions with the business owner.</li></ul><p class="ds-small">No instructional content will be drafted on this route. L2 applicability remains pending.</p></div>`;if(state.route==='nonlearning')return `<div class="ds-readout"><h2>Linked evaluation plan</h2><p><span class="ds-label">L2 — Learning</span>Not applicable — no learning intervention.</p><p>Your decision rationale documents why. The relevant L3 behavior and L4 results measures carry forward.</p></div>`;return `<section class="ds-detail"><h2>Confirm the linked L2 measure</h2><p class="ds-small">From Analysis evaluation plan · Proposed success criterion added for review</p><label class="ds-label" for="ds-l2">Learning evidence and success criterion</label><textarea class="ds-field" id="ds-l2" data-field="l2" maxlength="900" rows="5">${esc(state.l2)}</textarea><label class="ds-check cursor-interaction"><input type="checkbox" data-field="l2Confirmed" ${state.l2Confirmed?'checked':''}><span>I confirm this L2 measure is defined and appropriate for the learning response.</span></label><p class="ds-footnote">This is the same evaluation-plan measure, carried forward for confirmation. Detailed assessments are defined later in Design.</p>${state.route==='both'?`<label class="ds-label" for="ds-dependencies">Nonlearning actions and dependencies</label><textarea class="ds-field" id="ds-dependencies" data-field="dependencies" maxlength="900" rows="3">${esc(state.dependencies)}</textarea>`:''}</section>`;}
 function routeView(){return `${tools()}<h1>Choose the performance response</h1><p class="ds-description">Use the reviewed evidence to make the decision. No route is accepted automatically.</p><div class="ds-row"><span class="ds-tag">${state.reviewed.length} of 6 boxes reviewed</span>${button('Return to Six Boxes','boxes')}</div><fieldset><legend>Which response is justified?</legend>${Object.entries(routes).map(([key,r])=>`<label class="ds-choice cursor-interaction"><input type="radio" name="ds-route" value="${key}" ${state.route===key?'checked':''}><span>${r[0]}<small>${r[1]}</small></span></label>`).join('')}</fieldset><label class="ds-label" for="ds-reason">Decision rationale and supporting evidence</label><textarea class="ds-field" id="ds-reason" data-field="reason" maxlength="900" rows="3" aria-describedby="ds-reason-help">${esc(state.reason)}</textarea><p class="ds-footnote" id="ds-reason-help">Explain what supports this response, what remains uncertain, and which findings it addresses.</p><div data-route-fields>${routeFields()}</div><p class="ds-error" role="alert" ${error?'':'hidden'}>${esc(error)}</p><div class="ds-actions">${button('Save and return later','pause')}${button(state.route==='investigate'?'Confirm investigation plan':'Confirm response and preview next step','confirm',true)}</div><p class="ds-footnote">Confirmation sets the route in this preview. Remaining gaps carry forward; accepted content is not overwritten.</p>`;}
 function recommendView(){const r=state.route,learning=r==='learning'||r==='both';return `${tools()}<span class="ds-tag">Response confirmed · Preview</span><h1 style="margin-top:18px">${r==='investigate'?'Investigation plan': 'Review proposed interventions'}</h1><p class="ds-description">${r==='investigate'?'Resolve the evidence gaps, then revisit your response decision.':'The selected route guides the next editable Design section.'}</p><div class="ds-readout"><h2>${routes[r][0]}</h2><p>${esc(state.reason)}</p><p class="ds-small">${learning?'Linked L2 measure confirmed for this preview.':r==='nonlearning'?'Linked L2 measure: Not applicable — no learning intervention.':'L2 applicability pending; instructional Design has not started.'}</p></div>${r==='investigate'?'<h2>Questions to carry back</h2><ul class="ds-list"><li>Can representatives apply the criteria when the guide is accessible?</li><li>Are expectations, feedback, tools, or incentives contributing?</li></ul>':`<h2>Draft starting points for review</h2><ul class="ds-list">${learning?'<li>Consider realistic complaint-routing practice with explanations and feedback, linked to the confirmed L2 measure. Verify the remaining skill-gap hypothesis before finalizing the intervention.</li>':''}${r!=='learning'?'<li>Review current guide access and usability with the business owner before commissioning a new performance-support aid.</li><li>Ask the relevant owner to review expectations and feedback practices. Ownership and feasibility require confirmation.</li>':''}</ul>${r==='both'?`<span class="ds-label">Nonlearning dependencies carried forward</span><p>${esc(state.dependencies)}</p>`:''}<p class="ds-footnote">These suggestions are unaccepted sample content. The next screen will let you refine intervention choices${learning?', then choose microlearning, a course, or a mix before selecting Storyline, Rise, or both':''}.</p>`}<div class="ds-actions">${button('Revisit response decision','route')}${button('Review Six Boxes','boxes')}</div>`;}
 function renderNav(){nav.innerHTML=`<h2>Design</h2><ol>${[['boxes','Six Boxes review',`${state.reviewed.length} of 6 reviewed`],['route','Response decision',state.accepted?'Confirmed':state.route?'Draft choice':'Not selected']].map(([key,label,sub])=>`<li><button type="button" class="cursor-interaction" data-action="${key}" ${state.screen===key?'aria-current="location"':''}>${label}<small>${sub}</small></button></li>`).join('')}<li>${state.accepted?`<button type="button" class="cursor-interaction" data-action="recommend" ${state.screen==='recommend'?'aria-current="location"':''}>${state.route==='investigate'?'Investigation plan':'Intervention preview'}<small>Based on confirmed response</small></button>`:'<p class="ds-nav-note">Intervention recommendations<br><small>After response confirmation</small></p>'}</li></ol><p class="ds-nav-note">Analysis context stays available without re-entering it.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('ds-expanded',state.panel!==null);if(!state.panel)return;let content='',heading='';if(state.panel==='context'){heading='Analysis context';content='<p class="ds-small">Analysis brief · Version 1 · Sample baseline</p><h3>Desired performance</h3><p>Resolve routine complaints independently and escalate cases meeting approved criteria.</p><h3>Current performance</h3><p>Some routine complaints are escalated unnecessarily; some required escalations are missed.</p><h3>Audience and constraints</h3><p>Customer service representatives working on desktop browsers. Subject-matter expert review: 30 minutes weekly, two business days turnaround.</p><h3>Evaluation</h3><p>L3: appropriate routing and use of the guide.</p><p>L4: avoidable escalation rate; baseline and target require confirmation.</p>';}else if(state.panel==='sources'){heading='Sample sources';content='<p>Illustrative excerpts only; no documents have been uploaded.</p><h3>Supervisor notes</h3><p>Routing observations: unnecessary escalations and missed required escalations were described.</p><h3>Escalation procedure</h3><p>Routing criteria: apply the complaint category and escalation criteria to determine the response.</p><p class="ds-small">These sources describe performance and expectations. They do not prove a root cause.</p>';}else{heading='Review guidance';content='<h3>Look beyond learning</h3><p>Consider all six influences and how they interact. A course cannot fix unavailable tools or conflicting targets.</p><h3>Separate evidence from hypotheses</h3><p>Errors do not prove a skill, capacity, or motivation problem. Record what would test the interpretation.</p><h3>Confirm the response</h3><p>Choose learning, a nonlearning response, both, or further investigation. Learning routes require defined, confirmed L2 measures.</p><h3>Keep ownership clear</h3><p>Recommendations involving operational changes remain with the relevant business owner.</p>';}
 panel.innerHTML=`<div class="ds-panel-head"><h2>${heading}</h2>${button('Close','close')}</div>${content}`;}
 function render(){renderNav();main.innerHTML=state.screen==='boxes'?boxView():state.screen==='route'?routeView():state.screen==='recommend'?recommendView():`<h1>Your Design review is paused</h1><p class="ds-description">Your preview keeps the findings, response draft, and review state.</p>${button('Resume Six Boxes review','boxes',true)}`;renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 function invalidate(){state.accepted=false;}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const f=e.target.dataset.field;if(!['finding','reason','l2','dependencies'].includes(f))return;if(f==='finding'){state.findings[state.box]=e.target.value;state.reviewed=state.reviewed.filter(i=>i!==state.box);const check=main.querySelector('[data-field="reviewed"]');if(check)check.checked=false;const boxStatus=main.querySelector(`[data-box-status="${state.box}"]`);if(boxStatus)boxStatus.textContent=state.statuses[state.box]+' · Needs review';}else{state[f]=e.target.value;if(f==='l2'){state.l2Confirmed=false;main.querySelector('[data-field="l2Confirmed"]').checked=false;}}invalidate();renderNav();queue();});
 root.addEventListener('change',e=>{const t=e.target,f=t.dataset.field;if(t.name==='ds-route'){state.route=t.value;state.l2Confirmed=false;invalidate();error='';render();save();main.querySelector(`input[value="${state.route}"]`)?.focus();return;}if(f==='reviewed'){state.reviewed=state.reviewed.filter(i=>i!==state.box);if(t.checked)state.reviewed.push(state.box);}else if(f==='status'){state.statuses[state.box]=t.value;state.reviewed=state.reviewed.filter(i=>i!==state.box);}else if(f==='l2Confirmed'){state.l2Confirmed=t.checked;}else return;invalidate();renderNav();if(f==='status'||f==='reviewed'){const i=state.box;render();main.querySelector(`[data-field="${f}"]`)?.focus();announce(`${boxes[i].name}: ${state.reviewed.includes(i)?'Reviewed':'Needs review'}`);}save();});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(state.panel===x.dataset.panel)));save();return;}if(b.dataset.box!==undefined){clearTimeout(timer);state.box=Number(b.dataset.box);render();save();main.querySelector(`[data-box="${state.box}"]`)?.focus();announce(boxes[state.box].name+' selected');return;}const a=b.dataset.action;if(!a)return;if(a==='close'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='confirm'){error=!state.route?'Choose a response before confirming.':!state.reason.trim()?'Add a decision rationale and supporting evidence.':(state.route==='learning'||state.route==='both')&&(!state.l2.trim()||!state.l2Confirmed)?'Define and confirm the L2 measure before instructional Design proceeds.':state.route==='both'&&!state.dependencies.trim()?'Record the nonlearning actions and dependencies.':'';if(error){render();const target=!state.route?'input[name="ds-route"]':!state.reason.trim()?'[data-field="reason"]':!state.l2Confirmed?'[data-field="l2"]':'[data-field="dependencies"]';main.querySelector(target)?.focus();return;}state.accepted=true;state.screen='recommend';announce('Response confirmed in this preview.');}else if(a==='pause'){state.screen='paused';state.panel=null;}else if(['boxes','route','recommend'].includes(a)){state.screen=a;error='';}render();save();focusFirst();});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
