<div class="viz-carousel" aria-label="Development sample examples">
 <section data-variant="Written aid" aria-label="Written aid sample workspace"><div id="aipid-dev-aid" class="dv-app"></div></section>
 <section data-variant="Storyline" aria-label="Storyline sample workspace" hidden><div id="aipid-dev-storyline" class="dv-app"></div></section>
 <section data-variant="Rise" aria-label="Rise sample workspace" hidden><div id="aipid-dev-rise" class="dv-app"></div></section>
</div>
<style>
 .dv-app{color-scheme:light dark;--dv-bg:light-dark(#f5f5f4,#171717);--dv-paper:light-dark(#fff,#222);--dv-ink:light-dark(#242424,#f2f2f0);--dv-soft:light-dark(#565656,#bdbdb9);--dv-line:light-dark(#d4d4d0,#50504c);--dv-inset:light-dark(#eeeee9,#30302d);--dv-button:light-dark(#30302d,#eeeeea);--dv-on:light-dark(#fff,#242424);background:var(--dv-bg);color:var(--dv-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:1250px}
 .dv-app *{box-sizing:border-box}.dv-app [hidden]{display:none!important}.dv-app b{font-weight:500}.dv-app p{margin:0;overflow-wrap:anywhere}.dv-app h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}.dv-app h2{font-size:18px;font-weight:500;margin:0 0 14px}.dv-app h3{font-size:15px;font-weight:500;margin:0 0 8px}
 .dv-app .dv-chrome{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 112px 22px 28px;background:var(--dv-paper);border-bottom:1px solid var(--dv-line)}.dv-app .dv-brand{font-weight:500;display:flex;gap:10px;align-items:center}.dv-app .dv-brand svg{width:20px;height:20px}.dv-app .dv-demo{margin-left:auto}.dv-app .dv-small{font-size:12px;color:var(--dv-soft)}
 .dv-app .dv-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--dv-paper);border-bottom:1px solid var(--dv-line)}.dv-app .dv-project p{font-weight:500}.dv-app .dv-stages{list-style:none;display:flex;gap:18px;flex-wrap:wrap;padding:0;margin:0;font-size:13px;color:var(--dv-soft)}.dv-app [aria-current="step"]{font-weight:500;color:var(--dv-ink);text-decoration:underline;text-underline-offset:6px}
 .dv-app .dv-shell{display:grid;grid-template-columns:210px minmax(0,1fr)}.dv-app .dv-shell.dv-context-open{grid-template-columns:210px minmax(0,1fr) 225px}.dv-app .dv-nav{padding:25px 14px;border-right:1px solid var(--dv-line);min-width:0}.dv-app .dv-nav h2{font-size:15px;margin:0 10px 16px}.dv-app .dv-nav ol{list-style:none;display:grid;gap:6px;margin:0;padding:0}.dv-app .dv-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--dv-ink);padding:11px 10px;min-height:44px;font:inherit;font-size:13px}.dv-app .dv-nav button[aria-current="location"]{background:var(--dv-inset);border-color:var(--dv-line)}.dv-app .dv-nav small{display:block;color:var(--dv-soft);font-size:12px;margin-top:4px}.dv-app .dv-nav-note{margin:22px 10px 0;font-size:12px;color:var(--dv-soft)}
 .dv-app .dv-main{min-width:0;padding:28px;background:var(--dv-paper)}.dv-app .dv-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.dv-app .dv-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.dv-app .dv-button{min-height:44px;max-width:100%;padding:9px 12px;border:1px solid var(--dv-line);border-radius:6px;background:var(--dv-paper);color:var(--dv-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.dv-app .dv-primary{background:var(--dv-button);color:var(--dv-on);border-color:var(--dv-button)}.dv-app .dv-button:disabled{opacity:.55}.dv-app .dv-intro{color:var(--dv-soft);margin-bottom:20px}.dv-app .dv-notice{background:var(--dv-inset);padding:16px;border-radius:6px;margin:18px 0}.dv-app .dv-notice p+p{margin-top:10px}.dv-app .dv-label{font-weight:500;display:block;margin-bottom:7px}.dv-app .dv-field{margin:20px 0}.dv-app input[type="text"],.dv-app textarea,.dv-app select{font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:100%;min-height:44px;padding:10px;border:1px solid var(--dv-line);border-radius:5px;background:var(--dv-paper);color:var(--dv-ink)}.dv-app textarea{resize:vertical;min-height:110px}.dv-app .dv-field small{display:block;color:var(--dv-soft);font-size:12px;margin-top:6px}.dv-app .dv-heading{margin-top:28px;padding-top:22px;border-top:1px solid var(--dv-line)}.dv-app .dv-actions{margin-top:24px}.dv-app .dv-status{margin-top:12px;color:var(--dv-soft);font-size:13px}.dv-app .dv-panel{min-width:0;padding:24px 18px;border-left:1px solid var(--dv-line);background:var(--dv-bg);font-size:13px}.dv-app .dv-panel p+p{margin-top:14px}.dv-app .dv-panel ul,.dv-app .dv-notice ul{padding-left:20px}.dv-app .dv-check{display:flex;gap:10px;align-items:flex-start;padding:12px 0}.dv-app input[type="checkbox"]{width:20px;height:20px;margin-top:2px;flex-shrink:0}.dv-app .dv-footer{padding:17px 28px;border-top:1px solid var(--dv-line);font-size:12px;color:var(--dv-soft)}.dv-app .dv-formbox{margin-top:24px;padding:20px;border:1px solid var(--dv-line);border-radius:6px}.dv-app .dv-kicker{font-size:12px;color:var(--dv-soft);margin-bottom:8px}
 @media(max-width:960px){.dv-app .dv-shell.dv-context-open{grid-template-columns:210px minmax(0,1fr)}.dv-app .dv-panel{grid-column:2;border-left:0;border-top:1px solid var(--dv-line)}}
 @media(max-width:650px){.dv-app{min-height:1550px}.dv-app .dv-shell,.dv-app .dv-shell.dv-context-open{grid-template-columns:minmax(0,1fr)}.dv-app .dv-nav{border-right:0;border-bottom:1px solid var(--dv-line)}.dv-app .dv-nav ol{grid-template-columns:repeat(2,minmax(0,1fr))}.dv-app .dv-panel{grid-column:1}.dv-app .dv-main{padding:22px 18px}.dv-app .dv-chrome{padding-left:18px}.dv-app .dv-project{padding:17px 18px}}
</style>
<script>
(()=>{
 const configs={
  aid:{name:'Written job aid / performance-support draft',group:'Complaint routing aid',unit:'Section',outline:['Purpose and when to use','Check required information','Identify complaint category','Choose the escalation route','Before you send','Where to get help'],title:'Check required information',fields:[['text','Exact written content','Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]\n[What to do when details are missing — approved source needed]'],['build','Layout and use instructions','Use a short checklist with clear headings. Keep essential instructions in text. Provide a usable reading order; do not rely on color alone to communicate a missing item.'],['asset','Asset and accessibility specifications','Text-first draft. No image is required for this section. Confirm final document reading order, heading structure, and accessible checklist labels.']]},
  storyline:{name:'Detailed e-learning storyboard · Storyline',group:'Scene 1 · Complaint routing',unit:'Screen',outline:['Purpose and task','Check required information','Recognize the category','Practice identifying the category','Choose a route','Integrated assessment','Transfer to work'],title:'Check required information',fields:[['text','On-screen learner text','Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]'],['script','Written narration script (optional)','No narration proposed for this sample. Keep all essential information available on screen.'],['build','Interaction, states, layers, and trigger requirements','Proposed treatment: a text checklist on one screen. No additional states or layers required for this section. Use an explicitly labeled Continue control to move to the next screen; confirm navigation requirements during tool feasibility review.'],['asset','Asset and accessibility specifications','No generated media. Use native text rather than an image of text. Specify a logical focus order, descriptive control names, and an equivalent reading order. Final authoring-tool feasibility remains to be checked.']]},
  rise:{name:'Detailed e-learning storyboard · Rise',group:'Lesson 1 · Complaint routing',unit:'Block group',outline:['Purpose and task','Check required information','Recognize the category','Practice identifying the category','Choose a route','Integrated assessment','Transfer to work'],title:'Check required information',fields:[['text','Learner-facing text','Before choosing a route, check the information available in the complaint.\n\n[Required details — approved source needed]'],['blocks','Block order and proposed block types','1. Heading: Check required information\n2. Text: Brief instruction\n3. Text/list: [Approved checklist details needed]\nNo knowledge-check block is proposed in this sample section.'],['build','Build and navigation instructions','Keep this checklist within the selected lesson. Use clear headings and a simple reading order. Confirm block availability and lesson navigation during tool feasibility review.'],['asset','Asset and accessibility specifications','Text-first treatment with no generated media. Do not place essential instructions only in imagery or hover content. Check headings, links, and keyboard access in the authored course.']]}
 };
 const roots={},states={};let saveTimer;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const button=(action,label,primary=false)=>`<button type="button" class="dv-button cursor-interaction${primary?' dv-primary':''}" data-action="${action}">${label}</button>`;
 function initial(k){return{selected:1,fields:Object.fromEntries(configs[k].fields.map(f=>[f[0],f[2]])),accepted:false,request:null,panel:'',view:'sample',requestDraft:{scope:'section',tone:'Plain and direct',detail:'Keep current detail',structure:'Keep current structure',depth:'Keep current build detail',text:''}};}
 function restore(raw){const saved=raw?.privateContent?.developmentSamples;if(!saved||saved.schema!==1)return;for(const k of Object.keys(configs)){const v=saved[k];if(!v)continue;const s=initial(k);s.selected=Number.isInteger(v.selected)&&v.selected>=0&&v.selected<configs[k].outline.length?v.selected:1;for(const f of configs[k].fields)if(typeof v.fields?.[f[0]]==='string')s.fields[f[0]]=v.fields[f[0]].slice(0,750);s.accepted=v.accepted===true;s.request=v.request&&typeof v.request.scope==='string'?{scope:v.request.scope.slice(0,30),text:String(v.request.text||'').slice(0,700),tone:String(v.request.tone||'').slice(0,40),detail:String(v.request.detail||'').slice(0,40),structure:String(v.request.structure||'').slice(0,40),depth:String(v.request.depth||'').slice(0,40)}:null;states[k]=s;}}
 function persist(){const samples={schema:1},visible={};for(const k of Object.keys(configs)){const s=states[k];samples[k]={selected:s.selected,fields:s.fields,accepted:s.accepted,request:s.request};visible[k]={selectedSection:s.selected+1,sampleAccepted:s.accepted,revisionRequested:!!s.request,sourceStatus:'approved-source-missing'};}const snapshot={modelContent:{developmentSampleReview:visible},privateContent:{developmentSamples:samples}};if(new Blob([JSON.stringify(snapshot)]).size>16000)return;try{if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState(snapshot)).catch(()=>{});}catch{}}
 function notice(k,text){roots[k].querySelector('.dv-live').textContent=text;}
 function render(k){const c=configs[k],s=states[k],root=roots[k];root.innerHTML=`
  <header class="dv-chrome"><span class="dv-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="dv-small dv-demo">Wireframe · Sample data</span></header>
  <div class="dv-project"><div><span class="dv-small">Project</span><p>Customer complaint escalation</p></div><ol class="dv-stages" aria-label="Project stages"><li>Analysis</li><li>Design</li><li aria-current="step">Development</li></ol></div>
  <div class="dv-shell${s.panel?' dv-context-open':''}"><nav class="dv-nav" aria-label="${esc(c.name)} outline"><h2>Full outline</h2><p class="dv-small" style="margin:0 10px 14px">${esc(c.group)}</p><ol>${c.outline.map((x,i)=>`<li><button class="cursor-interaction" type="button" data-section="${i}"${s.selected===i?' aria-current="location"':''}>${i+1}. ${esc(x)}<small>${i===1?(s.accepted?'Sample accepted · sources pending':'Sample draft'):'Outline only'}</small></button></li>`).join('')}</ol><p class="dv-nav-note">Design baseline · revision 1<br>Stable section and record links carry forward. Other sections remain outlines.</p></nav>
  <main class="dv-main"><div class="dv-top"><span class="dv-small">${esc(c.name)}</span><div class="dv-row">${button('sources','Sources & links')}${button('guidance','Guidance')}</div></div>
  <p class="dv-kicker">Development sample · ${esc(c.unit)} ${s.selected+1}</p><h1>${esc(c.outline[s.selected])}</h1><p class="dv-intro">${s.selected===1?'Review the sample’s wording, structure, and instructions before extending the treatment to the remaining outline.':'This section has an outline only. Full drafting will use its own linked Design content.'}</p>
  <div class="dv-notice"><h3>Structure sample · factual content pending</h3><p>Approved complaint-handling procedures are missing. Bracketed placeholders must remain visible. Sample acceptance does not verify facts or approve a final deliverable.</p></div>
  ${s.selected===1?sample(k):outline(k)}
  ${s.view==='request'?requestForm(k):''}${s.view==='readiness'?readiness(k):''}
  </main><aside class="dv-panel" aria-label="Contextual information"${s.panel?'':' hidden'}>${panel(k)}</aside></div>
  <footer class="dv-footer">Illustrative preview · No live saving, sharing, or AI connection<p class="dv-live" role="status" aria-live="polite"></p></footer>`;
  root.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{s.selected=Number(b.dataset.section);s.view='sample';render(k);persist();}));
  root.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{s.fields[el.dataset.field]=el.value.slice(0,750);s.accepted=false;root.querySelector('[data-sample-status]').textContent='Sample edited · acceptance needed';const accept=root.querySelector('[data-action="accept"]');if(accept)accept.textContent='Accept sample';root.querySelector('.dv-nav button[data-section="1"] small').textContent='Sample draft';notice(k,'Edits held in this preview · no server save');clearTimeout(saveTimer);saveTimer=setTimeout(persist,600);}));
  root.querySelectorAll('[data-request-field]').forEach(el=>el.addEventListener('input',()=>{s.requestDraft[el.dataset.requestField]=el.value;}));
  root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(k,b.dataset.action)));
  try{globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}catch{}
 }
 function sample(k){const c=configs[k],s=states[k];return `<p class="dv-small">${k==='aid'?'Section':'Screen/block group'} ID: ${k.toUpperCase()}-02 · EO-1.1 · Understand; LO-1 · Apply</p><h2 class="dv-heading">${k==='aid'?'Written content and production notes':'Storyboard content and build specifications'}</h2>${c.fields.map(f=>`<div class="dv-field"><label class="dv-label" for="${k}-${f[0]}">${esc(f[1])}</label><textarea id="${k}-${f[0]}" data-field="${f[0]}" maxlength="750" rows="${f[0]==='text'?5:3}">${esc(s.fields[f[0]])}</textarea></div>`).join('')}<div class="dv-notice"><h3>Assessment links carried from Design</h3><p>No assessment is placed in this information section. It prepares for <b>Assessment 1 — Route a damaged-item complaint</b>. Its reviewed task, answer, scoring, and feedback remain in the linked Design record; do not rewrite them here.</p></div><div class="dv-row dv-actions">${button('accept',s.accepted?'Sample accepted':'Accept sample',true)}${button('request','Request changes')}${button('full','Generate full draft')}</div><p class="dv-status" data-sample-status>${s.accepted?'Sample treatment accepted · source gaps remain':'Edits are held in this preview · sample not accepted'}</p><p class="dv-small">Accepting this sample preserves these edits as the treatment baseline. Newly generated sections will still need review.</p>${s.request?`<div class="dv-notice"><h3>Saved revision request · not sent</h3><p>${esc(scopeLabel(s.request.scope))} · ${esc(s.request.tone)} · ${esc(s.request.detail)} · ${esc(s.request.structure)} · ${esc(s.request.depth)}</p><p>${esc(s.request.text||'No additional instructions.')}</p><p class="dv-small">${s.request.scope==='design'?'Affected Design records need explicit review before downstream changes.':'This request has not changed the sample or linked Design records.'}</p></div>`:''}`;}
 function outline(k){const c=configs[k],s=states[k];return `<div class="dv-formbox"><h2>${esc(c.unit)} ${s.selected+1} · outline only</h2><p>Purpose: ${esc(c.outline[s.selected])}.</p><p class="dv-status">Learner text and build specifications have not been drafted. Opening this section does not trigger generation.</p>${button('return-sample','Return to sample')}</div>`;}
 const scopeLabel=s=>({section:'Selected sample section',style:'Shared writing style / template',design:'Linked Design records'}[s]||'Selected sample section');
 function requestForm(k){const s=states[k],d=s.requestDraft;const select=(key,label,values)=>`<div class="dv-field"><label class="dv-label" for="${k}-req-${key}">${label}</label><select id="${k}-req-${key}" data-request-field="${key}">${values.map(v=>{const value=Array.isArray(v)?v[0]:v,label=Array.isArray(v)?v[1]:v;return `<option value="${esc(value)}"${d[key]===value?' selected':''}>${esc(label)}</option>`;}).join('')}</select></div>`;return `<section class="dv-formbox" aria-label="Request sample changes"><h2>Request changes</h2>${select('scope','What should this request affect?',[['section','Selected sample section'],['style','Shared writing style / template'],['design','Linked Design records']])}${select('tone','Writing style',['Plain and direct','Conversational','Formal'])}${select('detail','Content detail',['Keep current detail','More concise','More explanation'])}${select('structure','Structure',['Keep current structure','Shorter grouped steps','More explicit step sequence'])}${select('depth','Build-instruction depth',['Keep current build detail','More implementation detail','Less implementation detail'])}<div class="dv-field"><label class="dv-label" for="${k}-req-text">What would you like to change?</label><textarea id="${k}-req-text" data-request-field="text" maxlength="700" rows="3">${esc(d.text)}</textarea></div><p class="dv-small">Changes to objectives, assessment answers/scoring, evidence, tool allocation, or solution scope return to Design review. Style preferences cannot override approved facts.</p><div class="dv-row dv-actions">${button('save-request','Save revision request',true)}${button('cancel','Cancel')}</div><p class="dv-small">Preview only: saves the request locally; it does not call AI or alter the draft.</p></section>`;}
 function readiness(k){const s=states[k];return `<section class="dv-formbox" aria-label="Full draft readiness"><h2>Before full drafting</h2><ul><li>Sample treatment: ${s.accepted?'accepted':'review and acceptance needed'}.</li><li>Approved source details: missing.</li><li>Assessment answer verification and routing-practice gap: unresolved in Design.</li></ul><p>Full factual drafting is on hold. Return to the linked Design records to resolve essential gaps. Your sample edits stay intact.</p><p class="dv-status">When ready, generation will fill the remaining outline using each section’s own content and preserve accepted sample edits. All new sections start as drafts.</p><div class="dv-row dv-actions">${button('design','Review Design issues')}${button('cancel','Back to sample')}</div></section>`;}
 function panel(k){const p=states[k].panel;if(!p)return '';if(p==='guidance')return `<h2>Sample review</h2><p>Check whether the treatment fits the intended task and audience.</p><ul><li>Is learner-facing content separate from production notes?</li><li>Are instructions clear and accessible?</li><li>Is the level of detail sufficient to build or produce this output?</li><li>Are placeholders and source gaps visible?</li></ul><p>Tool examples demonstrate different output structures. Authoring-tool choice remains a Design decision.</p>${button('close-panel','Close guidance')}`;return `<h2>${p==='issues'?'Design issues':'Sources & links'}</h2><p><b>EO-1.1</b><br>Identify the complaint details needed to apply the routing criteria.<br>Proposed Bloom level: Understand.</p><p><b>Source gap</b><br>Required details and missing-information handling need an approved procedure. Fictional example documents are not verified organizational evidence.</p><p><b>Assessment 1</b><br>Route a damaged-item complaint. Answer verification remains pending.</p><p><b>Practice gap</b><br>Routing practice is not yet defined. Resolve in the linked assessment plan.</p><p class="dv-small">Record IDs and revision 1 are carried into this example. This preview does not navigate to a live Design record.</p>${button('close-panel','Close panel')}`;}
 function act(k,a){const s=states[k];if(a==='sources'||a==='guidance'){s.panel=s.panel===a?'':a;}else if(a==='close-panel'){s.panel='';}else if(a==='accept'){s.accepted=true;s.view='sample';}else if(a==='request'){s.view='request';}else if(a==='save-request'){s.request={...s.requestDraft};s.view='sample';}else if(a==='full'){s.view='readiness';}else if(a==='design'){s.panel='issues';}else if(a==='cancel'){s.view='sample';}else if(a==='return-sample'){s.selected=1;s.view='sample';}render(k);persist();if(a==='accept')notice(k,'Sample treatment accepted. Missing source facts remain unresolved.');if(a==='save-request')notice(k,'Revision request saved in this preview. No AI request sent.');if(a==='full'||a==='request'){const section=roots[k].querySelector('.dv-formbox');section?.scrollIntoView({block:'nearest',behavior:'auto'});}}
 for(const k of Object.keys(configs)){roots[k]=document.getElementById('aipid-dev-'+k);states[k]=initial(k);}restore(window.openai?.widgetState);for(const k of Object.keys(configs))render(k);
 window.addEventListener('openai:set_globals',e=>{if(roots.aid.parentElement.parentElement.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;const raw=e.detail?.globals?.widgetState;if(raw?.privateContent?.developmentSamples){restore(raw);for(const k of Object.keys(configs))render(k);}});
})();
</script>
