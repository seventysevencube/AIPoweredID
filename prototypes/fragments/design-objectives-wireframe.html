<div id="aipid-objectives-wireframe" aria-label="Learning objectives and enabling objectives wireframe">
 <header class="ob-chrome"><span class="ob-brand"><i data-lucide="notebook-pen" aria-hidden="true"></i>AIPoweredID</span><span class="ob-small ob-demo">Wireframe · Sample data</span></header>
 <div class="ob-project"><div><span class="ob-small">Project</span><p>Customer complaint escalation</p></div><ol aria-label="Project stages"><li>Analysis</li><li aria-current="step">Design</li><li>Development</li></ol></div>
 <div class="ob-shell"><nav class="ob-nav" aria-label="Objective hierarchy"></nav><main class="ob-main" aria-label="Objective review workspace"></main><aside class="ob-panel" id="ob-context" aria-label="Contextual guidance" hidden></aside></div>
 <footer class="ob-footer">Illustrative preview · No live saving, sharing, or AI connection<span class="ob-live" role="status" aria-live="polite"></span></footer>
</div>
<style>
 #aipid-objectives-wireframe{color-scheme:light dark;--ob-bg:light-dark(#f5f5f4,#171717);--ob-paper:light-dark(#fff,#222);--ob-ink:light-dark(#242424,#f2f2f0);--ob-soft:light-dark(#565656,#bdbdb9);--ob-line:light-dark(#d4d4d0,#50504c);--ob-inset:light-dark(#eeeee9,#30302d);--ob-button:light-dark(#30302d,#eeeeea);--ob-button-text:light-dark(#fff,#242424);background:var(--ob-bg);color:var(--ob-ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-objectives-wireframe *{box-sizing:border-box}
 #aipid-objectives-wireframe [hidden]{display:none!important}
 #aipid-objectives-wireframe p{margin:0}
 #aipid-objectives-wireframe .ob-chrome{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:22px 112px 22px 28px;background:var(--ob-paper);border-bottom:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-brand{display:flex;align-items:center;gap:10px;font-weight:500}
 #aipid-objectives-wireframe .ob-brand svg{width:20px;height:20px}
 #aipid-objectives-wireframe .ob-demo{margin-left:auto}
 #aipid-objectives-wireframe .ob-small{font-size:12px;color:var(--ob-soft)}
 #aipid-objectives-wireframe .ob-project{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:17px 28px;background:var(--ob-paper);border-bottom:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-project p{font-weight:500}
 #aipid-objectives-wireframe .ob-project ol{list-style:none;display:flex;gap:18px;flex-wrap:wrap;margin:0;padding:0;color:var(--ob-soft);font-size:13px}
 #aipid-objectives-wireframe [aria-current="step"]{color:var(--ob-ink);font-weight:500;text-decoration:underline;text-underline-offset:6px}
 #aipid-objectives-wireframe .ob-shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
 #aipid-objectives-wireframe .ob-shell.ob-expanded{grid-template-columns:200px minmax(0,1fr) 240px}
 #aipid-objectives-wireframe .ob-nav{padding:25px 14px;border-right:1px solid var(--ob-line);min-width:0}
 #aipid-objectives-wireframe .ob-nav h2{font-size:15px;margin:0 10px 16px}
 #aipid-objectives-wireframe .ob-nav ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
 #aipid-objectives-wireframe .ob-nav button{width:100%;text-align:left;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ob-ink);padding:11px 10px;font:inherit;font-size:13px;overflow-wrap:anywhere}
 #aipid-objectives-wireframe .ob-nav button[aria-current="location"]{background:var(--ob-inset);border-color:var(--ob-line)}
 #aipid-objectives-wireframe .ob-nav small{display:block;font-size:12px;color:var(--ob-soft);margin-top:4px}
 #aipid-objectives-wireframe .ob-child{margin-left:12px;border-left:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-nav-note{margin:24px 10px 0;font-size:12px;color:var(--ob-soft)}
 #aipid-objectives-wireframe .ob-main{min-width:0;padding:28px;background:var(--ob-paper)}
 #aipid-objectives-wireframe h1{font-size:24px;line-height:1.35;font-weight:500;margin:0 0 10px}
 #aipid-objectives-wireframe h2{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
 #aipid-objectives-wireframe h3{font-size:15px;font-weight:500;margin:0 0 8px}
 #aipid-objectives-wireframe .ob-description{color:var(--ob-soft);margin-bottom:22px}
 #aipid-objectives-wireframe .ob-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
 #aipid-objectives-wireframe .ob-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
 #aipid-objectives-wireframe .ob-top{margin-bottom:20px}
 #aipid-objectives-wireframe .ob-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--ob-line);border-radius:6px;color:var(--ob-ink);background:var(--ob-paper);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
 #aipid-objectives-wireframe .ob-primary{background:var(--ob-button);color:var(--ob-button-text);border-color:var(--ob-button)}
 #aipid-objectives-wireframe .ob-tag{display:inline-block;font-size:12px;padding:4px 8px;background:var(--ob-inset);border-radius:4px}
 #aipid-objectives-wireframe .ob-label{display:block;font-size:13px;font-weight:500;margin:20px 0 6px}
 #aipid-objectives-wireframe .ob-field{width:100%;max-width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--ob-line);border-radius:5px;color:var(--ob-ink);background:var(--ob-paper);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 #aipid-objectives-wireframe textarea{display:block;resize:vertical}
 #aipid-objectives-wireframe .ob-readout{background:var(--ob-inset);border-radius:6px;padding:17px;margin:20px 0}
 #aipid-objectives-wireframe .ob-readout p+p{margin-top:12px}
 #aipid-objectives-wireframe .ob-readout .ob-label{margin-top:0}
 #aipid-objectives-wireframe .ob-help{margin-top:14px}
 #aipid-objectives-wireframe summary{min-height:44px;padding:10px 0;font-size:13px;font-weight:500}
 #aipid-objectives-wireframe .ob-help p{font-size:13px;color:var(--ob-soft);margin:8px 0}
 #aipid-objectives-wireframe .ob-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-footnote{font-size:12px;color:var(--ob-soft);margin-top:13px}
 #aipid-objectives-wireframe .ob-coverage{margin-top:20px;padding-top:20px;border-top:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-coverage p{margin-top:8px;white-space:pre-line;overflow-wrap:anywhere}
 #aipid-objectives-wireframe .ob-panel{min-width:0;padding:25px 19px;border-left:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
 #aipid-objectives-wireframe .ob-panel-head h2{margin:0}
 #aipid-objectives-wireframe .ob-panel p{font-size:13px;margin:12px 0}
 #aipid-objectives-wireframe .ob-panel h3{margin-top:20px}
 #aipid-objectives-wireframe .ob-error{font-weight:500;margin-top:16px}
 #aipid-objectives-wireframe .ob-footer{font-size:12px;color:var(--ob-soft);padding:15px 28px;border-top:1px solid var(--ob-line)}
 #aipid-objectives-wireframe .ob-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 @media(max-width:960px){#aipid-objectives-wireframe .ob-shell.ob-expanded{grid-template-columns:180px minmax(0,1fr)}#aipid-objectives-wireframe .ob-expanded .ob-panel{grid-column:2;border-left:0;border-top:1px solid var(--ob-line)}#aipid-objectives-wireframe .ob-expanded .ob-nav{grid-row:1/3}}
 @media(max-width:650px){#aipid-objectives-wireframe .ob-shell,#aipid-objectives-wireframe .ob-shell.ob-expanded{grid-template-columns:minmax(0,1fr)}#aipid-objectives-wireframe .ob-expanded .ob-nav{grid-row:auto}#aipid-objectives-wireframe .ob-expanded .ob-panel{grid-column:1}#aipid-objectives-wireframe .ob-nav{padding:20px 18px;border-right:0;border-bottom:1px solid var(--ob-line)}#aipid-objectives-wireframe .ob-main{padding:24px 18px}#aipid-objectives-wireframe .ob-project,#aipid-objectives-wireframe .ob-footer{padding-left:18px;padding-right:18px}#aipid-objectives-wireframe .ob-chrome{padding-left:18px;padding-right:100px}#aipid-objectives-wireframe .ob-demo{margin-left:0}}
</style>
<script>
(()=>{
 const root=document.getElementById('aipid-objectives-wireframe'),main=root.querySelector('.ob-main'),nav=root.querySelector('.ob-nav'),panel=root.querySelector('.ob-panel'),shell=root.querySelector('.ob-shell');
 const levels=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
 const state={view:'objective',active:'LO-1',panel:null,nextId:4,confirmed:false,lastRemoved:null,parent:{id:'LO-1',short:'Make routing decisions',statement:'Select the appropriate complaint response and routing path, and explain the decision using the applicable criteria.',conditions:'Given representative complaint cases and the approved escalation guide.',criteria:'All critical routing decisions are correct; explanations identify the applicable criteria.',level:'Apply',reviewed:false},children:[
 {id:'EO-1.1',short:'Find the relevant information',statement:'Identify the complaint details needed to apply the routing criteria.',level:'Understand',contribution:'Recognize what information the main routing decision depends on.',content:'Complaint details required by the current procedure; examples of relevant and missing information.',support:'An annotated case showing which details are needed and why.',reviewed:false},
 {id:'EO-1.2',short:'Classify the complaint',statement:'Classify a complaint using the categories and examples in the approved guide, explaining the category match.',level:'Understand',contribution:'Connect case details to the category needed for the routing decision.',content:'Approved complaint categories, defining characteristics, and representative examples.',support:'Worked category examples followed by a guided comparison.',reviewed:false},
 {id:'EO-1.3',short:'Apply the routing criteria',statement:'Use the applicable criteria to choose a response and routing path, explaining how the case meets those criteria.',level:'Apply',contribution:'Perform the routing decision and explanation required by the main objective.',content:'Routing criteria, escalation conditions, and the required response paths.',support:'A decision guide plus case-based practice and explanatory feedback.',reviewed:false}
 ]};
 let timer,error='',removePending=false;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(text,action,primary=false)=>`<button type="button" class="ob-button ${primary?'ob-primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
 const record=()=>state.active==='LO-1'?state.parent:state.children.find(x=>x.id===state.active)||state.parent;
 const remaining=()=>[state.parent,...state.children].filter(x=>!x.reviewed).length;
 function persist(){if(typeof window.openai?.setWidgetState!=='function')return false;const payload={modelContent:{screen:'Learning objectives hierarchy wireframe',view:state.view,activeObjective:state.active,mainBloom:state.parent.level,enablingObjectiveCount:state.children.length,reviewedIds:[state.parent,...state.children].filter(x=>x.reviewed).map(x=>x.id),hierarchyConfirmed:state.confirmed},privateContent:{kind:'objectives-v1',...state}};if(new TextEncoder().encode(JSON.stringify(payload)).length>14500)return false;window.openai.setWidgetState(payload).catch(()=>{});return true;}
 function restore(saved){
  const p=saved?.privateContent;if(p?.kind!=='objectives-v1')return;
  const clean=(source,target,keys)=>{for(const k of keys)if(typeof source?.[k]==='string')target[k]=source[k].slice(0,k==='short'?100:250);if(levels.includes(source?.level))target.level=source.level;target.reviewed=source?.reviewed===true;};
  const child=x=>{const target={id:x.id,short:'New enabling objective',statement:'',level:'Apply',contribution:'',content:'',support:'',conditions:'',criteria:'',reviewed:false};clean(x,target,['short','statement','contribution','content','support','conditions','criteria']);return target;};
  clean(p.parent,state.parent,['short','statement','conditions','criteria']);
  if(Array.isArray(p.children)&&p.children.length<=6&&p.children.every(x=>/^EO-1\.[1-9][0-9]{0,3}$/.test(x.id))&&new Set(p.children.map(x=>x.id)).size===p.children.length)state.children=p.children.map(child);
  if(typeof p.active==='string'&&(p.active==='LO-1'||state.children.some(x=>x.id===p.active)))state.active=p.active;
  if(p.lastRemoved?.record&&/^EO-1\.[1-9][0-9]{0,3}$/.test(p.lastRemoved.record.id)&&!state.children.some(x=>x.id===p.lastRemoved.record.id)&&Number.isInteger(p.lastRemoved.index))state.lastRemoved={record:child(p.lastRemoved.record),index:Math.max(0,Math.min(6,p.lastRemoved.index))};
  state.nextId=Math.max(0,...state.children.map(x=>Number(x.id.split('.')[1])),state.lastRemoved?Number(state.lastRemoved.record.id.split('.')[1]):0)+1;
  if(Number.isInteger(p.nextId)&&p.nextId>state.nextId&&p.nextId<10000)state.nextId=p.nextId;
  if(['objective','coverage','next','paused'].includes(p.view))state.view=p.view;
  if([null,'context','guidance'].includes(p.panel))state.panel=p.panel;
  state.confirmed=p.confirmed===true;if(state.view==='next'&&!state.confirmed)state.view='coverage';
 }
 function announce(t){root.querySelector('.ob-live').textContent=t;}
 function save(){clearTimeout(timer);const ok=persist(),el=main.querySelector('[data-save]');if(el)el.textContent=ok?'Preview · Saved':'Preview · Kept in this open view';}
 function schedule(){const el=main.querySelector('[data-save]');if(el)el.textContent='Preview · Saving…';clearTimeout(timer);timer=setTimeout(save,1000);}
 function top(){return `<div class="ob-between ob-top"><span class="ob-small" data-save role="status">Preview · Draft</span><div class="ob-row">${['context','guidance'].map(p=>`<button type="button" class="ob-button cursor-interaction" data-panel="${p}" aria-controls="ob-context" aria-expanded="${state.panel===p}">${p==='context'?'Linked context':'Guidance'}</button>`).join('')}</div></div>`;}
 function field(key,label,rows=2){const r=record();return `<label class="ob-label" for="ob-${key}">${label}</label><textarea class="ob-field" id="ob-${key}" data-field="${key}" maxlength="250" rows="${rows}">${esc(r[key])}</textarea>`;}
 function objectiveView(){
  const r=record(),parent=r.id==='LO-1',index=state.children.findIndex(x=>x.id===r.id);
  return `${top()}<h1>${parent?'Review the main learning objective':'Review enabling objective'}</h1><p class="ob-description">${parent?'Define the complete performance learners should demonstrate.':'Define a smaller performance that contributes to the main objective.'}</p>
  <div class="ob-row"><span class="ob-tag">${r.id}${parent?'':' → LO-1'}</span><span class="ob-small" data-review-status>${r.reviewed?'Reviewed':'AI draft · Needs review'}</span></div>
  ${parent?'<div class="ob-readout"><span class="ob-label">Linked L2 measure · L2-1 · Confirmed sample</span><p>Scenario-based routing tasks with the guide: correct critical decisions and explanations linked to the applicable criteria.</p><p class="ob-small">Deliverable: written job aid / performance-support draft, used for learning.</p></div>':`<div class="ob-readout"><span class="ob-label">Main objective · LO-1</span><p>${esc(state.parent.statement)}</p><p class="ob-small">Conditions and success criteria carry from the main objective unless refined below.</p></div>`}
  <label class="ob-label" for="ob-short">Objective title</label><input class="ob-field" id="ob-short" type="text" maxlength="100" data-field="short" aria-describedby="ob-title-help" value="${esc(r.short)}"><p class="ob-footnote" id="ob-title-help">A brief title shown in the sidebar, such as “Classify the complaint.” The full objective is written below.</p>
  ${field('statement',parent?'What should the learner be able to do?':'What smaller performance supports the main objective?',3)}
  ${parent?field('conditions','Under what conditions, or using which resources?')+field('criteria','What criteria demonstrate successful performance?'):field('contribution','How does this contribute to LO-1?')}
  <label class="ob-label" for="ob-level">Bloom’s level — proposed for review</label><select class="ob-field" id="ob-level" data-field="level">${levels.map(l=>`<option ${r.level===l?'selected':''}>${l}</option>`).join('')}</select>
  <details class="ob-help"><summary class="cursor-interaction">How should I review this Bloom’s level?</summary><p>Review the actual cognitive demand, conditions, and evidence. The verb alone does not determine the level. These sample case decisions propose Apply; identifying and classifying relevant information propose Understand. If you edit an objective, reconsider the level.</p></details>
  <div class="ob-row" style="margin-top:20px">${btn(r.reviewed?'Mark needs review':'Mark reviewed','review')}${!parent?`${index>0?btn('Move earlier','up'):''}${index<state.children.length-1?btn('Move later','down'):''}${btn('Remove objective','remove')}`:''}</div>
  ${removePending?`<div class="ob-readout"><p>Remove ${r.id} from this draft hierarchy? Existing IDs will not be renumbered.</p><div class="ob-row" style="margin-top:12px">${btn('Keep objective','cancel-remove')}${btn('Confirm removal','confirm-remove')}</div></div>`:''}
  ${error?`<p class="ob-error" role="alert">${esc(error)}</p>`:''}
  <div class="ob-actions">${btn('Save and return later','pause')}${btn(parent&&state.children.length?'Review enabling objectives →':index>=0&&index<state.children.length-1?'Next enabling objective →':'Review objective coverage →','next',true)}</div>`;
 }
 function coverageView(){return `${top()}<h1>Review objective coverage</h1><p class="ob-description">Check that the enabling objectives collectively support the main performance.</p>
 <div class="ob-readout"><h2>LO-1 · ${esc(state.parent.short)}</h2><p>${esc(state.parent.statement)}</p><p class="ob-small">${state.parent.level} · ${state.parent.reviewed?'Reviewed':'Needs review'} · Linked to L2-1</p></div>
 ${state.children.length?state.children.map(r=>`<section class="ob-coverage"><div class="ob-between"><h3>${r.id} · ${esc(r.short)}</h3><button type="button" class="ob-button cursor-interaction" data-open="${r.id}">Review</button></div><p>${esc(r.statement)}</p><p class="ob-small">${r.level} · ${r.reviewed?'Reviewed':'Needs review'}</p><p><span class="ob-label">Contribution to LO-1</span>${esc(r.contribution)}</p></section>`).join(''):'<p>No enabling objectives remain. Add the smallest meaningful supporting structure, or record why the main objective is already sufficiently focused.</p>'}
 <div class="ob-row" style="margin-top:20px">${state.children.length<6?btn('Add enabling objective','add'):''}${state.lastRemoved?btn('Undo last removal','undo'):''}</div>
 <div class="ob-readout"><h2>Check the whole performance</h2><p>Look for gaps, unnecessary objectives, and trivial fragments. Three enabling objectives is a sample, not a required count.</p><p>Check observable performance, meaningful contributions, conditions, success criteria, and Bloom’s alignment. The main performance must remain intact as its parts are refined.</p><p class="ob-small">${remaining()?`${remaining()} objective(s) still need review. These flags carry into the next Design step.`:'All current objectives are marked reviewed.'} Assessment planning is next; content and instructional support follow afterward.</p></div>
 ${error?`<p class="ob-error" role="alert">${esc(error)}</p>`:''}<div class="ob-actions"><button type="button" class="ob-button cursor-interaction" data-open="LO-1">Review main objective</button>${btn('Continue to assessments →','confirm',true)}</div>`;}
 function nextView(){return `${top()}<span class="ob-tag">Draft hierarchy selected for the next Design step</span><h1 style="margin-top:18px">Next: assessments</h1><p class="ob-description">Use the main and enabling objectives, Bloom’s levels, conditions, success criteria, and L2 links to define the learning evidence.</p><div class="ob-readout"><h2>Decide how achievement will be demonstrated</h2><p>Define assessment tasks, expected responses or rubrics, feedback, scoring, and retry/remediation rules. Preserve evidence of the integrated main performance; a separate scored item for every enabling objective is not required.</p><p>Then use the objectives and assessment requirements to plan content and instructional support in a separate Design step.</p><p class="ob-small">${remaining()} objective(s) still marked Needs review. Existing content/support notes remain saved for later. This preview ends at the handoff.</p></div>${btn('Return to objective coverage','coverage')}`;}
 function renderNav(){nav.innerHTML=`<h2>Learning objectives</h2><ol><li><button type="button" class="cursor-interaction" data-open="LO-1" ${state.view==='objective'&&state.active==='LO-1'?'aria-current="location"':''}>LO-1 · ${esc(state.parent.short)}<small>${state.parent.reviewed?'Reviewed':'Needs review'}</small></button></li>${state.children.map(r=>`<li class="ob-child"><button type="button" class="cursor-interaction" data-open="${r.id}" ${state.view==='objective'&&state.active===r.id?'aria-current="location"':''}>${r.id} · ${esc(r.short)}<small>${r.reviewed?'Reviewed':'Needs review'}</small></button></li>`).join('')}<li><button type="button" class="cursor-interaction" data-action="coverage" ${state.view==='coverage'?'aria-current="location"':''}>Review coverage<small>Integrated performance and gaps</small></button></li></ol><p class="ob-nav-note">Main and enabling objectives → assessments → content and instructional support → storyboard or aid.</p>`;}
 function renderPanel(){panel.hidden=state.panel===null;shell.classList.toggle('ob-expanded',state.panel!==null);if(!state.panel)return;panel.innerHTML=`<div class="ob-panel-head"><h2>${state.panel==='context'?'Linked context':'Objective guidance'}</h2>${btn('Close','close-panel')}</div>${state.panel==='context'?'<p class="ob-small">Illustrative continuation of the learning-aid branch; no live project data.</p><h3>Performance need</h3><p>Resolve routine complaints independently and escalate cases meeting the approved criteria.</p><h3>Learning measure</h3><p>L2-1: correct routing decisions with explanations linked to the criteria. All critical decisions correct.</p><h3>Intended output</h3><p>Written job aid / performance-support draft used for learning. A solely nonlearning aid instead uses task/performance requirements.</p><h3>Source status</h3><p>Sample procedure references the criteria; exact content and case answers still require source mapping and subject-matter expert confirmation.</p><h3>Open evidence gap</h3><p>The skill-gap hypothesis and guide usability still need verification.</p>':'<h3>Use observable performance</h3><p>State what learners do, under which conditions, and what acceptable performance looks like.</p><h3>Use Bloom’s thoughtfully</h3><p>Remember, Understand, Apply, Analyze, Evaluate, Create. Select the level needed for the task; higher is not automatically better.</p><h3>Break down meaningfully</h3><p>Identify prerequisite knowledge, skills, and decisions. Avoid arbitrary counts or forcing every enabling objective to a lower level.</p><h3>Keep evidence aligned</h3><p>Recall alone cannot demonstrate application. Check the integrated main objective as well as its parts.</p><h3>Keep accepted criteria</h3><p>Changes affecting L2 or later assessment records need linked review; do not silently revise those records.</p>'}`;}
 function render(){renderNav();main.innerHTML=state.view==='objective'?objectiveView():state.view==='coverage'?coverageView():state.view==='next'?nextView():`<h1>Your objective review is paused</h1><p class="ob-description">Your draft objective hierarchy and review state remain in this preview.</p>${btn('Resume objective review','resume',true)}`;if(state.view==='objective'&&record().id!=='LO-1')main.querySelector('.ob-help').insertAdjacentHTML('beforebegin',`<details class="ob-help"><summary class="cursor-interaction">Refine conditions and success criteria</summary><p>Leave blank to use the main objective’s conditions and criteria. Record meaningful differences here.</p>${field('conditions','Specific conditions or resources')}${field('criteria','Specific success criteria')}</details>`);renderPanel();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function focusFirst(){main.querySelector('button')?.focus();}
 restore(window.openai?.widgetState);render();
 root.addEventListener('input',e=>{const k=e.target.dataset.field;if(!['short','statement','conditions','criteria','contribution'].includes(k))return;const r=record();r[k]=e.target.value;r.reviewed=false;state.confirmed=false;const status=main.querySelector('[data-review-status]');if(status)status.textContent='Needs review after edits';const review=main.querySelector('[data-action="review"]');if(review)review.textContent='Mark reviewed';renderNav();schedule();});
 root.addEventListener('change',e=>{if(e.target.dataset.field!=='level')return;record().level=e.target.value;record().reviewed=false;state.confirmed=false;render();save();main.querySelector('[data-field="level"]')?.focus();});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearTimeout(timer);if(b.dataset.panel){state.panel=state.panel===b.dataset.panel?null:b.dataset.panel;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded',String(x.dataset.panel===state.panel)));save();return;}if(b.dataset.open){state.active=b.dataset.open;state.view='objective';removePending=false;error='';render();save();focusFirst();return;}const a=b.dataset.action;if(!a)return;error='';const r=record(),i=state.children.findIndex(x=>x.id===r.id);if(a==='close-panel'){state.panel=null;renderPanel();main.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-expanded','false'));main.querySelector('[data-panel]')?.focus();save();return;}if(a==='review')r.reviewed=!r.reviewed;else if(a==='coverage'){state.view='coverage';removePending=false;}else if(a==='next'){if(r.id==='LO-1'&&state.children.length)state.active=state.children[0].id;else if(i>=0&&i<state.children.length-1)state.active=state.children[i+1].id;else state.view='coverage';removePending=false;}else if(a==='up'&&i>0){[state.children[i-1],state.children[i]]=[state.children[i],state.children[i-1]];state.confirmed=false;}else if(a==='down'&&i>=0&&i<state.children.length-1){[state.children[i+1],state.children[i]]=[state.children[i],state.children[i+1]];state.confirmed=false;}else if(a==='remove'){removePending=true;}else if(a==='cancel-remove'){removePending=false;}else if(a==='confirm-remove'&&i>=0){state.lastRemoved={record:{...r},index:i};state.children.splice(i,1);state.active='LO-1';state.view='coverage';removePending=false;state.confirmed=false;}else if(a==='undo'&&state.lastRemoved){state.children.splice(Math.min(state.lastRemoved.index,state.children.length),0,state.lastRemoved.record);state.lastRemoved=null;state.confirmed=false;}else if(a==='add'&&state.children.length<6){const id='EO-1.'+state.nextId++;state.children.push({id,short:'New enabling objective',statement:'',level:'Apply',contribution:'',content:'',support:'',reviewed:false});state.active=id;state.view='objective';state.confirmed=false;}else if(a==='confirm'){if(!state.parent.statement.trim()||!state.parent.conditions.trim()||!state.parent.criteria.trim()||state.children.some(x=>!x.statement.trim()||!x.contribution.trim()))error='Define the main performance, conditions, criteria, and each enabling objective’s statement and contribution.';else{state.confirmed=true;state.view='next';}}else if(a==='pause'){state.view='paused';state.panel=null;}else if(a==='resume')state.view='objective';render();save();focusFirst();announce(error||'Objective review updated.');});
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(!saved||(root.contains(document.activeElement)&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)))return;clearTimeout(timer);restore(saved);render();});
})();
</script>
